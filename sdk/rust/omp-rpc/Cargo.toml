[package]
name = "omp-rpc"
version = "0.1.0"
edition = "2024"
description = "Rust client for the omp RPC protocol (`omp --mode rpc`)"
license = "MIT"
publish = false

[lib]
name = "omp_rpc"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Empty, not `workspace = true`: this crate is held to default clippy and zero
# rustc warnings like the other non-opted-in members. Most of it is the
# `bun run gen:rpc` output in src/wire.rs, and the hand-written half is sample
# client code the workspace's pedantic/nursery policy would rewrite wholesale
# (283 findings when it was tried). Opting in is its own change.
[lints]
