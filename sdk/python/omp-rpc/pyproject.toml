[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-rpc"
version = "0.1.0"
description = "Typed Python client for the omp coding-agent RPC protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stencil Labs, Inc." }]
keywords = ["omp", "rpc", "agent", "coding-agent", "jsonl", "stdio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://omp.sh/"
Repository = "https://github.com/can1357/oh-my-pi"
Documentation = "https://github.com/can1357/oh-my-pi/blob/main/docs/rpc.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omp_rpc = ["py.typed"]

# `bun run lint:py:sdk` (part of `lint:py`, and what CI runs) reads this.
[tool.ruff.lint]
# Named rather than ruff's default, which differs by version: ruff 0.17.3
# enables more rules by default than ruff 0.15.0.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# _wire.py is written by `bun run gen:rpc`, and generated.test.ts pins its
# bytes. Markdown: ruff 0.17.3 formats README code blocks, ruff 0.15.0 does not.
exclude = ["src/omp_rpc/_wire.py", "*.md"]
