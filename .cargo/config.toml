# Embedded Python: omp-demo statically links the vendored python-build-standalone
# CPython (see crates/py/scripts/fetch-python.sh). The config file tells pyo3 to link
# libpython statically instead of introspecting an installed interpreter.
#
# On macOS, dev builds use vendor/python (freethreaded+debug, fast native link);
# release builds override PYO3_CONFIG_FILE=vendor/python-release/pyo3-config.txt
# (freethreaded+pgo+lto, linked with Homebrew lld via crates/py/scripts/ld64.lld).

[env]
PYO3_CONFIG_FILE = { value = "vendor/python/pyo3-config.txt", relative = true }
# The llama-cpp-2 CMake build hangs under the Makefile generator because the cmake crate forwards
# cargo's jobserver via MAKEFLAGS,
# and Xcode's GNU make 3.81 blocks forever reading a jobserver pipe whose write
# end doesn't survive `cmake -E env` (observed wedging the whole build-dir
# lock queue). Ninja schedules itself and ignores make's jobserver protocol.
CMAKE_GENERATOR = "Ninja"

# Dev links go through ld64.lld as well: the 652 MB statically-linked CPython
# images overflow ld64's compact-unwind fast path (__eh_frame > 16 MB), and
# lld links them several times faster. Same shim the release tree uses.
[target.aarch64-apple-darwin]
# The parallel rustc frontend fills the serial tail where only a few workspace
# crates remain. Eight is rustc's best-tested setting; Cargo's jobserver prevents
# oversubscription while many crates compile. Requires the pinned nightly.
rustflags = [
	"-C", "link-arg=--ld-path=/opt/homebrew/bin/ld64.lld",
	"-Z", "threads=8",
]
# Store each crate's metadata only in its .rmeta instead of duplicating it into
# every rlib. Measured on a reqwest-sized graph: 196 MB -> 130 MB target dir at
# identical build times. Requires the pinned nightly (rust-toolchain.toml).
# The accepted spelling is toolchain-coupled: cargo took `"DoNotEmbed"` before
# ~2026-08 and a bare boolean after. This matches nightly-2026-08-08; if you
# bump rust-toolchain.toml backwards, switch to `"DoNotEmbed"`.
[unstable]
embed-metadata = false
# Selective dependency hints in Cargo.toml defer codegen for broad APIs until
# consumers actually call them. Requires the pinned nightly.
profile-hint-mostly-unused = true
# Enables the `codegen-backend` profile keys below (workspace members build
# with cranelift; see [profile.dev]).
codegen-backend = true
# Freshness by content checksum instead of mtime: concurrent agent sessions,
# git operations, and no-op formatter rewrites stop invalidating artifacts
# whose sources did not actually change.
checksum-freshness = true
# Enables [resolver] feature-unification below.
feature-unification = true

# Resolve features as if the whole workspace were built at once, so
# `cargo <cmd> -p <crate>` and `--workspace` invocations share one artifact
# per dependency instead of compiling per-invocation feature variants of the
# same crate into the shared target dir.
[resolver]
feature-unification = "workspace"
# Config profiles outrank manifest profiles, so a user-global
# ~/.cargo/config.toml [profile.dev] (e.g. line-tables-only + unpacked
# split-debuginfo) would silently re-inflate the target dir with retained
# .rcgu.o files. Pin the workspace decision here: dev carries no debuginfo
# (see Cargo.toml [profile.dev] for rationale).
[profile.dev]
debug = false
split-debuginfo = "off"
# Cranelift backend for workspace members: several times faster codegen than
# LLVM at opt-level 0 for the crates we actually iterate on. Dependencies stay
# on LLVM (below): they rebuild rarely, and the inline-asm/SIMD crates live
# there. Members must stay free of link-section registration magic
# (inventory/ctor/linkme `__mod_init_func`/custom-section statics) — cranelift
# rejects those loudly at compile time. Requires the
# rustc-codegen-cranelift-preview component (rust-toolchain.toml).
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"
# omp-ar monomorphizes xutf's AArch64 NEON transcoder; Cranelift replaces its
# unsupported `vsli` intrinsic with a trap.
[profile.dev.package.omp-ar]
codegen-backend = "llvm"
# omp-con declarations use linkme distributed slices so vars, commands, and
# actions declared by downstream crates register without a central roster.
[profile.dev.package.omp-con]
codegen-backend = "llvm"
# Telemetry hooks are fail-open across user callbacks and rely on
# `catch_unwind`; cranelift does not emit the required landing pads.
[profile.dev.package.omp-observability]
codegen-backend = "llvm"
[profile.dev.build-override]
codegen-backend = "llvm"
[profile.release]
debug = false
split-debuginfo = "off"
