[package]
name = "rivers-of-pk"
version = "0.1.0"
edition = "2021"
description = "Isometric architecture TUI for oh-my-pk"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
