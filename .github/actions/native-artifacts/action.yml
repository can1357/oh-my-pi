name: "Install native addon artifacts"
description: >
   Downloads the native addons built once by the native_addons jobs and
   installs exact targets without invoking Bazel. The linux-x64 addons ship as
   per-leg `natives-linux-x64-<variant>` artifacts; the cross targets as
   per-target `natives-cross-<target>` artifacts, fetched only when a
   requested target needs them. On omp-kata pods the linux-x64 addons are
   first restored from the in-cluster stash native_addons writes to the
   shared runner-cache PVC, skipping the artifact download.

inputs:
   targets:
      description: Space-separated scripts/bazel-natives.ts target names
      required: true
   dest:
      description: Destination directory for the .node files
      required: false
      default: packages/natives/native
   stash-run:
      description: >
         Run id whose in-cluster stash index native_addons wrote
         (run-<id>/<artifact-relative path>.sha256). Used only where the stash
         directory is mounted; any missing or mismatched entry falls back to
         the artifact download.
      required: false
      default: ""

runs:
   using: composite
   steps:
      - name: Resolve required artifacts
        id: need
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           STASH_RUN: ${{ inputs.stash-run }}
        run: |
           set -euo pipefail
           read -r -a targets <<< "$NATIVE_TARGETS"
           if [ "${#targets[@]}" -eq 0 ]; then
             echo "::error::At least one native addon target is required"
             exit 1
           fi
           x64=()
           rest=false
           for t in "${targets[@]}"; do
             case "$t" in
               linux-x64-baseline|linux-x64-modern) x64+=("$t") ;;
               *) rest=true ;;
             esac
           done
           # ci.yml uploads cross targets on non-PR events only.
           if [ "$rest" = true ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
             echo "::error::PR runs only publish linux-x64 addons; targets outside linux-x64-baseline/linux-x64-modern are unavailable: $NATIVE_TARGETS"
             exit 1
           fi
           # Written by ci.yml native_addons ("Stage native addons for
           # consumers"); keep the layout in sync with it.
           stash_dir=/opt/bazel-repo-cache/ci-natives
           out="$RUNNER_TEMP/omp-native-artifacts"
           need_x64=false
           if [ "${#x64[@]}" -gt 0 ]; then
             need_x64=true
             index="$stash_dir/run-$STASH_RUN"
             if [ -n "$STASH_RUN" ] && [ -d "$index" ]; then
               restored=true
               for t in "${x64[@]}"; do
                 rel="natives-$t/pi_natives.$t.node"
                 sha="$(cat "$index/$rel.sha256" 2>/dev/null || true)"
                 mkdir -p "$out/natives-$t"
                 if [ -z "$sha" ] || ! cp "$stash_dir/$sha.node" "$out/$rel" 2>/dev/null \
                   || [ "$(sha256sum "$out/$rel" | cut -d' ' -f1)" != "$sha" ]; then
                   restored=false
                   break
                 fi
               done
               if [ "$restored" = true ]; then
                 echo "linux-x64 addons restored from the in-cluster stash"
                 need_x64=false
               else
                 echo "::warning title=Native addon stash miss::falling back to the natives-linux-x64-* artifacts"
                 for t in "${x64[@]}"; do rm -f "$out/natives-$t/pi_natives.$t.node"; done
               fi
             fi
           fi
           echo "x64=$need_x64" >> "$GITHUB_OUTPUT"
           echo "rest=$rest" >> "$GITHUB_OUTPUT"

      - name: Download linux-x64 native addon artifacts
        if: steps.need.outputs.x64 == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           pattern: natives-linux-x64-*
           merge-multiple: true
           path: ${{ runner.temp }}/omp-native-artifacts

      - name: Download cross native addon artifacts
        if: steps.need.outputs.rest == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           pattern: natives-cross-*
           merge-multiple: true
           path: ${{ runner.temp }}/omp-native-artifacts

      - name: Install native addon targets
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_DEST: ${{ inputs.dest }}
        run: |
           set -euo pipefail
           read -r -a targets <<< "$NATIVE_TARGETS"
           bun scripts/bazel-natives.ts "${targets[@]}" \
             --source "$RUNNER_TEMP/omp-native-artifacts" \
             --dest "$NATIVE_DEST"
