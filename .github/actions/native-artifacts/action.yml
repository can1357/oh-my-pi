name: "Install native addon artifacts"
description: >
   Downloads the native addons built once by the native_addons jobs and
   installs exact targets without invoking Bazel. The linux-x64 pair ships as
   its own small `natives-linux-x64` artifact; the rest (`native-addons`) is
   fetched only when a requested target needs it. On omp-kata pods the pair is
   first restored from the in-cluster stash native_addons writes to the shared
   runner-cache PVC, skipping the artifact download.

inputs:
   targets:
      description: Space-separated scripts/bazel-natives.ts target names
      required: true
   dest:
      description: Destination directory for the .node files
      required: false
      default: packages/natives/native
   stash:
      description: >
         native_addons `stash` output ("<artifact-relative path>=<sha256>"
         pairs). Used only where the stash directory is mounted; any missing
         or mismatched entry falls back to the artifact download.
      required: false
      default: ""

runs:
   using: composite
   steps:
      - name: Resolve required artifacts
        id: need
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_STASH: ${{ inputs.stash }}
        run: |
           set -euo pipefail
           read -r -a targets <<< "$NATIVE_TARGETS"
           if [ "${#targets[@]}" -eq 0 ]; then
             echo "::error::At least one native addon target is required"
             exit 1
           fi
           x64=false
           rest=false
           for t in "${targets[@]}"; do
             case "$t" in
               linux-x64-baseline|linux-x64-modern) x64=true ;;
               *) rest=true ;;
             esac
           done
           # ci.yml uploads `native-addons` on non-PR events only.
           if [ "$rest" = true ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
             echo "::error::PR runs only publish natives-linux-x64; targets outside linux-x64-baseline/linux-x64-modern are unavailable: $NATIVE_TARGETS"
             exit 1
           fi
           # Written by ci.yml native_addons ("Stage native addons for
           # consumers"); keep the directory in sync with it.
           stash_dir=/opt/bazel-repo-cache/ci-natives
           out="$RUNNER_TEMP/omp-native-artifacts"
           if [ "$x64" = true ] && [ -n "$NATIVE_STASH" ] && [ -d "$stash_dir" ]; then
             read -r -a entries <<< "$NATIVE_STASH"
             restored=true
             for entry in "${entries[@]}"; do
               rel="${entry%%=*}"
               sha="${entry##*=}"
               mkdir -p "$out/$(dirname "$rel")"
               if ! cp "$stash_dir/$sha.node" "$out/$rel" 2>/dev/null \
                 || [ "$(sha256sum "$out/$rel" | cut -d' ' -f1)" != "$sha" ]; then
                 restored=false
                 break
               fi
             done
             if [ "$restored" = true ]; then
               echo "linux-x64 addons restored from the in-cluster stash"
               x64=false
             else
               echo "::warning title=Native addon stash miss::falling back to the natives-linux-x64 artifact"
               for entry in "${entries[@]}"; do rm -f "$out/${entry%%=*}"; done
             fi
           fi
           echo "x64=$x64" >> "$GITHUB_OUTPUT"
           echo "rest=$rest" >> "$GITHUB_OUTPUT"

      - name: Download linux-x64 native addon artifact
        if: steps.need.outputs.x64 == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           name: natives-linux-x64
           path: ${{ runner.temp }}/omp-native-artifacts

      - name: Download remaining native addon artifacts
        if: steps.need.outputs.rest == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           name: native-addons
           path: ${{ runner.temp }}/omp-native-artifacts

      - name: Install native addon targets
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_DEST: ${{ inputs.dest }}
        run: |
           set -euo pipefail
           read -r -a targets <<< "$NATIVE_TARGETS"
           bun scripts/bazel-natives.ts "${targets[@]}" \
             --source "$RUNNER_TEMP/omp-native-artifacts" \
             --dest "$NATIVE_DEST"
