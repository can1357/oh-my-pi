name: Native macOS objective
description: Provision native tools and execute the reviewed Rust or lint objective.
inputs:
  objective:
    description: rust or lint_macos
    required: true
  source-directory:
    description: Candidate source checkout
    default: '.'
  control-directory:
    description: Reviewed control checkout
    default: '.'
  min-free-gb:
    description: Minimum free build disk
    default: '60'
  guarded:
    description: Supervise the worker with the parent admission guard
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select pinned Rust toolchain
      if: inputs.guarded != 'true'
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: |
        test "$(uname -m)" = arm64
        rustup show active-toolchain
        if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
        fi
    - uses: ./.github/actions/macos-native-tools
    - name: Install cargo-nextest
      if: inputs.objective == 'rust' && runner.environment == 'github-hosted'
      uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
      with:
        tool: nextest@0.9.146
    - name: Check provisioned cargo-nextest
      if: inputs.guarded != 'true' && inputs.objective == 'rust' && runner.environment != 'github-hosted'
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      run: cargo nextest show-config version
    - uses: ./.github/actions/macos-build-state
      if: inputs.guarded != 'true'
      with:
        min-free-gb: ${{ inputs.min-free-gb }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      if: runner.environment == 'github-hosted'
    - name: Execute native objective
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        CONTROL_DIRECTORY: ${{ inputs.control-directory }}
        OBJECTIVE: ${{ inputs.objective }}
        GUARDED: ${{ inputs.guarded }}
        CI_MIN_FREE_GB: ${{ inputs.min-free-gb }}
      run: |
        control="$GITHUB_WORKSPACE/$CONTROL_DIRECTORY"
        if [ "$GUARDED" = true ]; then
          export MACOS_WORKER=true
          python3 "$control/scripts/macos_worker_guard.py" run --request-file "$RUNNER_TEMP/macos-request.json" --result-file "$RUNNER_TEMP/macos-result.json" -- python3 scripts/macos_worker_state.py -- bash scripts/ci-macos-objective.sh "$OBJECTIVE"
        else
          bash "$control/scripts/ci-macos-objective.sh" "$OBJECTIVE"
        fi
