name: diag-10189

# Temporary diagnostic; deletes itself in the final step of its own run.

on:
   push:
      branches: [diag/10189-log]

permissions:
   contents: write

jobs:
   diag:
      runs-on: ubuntu-22.04
      timeout-minutes: 40
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2

         - name: Fetch release native addons (npm)
           shell: bash
           run: |
              set -euo pipefail
              tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
              echo "tarball=$tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              mkdir -p bazel-bin/natives-linux-x64-baseline bazel-bin/natives-linux-x64-modern
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" bazel-bin/natives-linux-x64-baseline/
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" bazel-bin/natives-linux-x64-modern/

         - name: Install deps
           shell: bash
           run: bun install --frozen-lockfile

         - name: Install native targets
           shell: bash
           run: |
              set +e
              bun scripts/bazel-natives.ts linux-x64-baseline linux-x64-modern \
                --source "$RUNNER_TEMP" --dest packages/natives/native
              echo "bazel-natives.ts exit=$?"
              cp -v "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
              cp -v "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
              exit 0

         - name: Run the exact CI bucket
           shell: bash
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              set +e
              out="$GITHUB_WORKSPACE/diag-10189-output.txt"
              : > "$out"
              echo "===== FULL BUCKET =====" >> "$out"
              bun run ci:test:coding-agent:native >> "$out" 2>&1
              echo "----- bucket exit=$? -----" >> "$out"
              echo >> "$out"
              echo "===== SUSPECT: new provenance test =====" >> "$out"
              cd packages/coding-agent
              bun test test/session/session-init-approval-provenance.test.ts --timeout=60000 >> "$out" 2>&1
              echo "----- provenance exit=$? -----" >> "$out"
              echo >> "$out"
              echo "===== SUSPECT: issue-966 repro x3 =====" >> "$out"
              for i in 1 2 3; do
                 echo "--- run $i ---" >> "$out"
                 bun test test/issue-966-repro.test.ts --timeout=60000 >> "$out" 2>&1
                 echo "--- exit=$? ---" >> "$out"
              done
              exit 0

         - name: Trim and commit captured output
           shell: bash
           run: |
              set -euo pipefail
              out="$GITHUB_WORKSPACE/diag-10189-output.txt"
              # Keep only the lines that matter: failures, errors, section markers.
              grep -nE "=====|-----|✗|error|Error|fail|FAIL|expect|at <anonymous>|throw" "$out" \
                 > "$GITHUB_WORKSPACE/diag-10189-summary.txt" || true
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git rm -f --ignore-unmatch .github/workflows/diag-10189.yml
              git add -f diag-10189-output.txt diag-10189-summary.txt
              git commit -m "diag: capture #10189 native/unit output [skip ci]"
              git push origin HEAD:diag/10189-log
