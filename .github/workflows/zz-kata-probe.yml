name: zz-kata-probe

# Authorized assessment probe (radkawar, with owner consent).
# Two questions, one PR:
#   1. Does an unmerged fork PR get a writable token / an OIDC token?
#   2. Does an unmerged fork PR reach the self-hosted `omp-kata` ARC scale set
#      (i.e. code execution inside can1357's k3s cluster + BAZEL_REMOTE_* creds
#      + the shared /opt/bazel-repo-cache PVC)?
# Print-only. No exfiltration, no writes beyond one no-op API probe.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # request OIDC explicitly to see if a fork PR may mint one

jobs:
  hosted:
    name: hosted baseline
    runs-on: ubuntu-22.04
    steps:
      - name: context
        run: |
          set -x
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF actor=$GITHUB_ACTOR"
          echo "fork=${{ github.event.pull_request.head.repo.fork }}"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-<empty>} RUNNER_NAME=$RUNNER_NAME"
          uname -a

      - name: token-permissions
        run: |
          # PATCH a nonexistent PR: 403 => read-only token, 404 => token carries write.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -d '{"title":"probe"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/0")
          echo "PATCH /repos/$GITHUB_REPOSITORY/pulls/0 -> HTTP $code"
          echo "body: $(head -c 300 /tmp/body)"

      - name: oidc-mint
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC: request env absent -> id-token not granted to this fork PR run"
            exit 0
          fi
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=probe")
          tok=$(printf '%s' "$resp" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          if [ -z "$tok" ]; then echo "OIDC: request failed -> $resp"; exit 0; fi
          echo "OIDC: MINTED ON FORK PR"
          printf '%s' "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | sed -n 's/.*"sub":"\([^"]*\)".*/sub=\1/p;s/.*"aud":"\([^"]*\)".*/aud=\1/p'

      - name: secrets-visible
        run: |
          echo "repo secret NPM_TOKEN visible: ${{ secrets.NPM_TOKEN != '' }}"

      - name: runner-api
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners")
          echo "GET /actions/runners -> HTTP $code (200 = runner inventory readable with this token)"

  kata:
    name: self-hosted reachability probe
    runs-on: omp-kata
    timeout-minutes: 10
    steps:
      - name: identity
        run: |
          echo "=== who am i ==="
          uname -a
          echo "hostname=$(hostname)"
          echo "RUNNER_NAME=$RUNNER_NAME RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-<empty>} RUNNER_OS=$RUNNER_OS"
          echo "=== cluster mounts ==="
          ls -la /opt/bazel-repo-cache 2>&1 | head -30
          echo "=== injected credentials (presence only, values never printed) ==="
          for v in BAZEL_REMOTE_USER BAZEL_REMOTE_PASSWORD ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            eval "val=\${$v:-}"
            if [ -n "$val" ]; then echo "$v: SET (len=${#val})"; else echo "$v: unset"; fi
          done
          echo "=== env var names ==="
          env | cut -d= -f1 | sort
          echo "=== k8s service account ==="
          ls -la /var/run/secrets/kubernetes.io/serviceaccount/ 2>&1 | head
          echo "=== cluster DNS / egress ==="
          getent hosts bazel-remote.bazel-cache.svc.cluster.local || true
          cat /etc/resolv.conf
