name: CI

on:
  # Always start the cheap selector; expensive jobs have independent path scopes.
  push:
    branches: [main, omp2]
  # No `paths` filter here on purpose: a workflow that a path filter keeps out
  # never reports its jobs, and the required checks would stay pending. The
  # `changes` job below reads .github/ci-job-paths.json instead, and every other
  # job is skipped, which a required check counts as passing.
  pull_request:
    branches: [main, omp2]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Pin admission/transport separately from the exact candidate's native commands.
  CI_MACOS_WORKER_REF: ci-macos-worker-source-bound-v4
  CI_MACOS_WORKER_SHA: 6e361f2d70c505aa38c9ad6aaf359cb9b5cd457b
  CI_MACOS_CONTROL_POLICY: source-bound

jobs:
  # Native jobs default to hosted; the two macOS checks use their version-pinned
  # hosted-first workers for eligible requests. CI_LINUX_MODE/CI_LINUX_RUNNER/MACOS_RUNNER retain their
  # existing behavior only for the BuildBuddy-capable lintx_ratchet, runtime_spec,
  # remote_linux and remote_seed jobs; their trust and remote execution stay
  # unchanged. Each remaining self-hosted-capable runs-on routes fork pull
  # requests to hosted first, checked by `just check-ci-paths`.
  #
  # Required contexts stay declared; unrelated jobs skip instead of staying
  # pending. PRs and valid pushes use per-job dependencies. Missing outputs
  # remain fail-closed through each job's != 'false' gate.
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.paths.outputs.ci }}
      rust: ${{ steps.paths.outputs.rust }}
      affected: ${{ steps.paths.outputs.affected }}
      format: ${{ steps.paths.outputs.format }}
      format_rust: ${{ steps.paths.outputs.format_rust }}
      protobuf: ${{ steps.paths.outputs.protobuf }}
      lintx_ratchet: ${{ steps.paths.outputs.lintx_ratchet }}
      runtime_spec: ${{ steps.paths.outputs.runtime_spec }}
      extensions_conformance: ${{ steps.paths.outputs.extensions_conformance }}
      licenses: ${{ steps.paths.outputs.licenses }}
      lint_macos: ${{ steps.paths.outputs.lint_macos }}
      lint_linux: ${{ steps.paths.outputs.lint_linux }}
      p9_p10_linux: ${{ steps.paths.outputs.p9_p10_linux }}
      p7_linux: ${{ steps.paths.outputs.p7_linux }}
      remote_linux: ${{ steps.paths.outputs.remote_linux }}
      macos_controls: ${{ steps.paths.outputs.macos_controls }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select checks from changed paths and their dependencies
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci_scope.py --workflow ci --github-output "$GITHUB_OUTPUT"

  affected:
    name: Affected crates (opt-in)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && vars.CI_AFFECTED_ONLY == 'true' && needs.changes.outputs.affected != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      args: ${{ steps.scope.outputs.args }}
      doc_args: ${{ steps.scope.outputs.doc_args }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: List the crates the change can affect
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/affected-crates.py --base "$BASE" --exclude omp-e2e --github-output "$GITHUB_OUTPUT"

  format:
    name: Rust format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.format != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        if: needs.changes.outputs.format_rust != 'false'
        run: rustup show active-toolchain
      - name: Check formatting
        if: needs.changes.outputs.format_rust != 'false'
        run: cargo fmt --all -- --check
      - name: Check the CI gate
        run: python3 scripts/check-ci-paths.py
      - name: Test the CI gate script
        run: python3 scripts/test_check_ci_paths.py
      - name: Test hosted runner policy
        run: python3 scripts/test_hosted_runners.py
      - name: Test path and dependency classification
        run: python3 scripts/test_ci_scope.py
      - name: Test optional workflow selection
        run: python3 scripts/test_ci_optional_workflows.py
      - name: Test the affected-crates script
        run: python3 scripts/test_affected_crates.py
      - name: Check the editing discipline of repo text
        run: python3 scripts/check-editing-discipline.py

  # crates/proto/proto holds the wire contracts other processes speak. `just lint`
  # and `just fmt-check` already run buf locally; this is the CI half. The binary is
  # the pinned release asset, verified against the checksum in buf's sha256.txt.
  protobuf:
    name: Protobuf format and lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.protobuf != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned buf
        env:
          BUF_VERSION: 1.73.0
          BUF_SHA256: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
          # Retain the pinned Darwin asset for an explicit manual invocation.
          BUF_SHA256_DARWIN_ARM64: 6e6df0fef4522e4e43dfe7c341873c3f2c29ceb45a9dfa5e0bad5580b8b2022f
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) asset=buf-Linux-x86_64 sha=$BUF_SHA256 ;;
            macOS/ARM64) asset=buf-Darwin-arm64 sha=$BUF_SHA256_DARWIN_ARM64 ;;
            *) echo "::error::no pinned buf binary for $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/${asset}" \
            --output "$RUNNER_TEMP/bin/buf"
          # macOS has a BSD sha256sum without --check/--status; shasum has both.
          if [ "$RUNNER_OS" = macOS ]; then
            printf '%s  %s\n' "$sha" "$RUNNER_TEMP/bin/buf" | shasum -a 256 --check --status
          else
            printf '%s  %s\n' "$sha" "$RUNNER_TEMP/bin/buf" | sha256sum --check --status
          fi
          chmod 0755 "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check Protobuf formatting
        working-directory: crates/proto
        run: buf format -d --exit-code
      - name: Lint Protobuf schemas
        working-directory: crates/proto
        run: buf lint
      # Packages whose two ends can run different builds (envd Hello range, the
      # build-stable docserver, gateway/auth/blob/inference daemons) must keep tags
      # and types stable; prost drops unknown fields silently (ADR 0048 §11).
      - name: Fetch PR base for the breaking check
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Check Protobuf wire compatibility against the PR base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          BASE_REF="${BASE_REF#refs/heads/}"
          base="$RUNNER_TEMP/proto-base"
          mkdir -p "$base"
          git archive "refs/remotes/origin/${BASE_REF}" crates/proto | tar -x -C "$base"
          buf breaking crates/proto --against "$base/crates/proto"

  # ADR 0035: lintx counts bare-string error variants and formatted error
  # values per crate and fails a crate whose count rose above
  # tools/lintx/baselines/error-formatting.toml. lintx is its own Cargo
  # workspace (not a member of the root one), so it is built and tested here.
  lintx_ratchet:
    name: Error-formatting ratchet (lintx)
    needs: [changes, format]
    if: ${{ !cancelled() && needs.changes.outputs.lintx_ratchet != 'false' }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.CI_LINUX_MODE == 'remote' && (vars.CI_LINUX_RUNNER || vars.MACOS_RUNNER) || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        if: runner.environment == 'github-hosted'
        run: rustup show active-toolchain
      - name: Cache lintx build
        if: runner.environment == 'github-hosted'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/lintx/target
          key: lintx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lintx/Cargo.lock', 'tools/lintx/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Test lintx
        if: runner.environment == 'github-hosted'
        run: cargo test --locked --manifest-path tools/lintx/Cargo.toml
      - name: Check the error-formatting ratchet
        if: runner.environment == 'github-hosted'
        run: cargo run --quiet --release --locked --manifest-path tools/lintx/Cargo.toml -- --ratchet tools/lintx/baselines/error-formatting.toml crates

      # vars.CI_LINUX_MODE=remote, on the self-hosted Mac: the github-hosted steps above are
      # skipped and `just ci-lintx-ratchet` runs the same commands on BuildBuddy.
      - name: Decide whether this run may use the BuildBuddy key
        id: trust
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/buildbuddy-remote
        with:
          has-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY != '' }}
      - name: Test lintx and check the ratchet on BuildBuddy
        if: steps.trust.outputs.remote == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: scripts/remote-verify.sh ci-lintx-ratchet

  runtime_spec:
    name: Runtime symbol and dependency contracts
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.runtime_spec != 'false' }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.CI_LINUX_MODE == 'remote' && (vars.CI_LINUX_RUNNER || vars.MACOS_RUNNER) || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        if: runner.environment == 'github-hosted'
        run: rustup show active-toolchain
      - name: Generate and validate runtime specification
        if: runner.environment == 'github-hosted'
        run: cargo -Zscript scripts/check-spec.rs -- target/runtime-symbol-spec.json

      # vars.CI_LINUX_MODE=remote, on the self-hosted Mac: the github-hosted steps above are
      # skipped and `just ci-runtime-spec` runs the same commands on BuildBuddy.
      - name: Decide whether this run may use the BuildBuddy key
        id: trust
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/buildbuddy-remote
        with:
          has-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY != '' }}
      - name: Generate and validate runtime specification on BuildBuddy
        if: steps.trust.outputs.remote == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: scripts/remote-verify.sh ci-runtime-spec

  # ADR 0049 D5: wave-1 first-party extensions against frozen omp.* (stdlib + stubs).
  # Informational — not listed in .github/rulesets/omp2-protected.json required checks.
  extensions_conformance:
    name: First-party extension conformance
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.extensions_conformance != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Extension conformance (manifests, unittests, frozen API smoke)
        run: python3 scripts/check-extension-conformance.py

  licenses:
    name: License policy and release notices
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.licenses != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      # Building these three from source took about five minutes of a
      # ten-second check. The versions are pinned, so the binaries are too.
      - name: Cache pinned compliance tools
        id: compliance-tools
        if: runner.environment == 'github-hosted'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/just
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
          key: compliance-tools-${{ runner.os }}-${{ runner.arch }}-just-1.58.0-cargo-deny-0.20.2-cargo-about-0.8.2
      - name: Install pinned compliance tools
        if: runner.environment == 'github-hosted' && steps.compliance-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 1.58.0 just
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.8.2 cargo-about
      # Retain the non-hosted provisioning path for explicit manual reuse;
      # this job itself always selects a standard GitHub-hosted runner.
      - name: Install pinned cargo-deny release
        if: runner.environment != 'github-hosted'
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = macOS/ARM64
          just --version
          name="cargo-deny-${DENY_VERSION}-aarch64-apple-darwin"
          curl --fail --location --silent --show-error \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${name}.tar.gz" \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz"
          printf '%s  %s\n' "$DENY_SHA256" "$RUNNER_TEMP/cargo-deny.tar.gz" | shasum -a 256 --check --status
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-deny"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/$name/cargo-deny" "$RUNNER_TEMP/bin/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check license policy and release notices
        run: just license-check

  # A push to omp2 or main is almost always a pull request's merge commit.
  # A pull request run does not test its head: actions/checkout checks out
  # refs/pull/N/merge, the head merged into the base of that moment. When the
  # base has not moved since, the merge commit has exactly that tree, and
  # running `rust` again only occupies the macOS runner for another 8-15
  # minutes per merge. This job finds the merged pull request, reads the tree
  # each successful `rust` run on its head recorded (the `proved-tree` notice,
  # written by that job's last step), and compares it with the pushed tree.
  # Comparing against the head's own tree never matches a merge commit, so
  # an earlier version of this job never skipped anything.
  # `rust` skips only on an exact match; anything else (a direct push, a base
  # that moved, a run from before the notice existed, an API error, a failure
  # of this job) leaves `verified` unset and `rust` runs as before.
  push_verified:
    name: Pushed tree already verified
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.changes.outputs.rust != 'false' || needs.changes.outputs.lint_macos != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verified: ${{ steps.tree.outputs.verified }}
    steps:
      - name: Match the pushed tree to a green pull request run
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK: Rust workspace and acceptance proofs
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].head.sha // empty")
          pushed=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha)
          encoded=$(jq -rn --arg name "$CHECK" '$name | @uri')
          # A merge queue pushes the very commit its merge_group run tested, so $SHA
          # itself can carry the proof; a plain merge carries it on the pull request head.
          for commit in "$SHA" $head; do
            runs=$(gh api --paginate "repos/$REPO/commits/$commit/check-runs?check_name=$encoded&filter=all" \
              --jq '.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .id') || true
            for run in $runs; do
              proved=$(gh api "repos/$REPO/check-runs/$run/annotations" \
                --jq '[.[] | select(.title == "proved-tree") | .message][0] // empty')
              if [ "$proved" = "$pushed" ]; then
                echo "Tree $pushed already passed '$CHECK' (check run $run on $commit); skipping the macOS job"
                echo "verified=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Check run $run proved tree '${proved:-unrecorded}', not $pushed"
            done
          done
          echo "No successful '$CHECK' run proved tree $pushed on $SHA or its pull request head; running the macOS job"

  rust:
    name: Rust workspace and acceptance proofs
    needs: [changes, push_verified, affected]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.push_verified.outputs.verified != 'true' }}
    runs-on: ${{ (github.repository == 'blyzer/oh-my-pi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'omp2') || (github.event_name == 'push' && github.ref == 'refs/heads/omp2') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/omp2'))) && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: ${{ (github.repository == 'blyzer/oh-my-pi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'omp2') || (github.event_name == 'push' && github.ref == 'refs/heads/omp2') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/omp2'))) && 330 || 120 }}
    permissions:
      contents: read
      actions: write
    env:
      MACOS_CONTROLLER: ${{ github.repository == 'blyzer/oh-my-pi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'omp2') || (github.event_name == 'push' && github.ref == 'refs/heads/omp2') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/omp2')) }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      AFFECTED_SCOPE: ${{ needs.affected.outputs.scope }}
      AFFECTED_ARGS: ${{ needs.affected.outputs.args }}
      AFFECTED_DOC_ARGS: ${{ needs.affected.outputs.doc_args }}
    steps:
      - name: Check out direct native source
        if: env.MACOS_CONTROLLER != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run native objective
        if: env.MACOS_CONTROLLER != 'true'
        uses: ./.github/actions/macos-native-objective
        with:
          objective: rust
          source-directory: .
          control-directory: .
          min-free-gb: ${{ vars.CI_MIN_FREE_GB || '60' }}
      - name: Check out reviewed macOS controller
        if: env.MACOS_CONTROLLER == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CI_MACOS_WORKER_SHA }}
          path: .ci-control
          persist-credentials: false
      - name: Coordinate macOS objective
        if: env.MACOS_CONTROLLER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MACOS_FALLBACK_ENABLED: ${{ vars.CI_MACOS_FALLBACK_ENABLED || 'true' }}
          CI_MACOS_FALLBACK_TRUST: ${{ vars.CI_MACOS_FALLBACK_TRUST || 'repository-writers' }}
          CI_MACOS_FALLBACK_LABELS: ${{ vars.CI_MACOS_FALLBACK_LABELS || '["self-hosted","macOS","ARM64"]' }}
        run: python3 .ci-control/scripts/macos_fallback_controller.py --objective rust

  lint_macos:
    name: Lint workspace (macOS)
    needs: [changes, push_verified]
    if: ${{ !cancelled() && needs.changes.outputs.lint_macos != 'false' && needs.push_verified.outputs.verified != 'true' }}
    runs-on: ${{ (github.repository == 'blyzer/oh-my-pi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'omp2') || (github.event_name == 'push' && github.ref == 'refs/heads/omp2') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/omp2'))) && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: ${{ (github.repository == 'blyzer/oh-my-pi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'omp2') || (github.event_name == 'push' && github.ref == 'refs/heads/omp2') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/omp2'))) && 330 || 45 }}
    permissions:
      contents: read
      actions: write
    env:
      MACOS_CONTROLLER: ${{ github.repository == 'blyzer/oh-my-pi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'omp2') || (github.event_name == 'push' && github.ref == 'refs/heads/omp2') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/omp2')) }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      AFFECTED_SCOPE: full
      AFFECTED_ARGS: ''
      AFFECTED_DOC_ARGS: ''
    steps:
      - name: Check out direct native source
        if: env.MACOS_CONTROLLER != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run native objective
        if: env.MACOS_CONTROLLER != 'true'
        uses: ./.github/actions/macos-native-objective
        with:
          objective: lint_macos
          source-directory: .
          control-directory: .
          min-free-gb: ${{ vars.CI_MIN_FREE_GB || '60' }}
      - name: Check out reviewed macOS controller
        if: env.MACOS_CONTROLLER == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.CI_MACOS_WORKER_SHA }}
          path: .ci-control
          persist-credentials: false
      - name: Coordinate macOS objective
        if: env.MACOS_CONTROLLER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MACOS_FALLBACK_ENABLED: ${{ vars.CI_MACOS_FALLBACK_ENABLED || 'true' }}
          CI_MACOS_FALLBACK_TRUST: ${{ vars.CI_MACOS_FALLBACK_TRUST || 'repository-writers' }}
          CI_MACOS_FALLBACK_LABELS: ${{ vars.CI_MACOS_FALLBACK_LABELS || '["self-hosted","macOS","ARM64"]' }}
        run: python3 .ci-control/scripts/macos_fallback_controller.py --objective lint_macos

  lint_linux:
    name: Lint workspace (Linux)
    needs: [format, changes]
    if: ${{ !cancelled() && needs.changes.outputs.lint_linux != 'false' }}
    runs-on: ubuntu-24.04
    # Clippy plus `just check-minimal-caps` (default `omp-app` and the
    # all-`cap-*`-off profile, different feature unification).
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        # A stalled package mirror once held this step until the whole job timed out. Bounded
        # per-request timeouts and retries move apt to the next mirror, and the step fails fast.
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: test -f vendor/python/pyo3-config.txt

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-lint-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-lint-linux-${{ runner.os }}-${{ runner.arch }}-

      # Ages the checkout so build scripts whose inputs did not change since
      # the cached commit do not rerun (docs/research/ci-test-acceleration.md §3).
      - uses: ./.github/actions/source-mtimes
        with:
          matched-key: ${{ steps.cargo-cache.outputs.cache-matched-key }}

      # `--keep-going` so one crate's violation does not mask the rest: the
      # queue this job exists to drain is only visible if cargo reports every
      # failing crate in a single run rather than stopping at the first.
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked --keep-going

      # ADR 0049 Phase 3. Both the default `omp` profile and the minimal
      # profile (every `cap-*` off) have to build. The recipe also requires
      # the selected `omp-envd` graph to omit omp-desktop, omp-webview,
      # omp-audio, and omp-ssh. It stays in this required job so both
      # profiles gate merges without a second matrix entry.
      - name: Restore pinned just
        id: just-bin
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/just
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
          key: compliance-tools-${{ runner.os }}-${{ runner.arch }}-just-1.58.0-cargo-deny-0.20.2-cargo-about-0.8.2
      - name: Install pinned just
        if: steps.just-bin.outputs.cache-hit != 'true'
        run: cargo install --locked --version 1.58.0 just
      - name: Check default and minimal omp profiles
        run: just check-minimal-caps

      # Only pushes write. A pull request's entry is readable by that pull
      # request alone, and those entries evicted the branch entries every pull
      # request restores from (docs/research/ci-test-acceleration.md §4).
      - name: Save Cargo cache
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # P9-P14 and tool_sources were only ever run by `just e2e`. Nothing in them
  # needs macOS: they drive the production environment host, document
  # authority and embedded-Python extension host over unix sockets and
  # scratch roots, with no PTY and no Apple-only code path. They therefore
  # run here, on a hosted Linux runner, so the single self-hosted Mac (the
  # `rust` job's queue) does not get longer. Same provisioning as p7_linux.
  # Both jobs build the same omp-e2e test graph, so they share one Cargo
  # cache entry; this job is its only writer.
  p9_p10_linux:
    name: Acceptance proofs P9-P14 and tool sources (Linux)
    needs: [format, changes]
    if: ${{ !cancelled() && needs.changes.outputs.p9_p10_linux != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        # A stalled package mirror once held this step until the whole job timed out. Bounded
        # per-request timeouts and retries move apt to the next mirror, and the step fails fast.
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest@0.9.146

      - name: Cache embedded Python
        id: python-cache
        # lint_linux is this key's only writer: three jobs saving it raced
        # ("Unable to reserve cache" in 7 of 30 Linux logs).
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: |
          test -f vendor/python/pyo3-config.txt
          test -x vendor/python/install/bin/python3.14td

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-

      # Ages the checkout so build scripts whose inputs did not change since
      # the cached commit do not rerun (docs/research/ci-test-acceleration.md §3).
      - uses: ./.github/actions/source-mtimes
        with:
          matched-key: ${{ steps.cargo-cache.outputs.cache-matched-key }}

      # `--profile ci` gives e2e tests the whole machine one at a time
      # (`threads-required = "num-cpus"` in .config/nextest.toml), so these
      # proofs never race for sockets or the shared embedded interpreter.
      - name: Run proofs P9-P14
        run: |
          cargo nextest run --profile ci -p omp-e2e --locked \
            --test p9_isolation \
            --test p9_extension_control \
            --test p9_agent_settled \
            --test p9_continuation_grants \
            --test p10_lift_idempotence \
            --test p11_collab_spectator \
            --test p13_remote_exec \
            --test p14_session_attach

      - name: Run tool source routing check
        run: cargo nextest run --profile ci -p omp-e2e --test tool_sources --locked

      # The saved entry also seeds p7_linux, so it carries P7's test binaries.
      - name: Build P7 binaries for the shared cache
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo nextest run --profile ci -p omp-e2e --test p7_tui --test p7_tsp --no-run --locked

      # Only pushes write, and only this job writes the omp-e2e graph
      # (docs/research/ci-test-acceleration.md §4).
      - name: Save Cargo cache
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  p7_linux:
    name: Terminal proof P7 (Linux PTY)
    needs: [format, changes]
    if: ${{ !cancelled() && needs.changes.outputs.p7_linux != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        # A stalled package mirror once held this step until the whole job timed out. Bounded
        # per-request timeouts and retries move apt to the next mirror, and the step fails fast.
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # This job runs the proof through `cargo nextest`, same as the macOS
      # workspace job, so it needs the same provisioning step.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest@0.9.146

      - name: Cache embedded Python
        id: python-cache
        # lint_linux is this key's only writer: three jobs saving it raced
        # ("Unable to reserve cache" in 7 of 30 Linux logs).
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: |
          test -f vendor/python/pyo3-config.txt
          test -x vendor/python/install/bin/python3.14td

      # Restores the omp-e2e graph that p9_p10_linux saves on pushes; this job
      # never writes, so the graph is stored once per ref.
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-

      # Ages the checkout so build scripts whose inputs did not change since
      # the cached commit do not rerun (docs/research/ci-test-acceleration.md §3).
      - uses: ./.github/actions/source-mtimes
        with:
          matched-key: ${{ steps.cargo-cache.outputs.cache-matched-key }}

      - name: Run terminal proof P7 on Linux PTY
        env:
          TERM: xterm-256color
        run: cargo nextest run --profile ci -p omp-e2e --test p7_tui --test p7_tsp --locked

  # ADR 0040: the Linux-valid Cargo verification (`just remote-heavy`) on a
  # BuildBuddy remote runner. The BuildBuddy key reaches every process of the
  # remote run (ADR 0040, Part H.2), so it must never meet code a stranger
  # wrote. A fork's pull request gets no secrets anyway; the job then skips its
  # remote steps and passes, rather than leave this required check pending
  # forever, and the other jobs here still build and test the fork's code.
  # Never move this to `pull_request_target`: that would hand the key to it.
  remote_linux:
    name: Remote Linux verification (BuildBuddy)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.remote_linux != 'false' }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.CI_LINUX_MODE == 'remote' && (vars.CI_LINUX_RUNNER || vars.MACOS_RUNNER) || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Decide whether this run may use the BuildBuddy key
        id: trust
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Whether the secret is set, never its value.
          HAS_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$FORK" = true ]; then
            echo "::notice title=Remote Linux verification skipped::Pull requests from forks get no BuildBuddy key and never run remotely; the other CI jobs still verify this change."
            echo "Skipped: pull request from a fork; the BuildBuddy key is never given to fork code." >> "$GITHUB_STEP_SUMMARY"
            echo "remote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fails closed: a trusted run without the key is a broken setup, not a pass.
          if [ "$HAS_KEY" != true ]; then
            echo "::error title=BuildBuddy key missing::secrets.BUILDBUDDY_ORG_API_KEY is not set for this repository"
            exit 1
          fi
          echo "remote=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.trust.outputs.remote == 'true'

      - name: Install pinned BuildBuddy client
        if: steps.trust.outputs.remote == 'true'
        uses: ./.github/actions/buildbuddy-client

      # The key is set on these two steps only: nothing else in the job needs
      # it. It is this repository's own BuildBuddy credential, kept apart from
      # Nostro's BB_API_KEY so it can be revoked on its own.
      - name: Probe BuildBuddy connectivity and auth
        if: steps.trust.outputs.remote == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: scripts/remote-verify.sh remote-probe

      - name: Run Linux-valid Cargo verification remotely
        if: steps.trust.outputs.remote == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: scripts/remote-verify.sh remote-heavy
# Warm the shared BuildBuddy runner snapshot only on explicit dispatch from the
# omp2 base branch. Restricting to omp2 prevents an attacker from dispatching
# this job from a branch containing modified scripts/ that could exfiltrate the
# BuildBuddy API key, which has AC-write permission.
  remote_seed:
    name: Seed BuildBuddy omp2 runner cache
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/omp2'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.CI_LINUX_MODE == 'remote' && (vars.CI_LINUX_RUNNER || vars.MACOS_RUNNER) || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Assert running on omp2
        run: |
          if [ "$GITHUB_REF" != "refs/heads/omp2" ]; then
            echo "::error::remote_seed must only run on refs/heads/omp2 (got $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: omp2
      - name: Install pinned BuildBuddy client
        uses: ./.github/actions/buildbuddy-client
      # On a self-hosted runner an empty key would let scripts/remote-verify.sh
      # fall back to the runner user's own Keychain key: fail instead.
      - name: Require the BuildBuddy key on a self-hosted runner
        if: runner.environment != 'github-hosted'
        env:
          HAS_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error title=BuildBuddy key missing::secrets.BUILDBUDDY_ORG_API_KEY is not set for this repository"
            exit 1
          fi
      - name: Seed omp2 runner snapshot
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: just remote-seed
