name: CI

on:
   push:
      branches: [main]
      paths:
         - "packages/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         # A root dependency change (lockfile/catalog/patches) affects every
         # job; without these a lockfile-only push shipped untested — and a
         # release retagged onto such a commit never triggered its run.
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
   pull_request:
      branches: [main, omp2]
      paths:
         - "packages/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
   workflow_dispatch:
      inputs:
         skip_npm:
            description: "Skip npm publish"
            type: boolean
            default: false
         # TEST-BRANCH ONLY (ci/release-speedups): run every release build leg
         # (release_binary, release_binary_hosted, release_gate) without any
         # publish job, so release timing can be measured off-main.
         release_dry_run:
            description: "Build release legs, publish nothing"
            type: boolean
            default: false

# Release runs publish a `v*` tag pushed atomically with main HEAD; sharing
# the cheap branch-wide `CI-refs/heads/main` group meant a later main push
# silently cancelled the in-flight release and left the tag without a GitHub
# Release or npm publish (#2564). Detect release runs at workflow-scheduling
# time via the release-script commit subject (`chore: bump version to vX.Y.Z`),
# via `v*` tag-ref dispatches, and via manual dispatches whose tag-on-HEAD
# status is only known after checkout; scope them to a per-sha group with no
# cancellation. Every other event keeps branch-wide cancellation for PR/main churn.
concurrency:
   group: "${{ github.workflow }}-${{ (startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
   cancel-in-progress: "${{ !(startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # native_addons builds the pair TS jobs need; native_addons_cross builds the
   # rest. Together they must equal //:natives-linux-all (checked in the cross
   # job), so a filegroup addition cannot silently skip both.
   NATIVES_X64_TARGETS: natives-linux-x64-baseline natives-linux-x64-modern
   NATIVES_CROSS_TARGETS: natives-linux-arm64 natives-linux-musl-arm64 natives-linux-musl-x64-baseline natives-win32-x64-baseline

permissions:
   contents: read

jobs:
   # scripts/release.ts pushes the version-bump commit and its `v*` tag
   # atomically (`git push --atomic origin refs/heads/main:refs/heads/main
   # <sha>:refs/tags/v<version>`), so a release now arrives as a single `push` to
   # `refs/heads/main` — we no longer trigger on the tag ref at all (see
   # `on.push`). This one branch-push run is therefore authoritative: it runs the
   # full build AND, when HEAD carries a release tag, the release/publish jobs.
   # `release_metadata` resolves that tag once so downstream jobs switch on
   # `is-release` and address the tag by name — `github.ref` is
   # `refs/heads/main` here, not the tag. A `workflow_dispatch` from a `v*` tag
   # ref (or from a tagged main HEAD) is also treated as a release.
   release_metadata:
      name: Resolve release metadata
      # Hosted, not omp-kata: this ~20 s git-tag probe gates the whole release
      # chain, and queueing it behind the 4-runner kata pool adds dead minutes
      # to the darwin critical path.
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
         # Canary tags publish to npm's canary dist-tag (derived script-side), mark
         # the GitHub release prerelease, and skip the stable-only brew tap.
         channel: ${{ steps.detect.outputs.channel }}
         # true for a release_dry_run dispatch: build legs run, publish jobs skip.
         dry-run: ${{ steps.detect.outputs.dry-run }}
      steps:
         # Only a main-branch run needs tags fetched, so `git tag --points-at
         # HEAD` can see the freshly-pushed `v*`. A tag-ref dispatch reads the
         # tag straight from `github.ref_name`, and fetching `--tags` while
         # checkout uses an explicit tag refspec makes git refuse — so scope
         # fetch-tags to main refs.
         - uses: actions/checkout@v4
           with:
              fetch-tags: ${{ github.ref == 'refs/heads/main' }}
         - name: Detect release tag at HEAD
           id: detect
           shell: bash
           run: |
              is_release=false
              release_tag=""
              channel=stable
              case "${{ github.ref }}" in
                refs/tags/v[0-9]*)
                  release_tag="${{ github.ref_name }}"
                  ;;
                refs/heads/main)
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
                  fi
                  ;;
              esac
              dry_run=false
              if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.release_dry_run }}" = true ]; then
                dry_run=true
                release_tag="v$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' packages/coding-agent/package.json | head -n1)-dryrun"
                echo "release_dry_run: building release legs for $release_tag; every publish job is skipped."
              fi
              if [ -n "$release_tag" ]; then
                echo "HEAD carries release tag $release_tag; this run builds and publishes the release."
                is_release=true
              fi
              if [[ "$release_tag" == *-canary.* ]]; then
                channel=canary
              fi
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
                echo "channel=$channel"
                echo "dry-run=$dry_run"
              } >> "$GITHUB_OUTPUT"

   check:
      name: Lint, type check & web build
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              # Prebuilt release binary checked against digests pinned here:
              # `cargo install` compiled cargo-deny from source on every run
              # (~135 s), and a .sha256 fetched from the same mutable release
              # would prove transport integrity only. Bump ver and both
              # digests together.
              ver=0.20.2
              case "$(uname -m)" in
                x86_64) arch=x86_64 sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
                aarch64|arm64) arch=aarch64 sha=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d ;;
                *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
              esac
              name="cargo-deny-$ver-$arch-unknown-linux-musl"
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$ver/$name.tar.gz"
              echo "$sha  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
              tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
              mkdir -p "$HOME/.cargo/bin"
              install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
              # `--offline` needs every workspace crate already in the registry
              # cache. PR runs use a fresh GitHub-hosted runner (see runs-on
              # above) with no prior cargo work, so nothing populates the index
              # for our own graph and resolution fails. Non-PR events land on
              # omp-kata, whose Cargo cache is warm. Fetch first.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         - name: Type check workspace
           run: bun run ci:check:full
         - name: Build collab web
           run: bun run collab:web:build

   # Rust validation (tests, clippy, rustfmt) runs on non-PR events only.
   # Native-changing PRs are rare enough that they do not warrant PR-side
   # Rust validation or a PR-side addon build (see native_addons): Rust is
   # validated post-merge on main (kata remote cache, warm) and again at
   # release. A skipped required check still satisfies branch protection.
   rust_validate:
      name: Validate Rust workspace (bazel)
      if: github.event_name != 'pull_request'
      runs-on: omp-kata
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy, except
         # brush-core (a vendored fork excluded from the Cargo task too).
         # pi-builtins allows every clippy group in its own manifest (ported
         # brush/uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported pi-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...

   # Provides the linux-x64 addon pair every downstream TS job installs.
   #
   # PRs never build. They restore the pair main built for the same native
   # sources from actions/cache (key = hash of every native build input, the
   # same file set as the bazel-cache action's config+source hashes). With no
   # exact entry (the PR changes native inputs, or main has not built this
   # state yet) they take main's newest entry, and with no entry at all the
   # latest npm release. The workspace loader skips its version sentinel for
   # workspace loads, so any of these load under a newer checkout. Testing
   # against main's build instead of the last release keeps merged-but-
   # unreleased native fixes from failing every PR that did not touch Rust
   # (a merged grep fix plus its TS test failed 75 PR runs against the
   # 18.3.1 addon). Only main saves; see the save step for why.
   #
   # Main (kata, cluster remote cache) builds only the pair here so the TS
   # fan-out starts as soon as it links; native_addons_cross builds the other
   # Linux-hosted targets in parallel. Job name says "bazel" for continuity
   # with required checks.
   #
   # Non-PR runs build baseline and modern as parallel matrix legs: the
   # one-addon-per-invocation OOM guard is per pod, so two pods link
   # concurrently without sharing memory (serial pair: ~324 s + ~172 s on a
   # pi_natives rebuild, probe run 36238796966).
   native_addons:
      name: "Build native addons (bazel) ${{ matrix.variant }}"
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      # actions: write lets main prune superseded addon cache entries.
      permissions:
         contents: read
         actions: write
      strategy:
         fail-fast: true
         matrix:
            # PRs restore both addons in one leg ("pair"); builds split.
            variant: ${{ fromJSON(github.event_name == 'pull_request' && '["pair"]' || '["baseline","modern"]') }}
      steps:
         - uses: actions/checkout@v4
         - name: Compute native addon cache key
           id: natives-key
           shell: bash
           env:
              # Must stay identical on every event: PRs look up the entry main
              # saved for the same inputs. Mirrors the bazel-cache hash inputs.
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              for v in baseline modern; do
                echo "prefix-$v=natives-linux-x64-$v-v1-" >> "$GITHUB_OUTPUT"
                echo "key-$v=natives-linux-x64-$v-v1-$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"
              done
              # Entries saved before the split hold both addons.
              echo "legacy-prefix=natives-linux-x64-v1-" >> "$GITHUB_OUTPUT"

         # ---- PR path: main-built addons from actions/cache, else npm ----
         # `ci-natives` is a plain workspace-relative path on purpose: the
         # cache version hashes the literal path list, so kata (save) and
         # hosted (restore) must spell it identically, and upload-artifact
         # skips dot-directories by default.
         - name: Restore main-built baseline addon
           id: natives-cache-baseline
           if: github.event_name == 'pull_request'
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key-baseline }}
              restore-keys: |
                 ${{ steps.natives-key.outputs.prefix-baseline }}
                 ${{ steps.natives-key.outputs.legacy-prefix }}
         - name: Restore main-built modern addon
           id: natives-cache-modern
           if: github.event_name == 'pull_request'
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key-modern }}
              restore-keys: |
                 ${{ steps.natives-key.outputs.prefix-modern }}
                 ${{ steps.natives-key.outputs.legacy-prefix }}
         - name: Fetch missing addons from the npm release
           if: github.event_name == 'pull_request'
           shell: bash
           run: |
              set -euo pipefail
              missing=()
              for v in baseline modern; do
                [ -f "ci-natives/natives-linux-x64-$v/pi_natives.linux-x64-$v.node" ] || missing+=("$v")
              done
              if [ "${#missing[@]}" -eq 0 ]; then exit 0; fi
              tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
              echo "Fetching $tarball for: ${missing[*]}"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              for v in "${missing[@]}"; do
                mkdir -p "ci-natives/natives-linux-x64-$v"
                cp "$RUNNER_TEMP/package/pi_natives.linux-x64-$v.node" "ci-natives/natives-linux-x64-$v/"
              done
              echo "npm_fill=${missing[*]}" >> "$GITHUB_ENV"
         # Make the addon source visible whenever it is not source-matched,
         # instead of leaving a reviewer to wonder which addons the tests ran.
         - name: Report native addon source
           if: github.event_name == 'pull_request'
           shell: bash
           env:
              EXACT_BASELINE: ${{ steps.natives-cache-baseline.outputs.cache-hit }}
              EXACT_MODERN: ${{ steps.natives-cache-modern.outputs.cache-hit }}
              MATCHED_BASELINE: ${{ steps.natives-cache-baseline.outputs.cache-matched-key }}
              MATCHED_MODERN: ${{ steps.natives-cache-modern.outputs.cache-matched-key }}
           run: |
              if [ "$EXACT_BASELINE" = true ] && [ "$EXACT_MODERN" = true ]; then
                echo "Using main's addons for this exact native source state ($MATCHED_BASELINE, $MATCHED_MODERN)."
              elif [ -n "${npm_fill:-}" ]; then
                echo "::notice title=Native addons from npm::No main-built cache entry for: ${npm_fill}; those addons come from the latest npm release."
              else
                echo "::notice title=Native addons not source-matched::No main build matches this PR's native sources; testing against main's newest addon builds ($MATCHED_BASELINE, $MATCHED_MODERN). Native changes are validated post-merge on main and at release."
              fi

         # ---- main path: bazel build of this leg's addon ----
         - id: cache
           if: github.event_name != 'pull_request'
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build linux-x64 native addon
           if: github.event_name != 'pull_request'
           env:
              TARGET: natives-linux-x64-${{ matrix.variant }}
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # TEST-BRANCH: --profile to attribute the ~100-130 s spent before
              # package loading on every fresh kata bazel server.
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --profile="$RUNNER_TEMP/bazel-profile.json.gz" "//:$TARGET" 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"
              mkdir -p "ci-natives/$TARGET"
              cp -L bazel-bin/"$TARGET"/*.node "ci-natives/$TARGET/"
         - name: Summarize bazel profile (test branch)
           if: github.event_name != 'pull_request'
           continue-on-error: true
           shell: bash
           run: |
              bazelisk analyze-profile "$RUNNER_TEMP/bazel-profile.json.gz" 2>&1 | sed -n '1,60p'
         - name: Upload bazel profile (test branch)
           if: github.event_name != 'pull_request'
           continue-on-error: true
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: bazel-profile-${{ matrix.variant }}
              path: ${{ runner.temp }}/bazel-profile.json.gz
              retention-days: 3
         # Cache-hit visibility: a supposedly warm build that executes
         # thousands of actions is the failure mode that made CI slow — make
         # it visible in the run summary instead of discovering it weeks in.
         - name: Report bazel cache stats
           if: github.event_name != 'pull_request'
           shell: bash
           run: |
              # Bazel runs with --color=yes (config=ci); strip ANSI before
              # matching — escapes split "INFO:" from the process count in
              # the raw log.
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary (${{ matrix.variant }})::${summary:-no process summary found}"

         # ---- both paths ----
         # A corrupt download or cache entry must fail here, not as a
         # confusing dlopen error in every downstream test shard.
         - name: Smoke native addons
           shell: bash
           run: |
              set -euo pipefail
              # NOTE: `bun -e 'require("./x.node")'` swallows dlopen failures
              # (exit 0 on a bogus addon); a script file enforces them in
              # both bun and node. Verified against a corrupt .node fixture.
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
              }
              EOF
              loader=node
              if command -v bun >/dev/null 2>&1; then loader=bun; fi
              "$loader" "$RUNNER_TEMP/smoke-addons.js" "$PWD"/ci-natives/natives-linux-x64-*/*.node
         # Kata test jobs download ~120 MB of artifact over the node's NAT
         # egress (44-68 s per job, on the critical path). Every kata pod
         # mounts the shared runner-cache PVC at /opt/bazel-repo-cache (the
         # xwin cache already lives there), so stash each addon
         # content-addressed beside it plus a per-run index
         # (run-<run_id>/<artifact-relative path>.sha256) naming it; the
         # native-artifacts action restores and re-verifies it and falls back
         # to the artifact on any miss. A run-scoped index (instead of a job
         # output) lets the matrix legs publish independently. Best-effort: a
         # stash failure only costs consumers the download.
         - name: Stage native addons for consumers
           shell: bash
           run: |
              set -euo pipefail
              stash_dir=/opt/bazel-repo-cache/ci-natives
              if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ ! -w /opt/bazel-repo-cache ]; then
                echo "No in-cluster stash on this runner; consumers download the artifact."
                exit 0
              fi
              index="$stash_dir/run-${{ github.run_id }}"
              if ! mkdir -p "$stash_dir" "$index"; then
                echo "::warning title=Native addon stash::cannot create $stash_dir; consumers will download the artifact"
                exit 0
              fi
              # Consumers of a run need its entries for minutes; two days
              # covers re-runs while bounding the PVC footprint.
              find "$stash_dir" -mindepth 1 -mmin +2880 -delete 2>/dev/null || true
              for f in ci-natives/natives-linux-x64-*/*.node; do
                rel="${f#ci-natives/}"
                sha="$(sha256sum "$f" | cut -d' ' -f1)"
                dest="$stash_dir/$sha.node"
                if [ -f "$dest" ]; then
                  touch "$dest"
                else
                  tmp="$stash_dir/.$sha.$$.tmp"
                  if ! { cp "$f" "$tmp" && mv -f "$tmp" "$dest"; }; then
                    rm -f "$tmp"
                    echo "::warning title=Native addon stash::could not stash $rel; consumers will download the artifact"
                    continue
                  fi
                fi
                # Index written last: a present index entry implies its blob.
                mkdir -p "$index/$(dirname "$rel")"
                printf '%s\n' "$sha" > "$index/$rel.sha256.tmp" && mv -f "$index/$rel.sha256.tmp" "$index/$rel.sha256"
                echo "stashed $rel -> $dest"
              done
         # Only main saves: an entry saved on any other ref is readable by
         # that ref alone yet counts against the shared 10 GB repo quota,
         # whose LRU eviction has already cost the darwin release archives.
         # Probe first so an existing entry is not re-uploaded, then keep
         # only the newest two entries so the footprint stays ~100 MB.
         # The three steps below run only on main (never exercised by PR or
         # branch runs) and are pure optimization for later PRs: a failure
         # must never fail native_addons and with it every test job.
         - name: Probe native addon cache entry
           id: natives-cache-probe
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
           continue-on-error: true
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs[format('key-{0}', matrix.variant)] }}
              lookup-only: true
         - name: Save native addon cache entry
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs[format('key-{0}', matrix.variant)] }}
         - name: Prune superseded native addon cache entries
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              PREFIX: ${{ steps.natives-key.outputs[format('prefix-{0}', matrix.variant)] }}
           run: |
              # Best-effort: a failed prune leaves eviction to GitHub's LRU.
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" \
                  --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
                | while read -r id; do
                    gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                  done || true

         # Uploading the ci-natives directory (not a file glob) keeps the
         # natives-linux-x64-<variant>/ subdirectory even for a one-file leg;
         # consumers merge every natives-linux-x64-* artifact.
         - name: Upload linux-x64 native addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: natives-linux-x64-${{ matrix.variant }}
              path: ci-natives
              if-no-files-found: error
              retention-days: 1

   # The remaining Linux-hosted targets (arm64, musl, win32 cross). Only
   # release jobs consume them, so they build beside the TS fan-out instead of
   # ahead of it. One matrix leg per target: serially the four took ~16 min on
   # a pi_natives rebuild (probe run 36238796966). Non-PR only, like
   # rust_validate; the build also keeps the remote cache warm for release
   # runs. The matrix must list exactly NATIVES_CROSS_TARGETS (checked below).
   native_addons_cross:
      name: "Build native addons (bazel, cross) ${{ matrix.target }}"
      if: github.event_name != 'pull_request'
      runs-on: omp-kata
      strategy:
         fail-fast: false
         matrix:
            target: [natives-linux-arm64, natives-linux-musl-arm64, natives-linux-musl-x64-baseline, natives-win32-x64-baseline]
      steps:
         - uses: actions/checkout@v4
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Build cross-target native addon
           env:
              TARGET: ${{ matrix.target }}
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$TARGET" 2>&1 | tee "$RUNNER_TEMP/bazel-build.log"
              mkdir -p "ci-natives/$TARGET"
              cp -L bazel-bin/"$TARGET"/*.node "ci-natives/$TARGET/"
         # The x64 pair plus the cross list must cover //:natives-linux-all
         # exactly, and the matrix must equal NATIVES_CROSS_TARGETS; a target
         # added to the filegroup but to no list would otherwise silently
         # never build or ship. One leg checks. cquery, not query: the rc's
         # --config=ci is defined for build only, which cquery inherits and
         # query rejects; this also reuses the warm server.
         - name: Check addon target lists cover natives-linux-all
           if: matrix.target == 'natives-linux-arm64'
           env:
              MATRIX_TARGETS: natives-linux-arm64 natives-linux-musl-arm64 natives-linux-musl-x64-baseline natives-win32-x64-baseline
           run: |
              set -euo pipefail
              if [ "$(printf '%s\n' $MATRIX_TARGETS | sort)" != "$(printf '%s\n' $NATIVES_CROSS_TARGETS | sort)" ]; then
                echo "::error title=Native addon target lists::native_addons_cross matrix must equal NATIVES_CROSS_TARGETS"
                exit 1
              fi
              read -r -a listed <<< "$NATIVES_X64_TARGETS $NATIVES_CROSS_TARGETS"
              expected="$(printf '%s\n' "${listed[@]}" | sort)"
              actual="$(bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" cquery 'labels(srcs, //:natives-linux-all)' 2>"$RUNNER_TEMP/query.err" | sed -E 's/ \(.*\)$//; s/.*://' | sort)" || {
                cat "$RUNNER_TEMP/query.err"
                exit 1
              }
              if [ "$expected" != "$actual" ]; then
                echo "::error title=Native addon target lists::NATIVES_X64_TARGETS + NATIVES_CROSS_TARGETS must equal //:natives-linux-all srcs"
                diff <(echo "$expected") <(echo "$actual") || true
                exit 1
              fi
         - name: Report bazel cache stats
           shell: bash
           run: |
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary (${{ matrix.target }})::${summary:-no process summary found}"
         # Directory upload keeps the natives-<target>/ subdirectory; the
         # native-artifacts action merges every natives-cross-* artifact.
         - name: Upload cross native addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: natives-cross-${{ matrix.target }}
              path: ci-natives
              if-no-files-found: error
              retention-days: 1

   test_coding_agent_native:
      name: "Test coding-agent native/unit (TS) ${{ matrix.shard }}"
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      # The longest PR job, so it runs as three shards on hosted PR runners
      # (two left the slower shard ~25 s behind every other job). Main keeps
      # one: omp-kata caps at 8 runners and the fan-out already fills it.
      # Declared first among the test jobs: when the 8-runner pool is full
      # the longest bucket should not be the one left queued (probe run
      # 36238796966 queued it 1.9 min behind the shorter buckets).
      # No required check keys on this job name (branch protection and
      # rulesets are off for main/omp2), so the per-shard names are safe.
      strategy:
         fail-fast: false
         matrix:
            shard: ${{ fromJSON(github.event_name == 'pull_request' && '["1/3","2/3","3/3"]' || '["1/1"]') }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Test coding-agent native/unit bucket
           env:
              OMP_TEST_CONCURRENCY: "4"
              OMP_TEST_SHARD: ${{ matrix.shard }}
           run: bun run ci:test:coding-agent:native

   test_workspace:
      name: Test TS workspace fast
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Test workspace packages and repo scripts (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              bun run ci:test:ts:workspace
              # Not `test:scripts`: scripts/musl-release.test.ts fails on main
              # (its install.sh smoke-check executes a fake binary), so running
              # the whole group here would red this job on an unrelated break.
              bun test scripts/ci-test-ts.test.ts scripts/release.test.ts

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Test native/TUI/browser-ish packages (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:ts:native

   test_coding_agent_ui:
      name: Test coding-agent UI/TUI (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Test coding-agent UI/TUI bucket
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime/session (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; keep this
           # separate for concurrency, not as a native-free guardrail.
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:coding-agent:runtime

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      name: Install method smoke tests
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash-run: ${{ github.run_id }}
         - name: Install method smoke tests
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"
           run: bun run ci:test:install-methods

   # Aggregates every validation job so publish-side release jobs gate on one
   # result. Binary BUILDS deliberately do not wait for this gate — they run
   # in parallel with the test fan-out and only publishing is held back.
   release_gate:
      name: Release validation gate
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.rust_validate.result == 'success' &&
         needs.native_addons.result == 'success' &&
         needs.native_addons_cross.result == 'success' &&
         needs.test_workspace.result == 'success' &&
         needs.test_coding_agent_singleton.result == 'success' &&
         needs.test_ts_native.result == 'success' &&
         needs.test_coding_agent_ui.result == 'success' &&
         needs.test_coding_agent_runtime.result == 'success' &&
         needs.test_coding_agent_native.result == 'success' &&
         needs.test_smoke.result == 'success' && needs.check.result == 'success' &&
         needs.install_methods.result == 'success' }}
      needs: [release_metadata, check, rust_validate, native_addons, native_addons_cross, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, test_smoke, install_methods]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Generated-config drift gate: bazel/clippy.bazelrc is maintained by
         # scripts/release.ts (like the lockfiles); a stale file only blocks
         # publishing, never ordinary CI.
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         - run: echo "release validation green"

   # Builds (does not publish) the Linux-hosted release binaries in parallel
   # with the test fan-out; the needs are the two native_addons jobs, whose
   # artifacts supply their addons. Native-host builds live in
   # release_binary_hosted and start at release_metadata time instead.
   # Publishing (npm leaves, GitHub release, core npm) is gated on
   # release_gate downstream.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' &&
         needs.native_addons_cross.result == 'success' }}
      needs: [release_metadata, native_addons, native_addons_cross]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    arch: x64,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    arch: arm64,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-arm64,
                    native_targets: linux-arm64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    libc: musl,
                    arch: arm64,
                    target_id: linux-musl-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-musl-arm64,
                    native_targets: linux-musl-arm64,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: x64,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/omp-windows-x64.exe,
                    native_targets: win32-x64-baseline,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the bun
         # `--compile --target=bun-windows-x64-*` cross-compile. Musl binaries
         # need the musl loader, which glibc runners lack — they are smoked in
         # the Alpine container step below instead.
         - name: Smoke release binary
           if: matrix.platform != 'win32' && matrix.libc != 'musl'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
         # Main-only save, after the build so it is off the leg's critical
         # path: caches saved on a tag or branch are readable only by that ref
         # yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   # Native-host builds make addons that native_addons cannot provide: Darwin
   # uses Bazel/Xcode and Windows ARM64 uses Cargo/MSVC. They gate on
   # release_metadata alone and start as soon as a release is detected, fully
   # overlapped with the tests.
   #
   # darwin-x64 builds on Apple silicon: Xcode cross-compiles the x86_64 addon
   # and bun cross-compiles the binary, and the leg took 25-35 min on
   # macos-15-intel vs 11-16 min for darwin-arm64. It must be macos-15, not
   # macos-14: the smoke runs the x86_64 binary under Rosetta, and only
   # macOS 15's Rosetta translates the AVX2 the bun-darwin-x64 runtime uses
   # (macOS 14: "CPU lacks AVX support", SIGILL on --smoke-test).
   release_binary_hosted:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: macos-15,
                    platform: darwin,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/omp-darwin-x64,
                    native_targets: darwin-x64-baseline,
                    cache_scope: release-darwin-x64,
                    fallback_scope: release-darwin-arm64-macos15,
                 }
               # Same image as darwin-x64 so the two scopes can seed each
               # other's exec-config actions (proc-macros, build scripts): a
               # macos-14 probe restoring the arm64 archive got 584 disk-cache
               # hits for the x64 build, macos-15 got 0 across images.
               - {
                    os: macos-15,
                    platform: darwin,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/omp-darwin-arm64,
                    native_targets: darwin-arm64,
                    cache_scope: release-darwin-arm64-macos15,
                    fallback_scope: release-darwin-x64,
                 }
               - {
                    os: windows-11-arm,
                    platform: win32,
                    target_id: win32-arm64,
                    binary_path: packages/coding-agent/binaries/omp-windows-arm64.exe,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Darwin addons use the host Xcode toolchain. The warm workflow keeps
         # these scopes seeded near HEAD, so this is normally the version-bump
         # delta. No save here: every release push also triggers
         # bazel-cache-warm, which builds and saves the same key concurrently;
         # release legs lost that race and spent 0.5-6.4 min compressing an
         # archive before "Unable to reserve cache" (18.3.2, 18.2.x).
         - name: Build native addon (bazel)
           if: matrix.platform == 'darwin'
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: ${{ matrix.cache_scope }}
              fallback-scope: ${{ matrix.fallback_scope }}
              save: "false"
         # The Bazel MSVC toolchain is cross-host-only. Build natively on the
         # Windows ARM64 runner with its installed Rust and Visual Studio tools.
         # Third-party crates restore from the cache bazel-cache-warm seeds on
         # main (the ~9.5 min dependency phase of the ~17 min cargo build);
         # workspace crates always rebuild. Release legs never save.
         - name: Restore cargo cache
           if: matrix.platform == 'win32'
           uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
           with:
              shared-key: win32-arm64-ci
              save-if: "false"
         - name: Build native addon (cargo)
           if: matrix.platform == 'win32'
           env:
              OMP_NATIVE_CARGO_PROFILE: ci
           run: bun scripts/bazel-natives.ts host --dest packages/natives/native
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary (Developer ID)
           # Replaces the ad-hoc signature with a Developer ID + hardened-runtime
           # one while preserving the required JIT, Apple Events, and
           # library-validation entitlements, then notarizes. Auto-skips until
           # the APPLE_* secrets are configured.
           if: matrix.platform == 'darwin' && env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Smoke release binary
           if: matrix.platform == 'darwin'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke release binary (Windows)
           if: matrix.platform == 'win32'
           shell: pwsh
           run: |
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              & "${{ matrix.binary_path }}" --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & "${{ matrix.binary_path }}" --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
         # Native-host addons exist only on these runners; export them so
         # release_native_leaves can publish every leaf package after the
         # validation gate. Other leaves reuse the native_addons artifacts.
         - name: Upload native-host addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons-${{ matrix.target_id }}
              path: packages/natives/native/pi_natives.${{ matrix.target_id }}*.node
              if-no-files-found: error
              retention-days: 1
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
         # Main-only save, after the build so it is off the critical path.
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   # Publishes the six @oh-my-pi/pi-natives-<tag> leaf packages once
   # validation passes and every binary built. Runs on one linux runner: leaf
   # publishing is platform-agnostic file packaging (gen-npm-packages reads
   # packages/natives/native), so no per-platform runners are needed.
   release_native_leaves:
      name: Publish native leaf packages
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_hosted.result == 'success' &&
         needs.release_metadata.outputs.dry-run != 'true' &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_gate, release_binary, release_binary_hosted]
      runs-on: ubuntu-22.04
      # id-token lets npm mint the OIDC token for trusted publishing; the
      # NODE_AUTH_TOKEN below is the fallback for unconfigured packages.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Main-only save: caches saved on a tag or branch are readable only by
         # that ref yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         # Linux + win32-x64 addons from the native_addons artifact (gnu targets
         # only — musl reuses the linux filenames and has no leaf package).
         - name: Install linux and win32-x64 native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern linux-arm64 win32-x64-baseline
         # Native-host addons come flat (canonical filenames) from the
         # release_binary_hosted legs.
         - name: Install native-host addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: native-addons-*
              path: packages/natives/native
              merge-multiple: true
         - name: Publish native leaf packages
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           # The six leaves are independent: each process generates its own
           # packages/natives/npm/<tag> dir and packs into a private temp dir,
           # and the legal payload is tracked in packages/natives, so nothing
           # shared is written. Serially they cost ~140 s on the release
           # critical path. Every leaf runs to completion so one failure does
           # not strand the others half-published; reruns skip published ones.
           run: |
              set -uo pipefail
              logs="$RUNNER_TEMP/native-leaf-logs"
              mkdir -p "$logs"
              tags=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
              pids=()
              for tag in "${tags[@]}"; do
                bun run ci:release:publish-native-leaf "$tag" >"$logs/$tag.log" 2>&1 &
                pids+=("$!")
              done
              failed=()
              for i in "${!tags[@]}"; do
                tag="${tags[$i]}"
                if wait "${pids[$i]}"; then
                  status=ok
                else
                  status="failed (exit $?)"
                  failed+=("$tag")
                fi
                echo "::group::$tag: $status"
                cat "$logs/$tag.log"
                echo "::endgroup::"
              done
              if [ "${#failed[@]}" -gt 0 ]; then
                echo "::error title=Native leaf publish::failed: ${failed[*]}"
                exit 1
              fi

   release_github:
      name: Publish GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_hosted.result == 'success' &&
         needs.release_metadata.outputs.dry-run != 'true' }}
      needs: [release_metadata, release_gate, release_binary, release_binary_hosted]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Generate release notes from CHANGELOGs
           env:
              # `gh release list` (used to find the latest published GitHub
              # Release tag below the target so silent-tag changelog sections
              # roll forward — #2596) requires GH_TOKEN in Actions. Without
              # it gh exits non-zero and the script would degrade to legacy
              # single-version notes, defeating the recovery.
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/ci-release-notes.ts ${{ needs.release_metadata.outputs.release-tag }}
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         # Generated after every other release asset is in place and before
         # the release is created, so SHA256SUMS.txt itself ships as an asset
         # and covers every other file uploaded alongside it.
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/omp-* \
                packages/browser-relay/dist/omp-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              prerelease: ${{ needs.release_metadata.outputs.channel == 'canary' }}
              files: |
                 packages/coding-agent/binaries/omp-*
                 packages/browser-relay/dist/omp-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
              body_path: release-notes.md
              generate_release_notes: true

   release_github_verify:
      name: Verify published release (macOS)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: macos-14
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - name: Download published macOS arm64 binary
           run: |
              curl -fsSL -o omp-darwin-arm64 "https://github.com/${{ github.repository }}/releases/download/${{ needs.release_metadata.outputs.release-tag }}/omp-darwin-arm64"
              chmod +x omp-darwin-arm64
         - name: Verify published macOS arm64 binary
           run: |
              codesign -dvvv ./omp-darwin-arm64
              codesign --verify --strict --verbose=4 ./omp-darwin-arm64
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --smoke-test
         - name: Assert signed release is not ad-hoc
           if: env.MACOS_SIGNING == 'true'
           run: |
              if codesign -dvvv ./omp-darwin-arm64 2>&1 | grep -qE "flags=.*adhoc|Signature=adhoc"; then
                echo "published binary is still ad-hoc signed (Developer ID signing did not run)" >&2
                exit 1
              fi
              # Gatekeeper assessment: a notarized Developer ID binary is accepted.
              # Informational — a bare (unstapled) Mach-O relies on the online ticket
              # lookup, so surface the result without gating the release on it.
              spctl -a -t exec -vv ./omp-darwin-arm64 || echo "spctl non-zero (expected for unstapled bare binary; ticket served online)"

   release_npm:
      name: Publish to npm
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.dry-run != 'true' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_hosted.result == 'success' &&
         needs.release_github_verify.result == 'success' &&
         needs.release_native_leaves.result == 'success' &&
         !inputs.skip_npm }}
      # release_native_leaves must finish first: the core package lists the
      # leaf packages as lockstep-versioned optionalDependencies, so installs
      # resolve them the moment the core version is live.
      needs: [release_metadata, release_binary, release_binary_hosted, release_github_verify, release_native_leaves]
      runs-on: ubuntu-22.04
      # `id-token: write` lets npm mint the GitHub OIDC token it exchanges for a
      # short-lived publish token (trusted publishing + provenance). When a
      # package has no matching trusted publisher configured, npm silently falls
      # back to NODE_AUTH_TOKEN below — which also covers first-ever publishes.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Main-only save: caches saved on a tag or branch are readable only by
         # that ref yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         # The prepack executes workspace code which loads the Linux x64
         # addon, so install the native_addons job's artifact before publishing.
         - name: Install prebuilt native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Publish to npm
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun run ci:release:publish

   # Regenerate the Homebrew tap formula (can1357/homebrew-tap) from the freshly
   # published release assets and push it. Gated on release_github_verify so the
   # tap only cuts over to a release whose published binary was verified (matches
   # how release_npm is gated). No-ops when HOMEBREW_TAP_DEPLOY_KEY is unset, so a
   # release never blocks on tap access.
   release_brew:
      name: Update Homebrew tap
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.channel != 'canary' &&
         needs.release_github_verify.result == 'success' }}
      needs: [release_metadata, release_github_verify]
      runs-on: ubuntu-22.04
      env:
         HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           if: env.HAS_TAP_KEY == 'true'
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           if: env.HAS_TAP_KEY == 'true'
         - name: Check out the Homebrew tap
           if: env.HAS_TAP_KEY == 'true'
           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              repository: can1357/homebrew-tap
              ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
              path: homebrew-tap
         - name: Regenerate and push the formula
           if: env.HAS_TAP_KEY == 'true'
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              bun scripts/ci-update-brew-formula.ts "${{ needs.release_metadata.outputs.release-tag }}" --out homebrew-tap/Formula/omp.rb
              cd homebrew-tap
              if git diff --quiet -- Formula/omp.rb; then
                echo "formula already up to date for ${{ needs.release_metadata.outputs.release-tag }}"
                exit 0
              fi
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "omp ${{ needs.release_metadata.outputs.release-tag }}" -- Formula/omp.rb
              git push origin HEAD:main
