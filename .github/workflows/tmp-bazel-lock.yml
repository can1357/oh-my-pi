name: TMP refresh bazel lock (throwaway)
on:
   push:
      branches: [ci/release-speedups-bump]
      paths: [".github/workflows/tmp-bazel-lock.yml"]
jobs:
   refresh:
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - run: bun scripts/gen-bazel-lock.ts --check || bun scripts/gen-bazel-lock.ts
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: MODULE.bazel.lock
              path: MODULE.bazel.lock
