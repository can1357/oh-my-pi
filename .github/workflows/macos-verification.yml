name: macOS verification worker
run-name: macos:${{ fromJSON(inputs.request_json).parent_run_id }}:${{ fromJSON(inputs.request_json).parent_attempt }}:${{ fromJSON(inputs.request_json).objective }}:${{ fromJSON(inputs.request_json).nonce }}:${{ fromJSON(inputs.request_json).generation }}
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Controller request envelope
        required: true
        type: string
      pool:
        description: Execution pool (admission independently validates permission)
        required: true
        type: choice
        options: [hosted, self-hosted]
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: Native macOS objective
    runs-on: ${{ inputs.pool == 'self-hosted' && fromJSON(vars.CI_MACOS_FALLBACK_LABELS || '["self-hosted","macOS","ARM64"]') || 'macos-15' }}
    timeout-minutes: ${{ fromJSON(inputs.request_json).objective == 'rust' && 120 || 45 }}
    env:
      REQUEST_JSON: ${{ inputs.request_json }}
      GH_TOKEN: ${{ github.token }}
      CI_MACOS_POOL: ${{ inputs.pool }}
      CI_MACOS_WORKER_REF: ${{ vars.CI_MACOS_WORKER_REF }}
      CI_MACOS_WORKER_SHA: ${{ github.workflow_sha }}
      CI_MACOS_CONTROL_POLICY: source-bound
      CI_MACOS_PARENT_WORKFLOW_SHA256: ${{ vars.CI_MACOS_PARENT_WORKFLOW_SHA256 }}
      CI_MACOS_FALLBACK_ENABLED: ${{ vars.CI_MACOS_FALLBACK_ENABLED || 'true' }}
      CI_MACOS_FALLBACK_TRUST: ${{ vars.CI_MACOS_FALLBACK_TRUST || 'repository-writers' }}
      CI_MACOS_FALLBACK_LABELS: ${{ vars.CI_MACOS_FALLBACK_LABELS || '["self-hosted","macOS","ARM64"]' }}
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Write request as data
        shell: bash
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "macos-request.json").write_text(os.environ["REQUEST_JSON"])'
      - name: Check out reviewed worker control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Admit parent request
        id: admit
        run: python3 scripts/macos_worker_guard.py admit --request-file "$RUNNER_TEMP/macos-request.json"
      - name: Check out admitted candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.admit.outputs.source_sha }}
          persist-credentials: false
      - name: Restore pinned admission control separately
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-control
          persist-credentials: false
      - name: Run native objective
        uses: ./.github/actions/macos-native-objective
        with:
          objective: ${{ fromJSON(inputs.request_json).objective }}
          source-directory: .
          control-directory: .ci-control
          guarded: 'true'
          min-free-gb: ${{ vars.CI_MIN_FREE_GB || '60' }}
      - name: Upload settled native result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-result-${{ fromJSON(inputs.request_json).nonce }}-${{ fromJSON(inputs.request_json).generation }}
          path: ${{ runner.temp }}/macos-result.json
          if-no-files-found: error
          retention-days: 7
