name: Docs site

# Builds the standalone Starlight site under docs-site/ and deploys the static
# output to GitHub Pages. docs-site has its own bun.lock and is not part of the
# root workspace, so it installs and builds in isolation (no native addons, no
# root workspace). The site is served at the fork's project URL,
# https://nibblebot.github.io/oh-my-pi/, so Astro's site/base in
# docs-site/astro.config.mjs must match this URL.
#
# Pages must be enabled on the repo with Source = "GitHub Actions" (Settings →
# Pages); the deploy job then publishes whatever this workflow uploads.

on:
   push:
      branches: [docs]
      paths:
         - "docs-site/**"
         - ".github/workflows/docs.yml"
   workflow_dispatch:

permissions:
   contents: read
   pages: write
   id-token: write

# One in-flight deployment; cancel superseded branch runs.
concurrency:
   group: pages
   cancel-in-progress: true

jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3"
         - name: Install docs-site dependencies
           working-directory: docs-site
           run: bun install --frozen-lockfile
         - name: Build static site
           working-directory: docs-site
           run: bun run build
         - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
         - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
           with:
              path: docs-site/dist

   deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - id: deployment
           uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
