name: ompk mention agent

# `@ompk` in issues / PRs works like `@claude` / `@copilot` in the GitHub
# agents pane: mention the handle in an issue body, issue/PR comment, review
# comment, or review body (or assign an issue to it) and the OMPK coding
# agent picks the task up, works on a sanctioned branch, and replies with a
# verified report. scripts/ompk-mention-agent.ts is the precise gate + runner
# (GitHub-compatible mention matching, trust checks, fork-PR refusal before
# any checkout, and the M2 assignment-verification gate); the job-level `if` is
# only a cheap prefilter so unrelated events never spin up a runner.

on:
  issues:
    # `assigned` fires the driver only when the assignee login equals the
    # handle — that path (and native agents-pane presence) requires a REAL
    # GitHub user / App bot with that login that can be assigned issues.
    # Plain-text `@ompk` mentions work regardless of whether the login exists.
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # PR body/title mentions on open. `edited` is deliberately excluded on all
  # surfaces: it would re-fire on every unrelated edit while a mention
  # exists; mention again in a comment to re-run. Cross-repo (fork) PRs are
  # refused by the driver BEFORE any checkout — the agent must never execute
  # fork-controlled source with secrets in env.
  pull_request:
    types: [opened]

permissions:
  contents: write # push work branches / PR head branches
  issues: write # reply comments + 👀 reactions
  pull-requests: write # reply on PR threads, open PRs from issue work

concurrency:
  # One run per issue/PR at a time; queued mentions run after, never cancel —
  # a later mention must not kill an in-flight work session.
  group: ompk-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ompk:
    # Cheap prefilter only — contains() is case-insensitive but matches code
    # blocks and longer logins too; the driver re-checks with the precise
    # GitHub-compatible matcher and authorization gates before doing anything.
    # The head-repo clause skips fork-originated pull_request/review runs
    # entirely: GitHub strips secrets and downgrades GITHUB_TOKEN there, so
    # even the driver's refusal comment could not be posted. Fork-PR mentions
    # via issue_comment still run in base context, where the driver refuses
    # BEFORE checkout and posts the explanation.
    if: >-
      (!github.event.pull_request ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (contains(github.event.comment.body, format('@{0}', vars.OMPK_MENTION_HANDLE || 'ompk')) ||
       contains(github.event.review.body, format('@{0}', vars.OMPK_MENTION_HANDLE || 'ompk')) ||
       contains(github.event.issue.body, format('@{0}', vars.OMPK_MENTION_HANDLE || 'ompk')) ||
       contains(github.event.issue.title, format('@{0}', vars.OMPK_MENTION_HANDLE || 'ompk')) ||
       contains(github.event.pull_request.body, format('@{0}', vars.OMPK_MENTION_HANDLE || 'ompk')) ||
       contains(github.event.pull_request.title, format('@{0}', vars.OMPK_MENTION_HANDLE || 'ompk')) ||
       github.event.assignee.login == (vars.OMPK_MENTION_HANDLE || 'ompk'))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the agent diffs against baselines, checks out PR
          # heads, and pushes work branches.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "ompk-agent[bot]"
          git config user.email "ompk-agent[bot]@users.noreply.github.com"

      - uses: ./.github/actions/bun-install

      - name: Run mention agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # One knob for the whole pipeline: set the repo/org variable
          # OMPK_MENTION_HANDLE to rename the agent (must match the prefilter
          # above, which reads the same variable).
          OMPK_MENTION_HANDLE: ${{ vars.OMPK_MENTION_HANDLE || 'ompk' }}
          # Optional model override (repo/org variable), e.g. a cheaper model
          # for mention traffic. Empty → omp's default model resolution.
          OMPK_MENTION_MODEL: ${{ vars.OMPK_MENTION_MODEL }}
        run: bun scripts/ompk-mention-agent.ts
