name: One-shot routing review fixes v2

on:
  push:
    branches:
      - fix/switch-openrouter-upstream-routing

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.repository == 'carterlasalle/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch release native addons
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected replacement anchor once, found {count}")
              p.write_text(text.replace(old, new, 1))

          resolver = "packages/coding-agent/src/config/model-resolver.ts"
          replace_once(
              resolver,
              '''function applyUpstreamRouting(model: Model<Api>, upstream: string): Model<Api> {
          \tconst aggregatorModel = model as Model<"openai-completions">;
          \tconst routing = { only: [upstream] };
          \treturn buildModel({
          \t\t...model,
          \t\tcompat: modelMatchesHost(model, "vercelAIGateway")
          \t\t\t? { ...aggregatorModel.compatConfig, vercelGatewayRouting: routing }
          \t\t\t: { ...aggregatorModel.compatConfig, openRouterRouting: routing },
          \t} as ModelSpec<Api>);
          }
          ''',
              '''function applyUpstreamRouting(model: Model<Api>, upstream: string): Model<Api> {
          \tconst aggregatorModel = model as Model<"openai-completions">;
          \tconst routing = { only: [upstream] };
          \treturn buildModel({
          \t\t...model,
          \t\tcompat: modelMatchesHost(model, "vercelAIGateway")
          \t\t\t? { ...aggregatorModel.compatConfig, vercelGatewayRouting: routing }
          \t\t\t: { ...aggregatorModel.compatConfig, openRouterRouting: routing },
          \t} as ModelSpec<Api>);
          }
          
          /** Preserve an explicit single-upstream pin while refreshing an aggregator model's metadata. */
          export function preserveUpstreamRouting(source: Model<Api>, refreshed: Model<Api>): Model<Api> {
          \tconst upstream = getSingleUpstreamRoute(source);
          \treturn upstream && supportsUpstreamRouting(refreshed) ? applyUpstreamRouting(refreshed, upstream) : refreshed;
          }
          ''',
          )
          replace_once(
              resolver,
              '''\tconst candidates = routedProviderPattern ? allModels : (providerCandidates ?? availableModels);
          ''',
              '''\tconst candidates = providerCandidates ?? availableModels;
          ''',
          )

          session_src = "packages/coding-agent/src/session/agent-session.ts"
          replace_once(
              session_src,
              '''import type { ResolvedModelRoleValue } from "../config/model-resolver";
          ''',
              '''import { preserveUpstreamRouting, type ResolvedModelRoleValue } from "../config/model-resolver";
          ''',
          )
          replace_once(
              session_src,
              '''\t\tconst refreshed = this.#modelRegistry.find(current.provider, current.id);
          \t\tif (!refreshed || refreshed.contextWindow === current.contextWindow) return;
          \t\tthis.agent.setModel(refreshed);
          \t\tawait this.#reconcileModelDependentState(current, refreshed);
          ''',
              '''\t\tconst refreshed = this.#modelRegistry.find(current.provider, current.id);
          \t\tif (!refreshed || refreshed.contextWindow === current.contextWindow) return;
          \t\tconst rebound = preserveUpstreamRouting(current, refreshed);
          \t\tthis.agent.setModel(rebound);
          \t\tawait this.#reconcileModelDependentState(current, rebound);
          ''',
          )

          resolver_test = "packages/coding-agent/test/model-resolver.test.ts"
          resolver_anchor = '''\t\texpect(withThinking.thinkingLevel).toBe(Effort.High);
          \t\texpect(openRouterOnly(withThinking.model)).toEqual(["google-ai-studio"]);
          \t});
          });
          
          describe("filterAvailableModelsByEnabledPatterns", () => {
          '''
          resolver_new = '''\t\texpect(withThinking.thinkingLevel).toBe(Effort.High);
          \t\texpect(openRouterOnly(withThinking.model)).toEqual(["google-ai-studio"]);
          \t});
          
          \ttest("resolveCliModel keeps routed matching scoped to the explicit provider", () => {
          \t\tconst proxyModel = buildModel({
          \t\t\tid: "openrouter/acme/model",
          \t\t\tname: "Proxy OpenRouter-shaped model",
          \t\t\tapi: "openai-completions",
          \t\t\tprovider: "proxy",
          \t\t\tbaseUrl: "https://openrouter.ai/api/v1",
          \t\t\treasoning: false,
          \t\t\tinput: ["text"],
          \t\t\tcost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
          \t\t\tcontextWindow: 128_000,
          \t\t\tmaxTokens: 8_192,
          \t\t});
          \t\tconst catalog = [...allModels, proxyModel];
          \t\tconst result = resolveCliModel({
          \t\t\tcliModel: "openrouter/acme/model@cerebras",
          \t\t\tmodelRegistry: { getAll: () => catalog, getAvailable: () => catalog },
          \t\t});
          
          \t\texpect(result.model).toBeUndefined();
          \t\texpect(result.error).toContain('Model "openrouter/acme/model@cerebras" not found');
          \t});
          });
          
          describe("filterAvailableModelsByEnabledPatterns", () => {
          '''
          replace_once(resolver_test, resolver_anchor, resolver_new)

          agent_test = "packages/coding-agent/test/agent-session-retry-fallback.test.ts"
          replace_once(
              agent_test,
              '''import { parseModelPattern, parseModelString } from "@oh-my-pi/pi-coding-agent/config/model-resolver";
          ''',
              '''import {
          \tformatModelStringWithRouting,
          \tparseModelPattern,
          \tparseModelString,
          } from "@oh-my-pi/pi-coding-agent/config/model-resolver";
          ''',
          )
          rebind_anchor = '''\t\texpect(session.model?.id).toBe("deepseek-v4-tiered");
          \t\texpect(session.model?.contextWindow).toBe(400_000);
          \t\texpect(session.getContextUsage()?.contextWindow).toBe(400_000);
          \t});
          
          \tit("warns on unknown or malformed model-selector chain keys at startup", () => {
          '''
          rebind_new = '''\t\texpect(session.model?.id).toBe("deepseek-v4-tiered");
          \t\texpect(session.model?.contextWindow).toBe(400_000);
          \t\texpect(session.getContextUsage()?.contextWindow).toBe(400_000);
          \t});
          
          \tit("preserves an explicit upstream pin while rebinding refreshed model metadata", async () => {
          \t\tconst buildRoutedModel = (contextWindow: number): Model<"openai-completions"> =>
          \t\t\tbuildModel({
          \t\t\t\tid: "acme/routed-tiered",
          \t\t\t\tname: "Routed Tiered Model",
          \t\t\t\tapi: "openai-completions",
          \t\t\t\tprovider: "openrouter",
          \t\t\t\tbaseUrl: "https://openrouter.ai/api/v1",
          \t\t\t\treasoning: false,
          \t\t\t\tinput: ["text"],
          \t\t\t\tcost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
          \t\t\t\tcontextWindow,
          \t\t\t\tmaxTokens: 8_192,
          \t\t\t});
          
          \t\tconst staleModel = buildRoutedModel(1_000_000);
          \t\tconst refreshedModel = buildRoutedModel(400_000);
          \t\tconst routedModel = parseModelPattern("openrouter/acme/routed-tiered@cerebras", [staleModel]).model;
          \t\tif (!routedModel) throw new Error("Expected routed OpenRouter model");
          
          \t\tconst registry = new ModelRegistry(authStorage, path.join(tempDir.path(), "routed-rebind-models.yml"));
          \t\tconst refreshGate = Promise.withResolvers<void>();
          \t\tvi.spyOn(registry, "awaitInitialBackgroundRefresh").mockImplementation(() => refreshGate.promise);
          \t\tconst find = registry.find.bind(registry);
          \t\tvi.spyOn(registry, "find").mockImplementation((provider, id) =>
          \t\t\tprovider === refreshedModel.provider && id === refreshedModel.id ? refreshedModel : find(provider, id),
          \t\t);
          
          \t\tconst settings = Settings.isolated({ "compaction.enabled": false });
          \t\tconst agent = new Agent({
          \t\t\tgetApiKey: model => `${model.provider}-test-key`,
          \t\t\tinitialState: { model: routedModel, systemPrompt: ["Test"], tools: [], messages: [] },
          \t\t\tstreamFn: () => {
          \t\t\t\tthrow new Error("stream should not run during discovery rebind");
          \t\t\t},
          \t\t});
          \t\tsession = new AgentSession({
          \t\t\tagent,
          \t\t\tsessionManager: SessionManager.inMemory(),
          \t\t\tsettings,
          \t\t\tmodelRegistry: registry,
          \t\t\trebindModelAfterDiscovery: true,
          \t\t});
          
          \t\tconst { promise: modelChanged, resolve: resolveModelChanged } = Promise.withResolvers<void>();
          \t\tconst unsubscribe = session.subscribe(event => {
          \t\t\tif (event.type === "model_changed") {
          \t\t\t\tunsubscribe();
          \t\t\t\tresolveModelChanged();
          \t\t\t}
          \t\t});
          
          \t\trefreshGate.resolve();
          \t\tawait Promise.race([
          \t\t\tmodelChanged,
          \t\t\tscheduler.wait(5_000).then(() => {
          \t\t\t\tthrow new Error("model_changed was not emitted after routed discovery settled");
          \t\t\t}),
          \t\t]);
          
          \t\tif (!session.model) throw new Error("Expected rebound model");
          \t\texpect(session.model.contextWindow).toBe(400_000);
          \t\texpect(formatModelStringWithRouting(session.model)).toBe("openrouter/acme/routed-tiered@cerebras");
          \t});
          
          \tit("warns on unknown or malformed model-selector chain keys at startup", () => {
          '''
          replace_once(agent_test, rebind_anchor, rebind_new)
          PY
      - name: Run resolver tests
        run: bun test packages/coding-agent/test/model-resolver.test.ts
      - name: Run discovery rebind tests
        run: bun test packages/coding-agent/test/agent-session-retry-fallback.test.ts
      - name: Type check workspace
        run: bun check
      - name: Commit fixes and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-review-routing-fixes-v2.yml
          git config user.name "Carter LaSalle"
          git config user.email "50027436+carterlasalle@users.noreply.github.com"
          git add packages/coding-agent/src/config/model-resolver.ts packages/coding-agent/src/session/agent-session.ts packages/coding-agent/test/model-resolver.test.ts packages/coding-agent/test/agent-session-retry-fallback.test.ts .github/workflows/one-shot-review-routing-fixes-v2.yml
          git commit -m "fix(coding-agent): preserve routed model constraints"
          git push origin HEAD:fix/switch-openrouter-upstream-routing
