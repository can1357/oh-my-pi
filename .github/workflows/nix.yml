name: OMP Nix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".github/actions/native-addon-cache/**"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".github/actions/native-addon-cache/**"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate and build flake
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Evaluate flake on all systems
        run: nix flake check --all-systems --no-build --print-build-logs --show-trace
      - name: Check bun.lock freshness (x86_64-linux)
        run: nix build .#checks.x86_64-linux.bun-lock --no-link --print-build-logs --show-trace

      - name: Build omp from source
        if: github.event_name == 'push'
        run: nix build .#packages.x86_64-linux.omp --no-link --print-build-logs --show-trace

      # PRs test the real packaging phases with a prebuilt addon.
      # This does not test Rust compilation or native changes in the PR.
      - name: Resolve native addon cache
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/native-addon-cache
      - name: Build omp with cached native addon
        if: github.event_name == 'pull_request'
        env:
          OMP_CI_NATIVE_ADDON: ${{ github.workspace }}/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node
        run: |
          nix build --impure --no-link --print-build-logs --show-trace --expr '
            (builtins.getFlake ("git+file://" + builtins.getEnv "GITHUB_WORKSPACE")).packages.x86_64-linux.omp.override {
              nativeAddon = builtins.path {
                path = /. + builtins.getEnv "OMP_CI_NATIVE_ADDON";
                name = "pi_natives.linux-x64-baseline.node";
              };
            }
          '
