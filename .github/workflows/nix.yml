name: OMP Nix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate and build flake
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate and build flake checks
        run: nix flake check --all-systems --print-build-logs --show-trace
