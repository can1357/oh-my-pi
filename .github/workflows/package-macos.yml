name: Package macOS

# Builds the release omp for aarch64-apple-darwin, packages it with
# scripts/package-macos.sh and installs the result into a scratch prefix with
# scripts/install-smoke-macos.sh. The same two steps run locally as
# `just package-macos` and `just install-smoke-macos`; this workflow only
# runs them on the macOS runner and keeps validated artifacts. An explicit owner
# dispatch on omp2 can also publish those same bytes as a draft GitHub Release.
#
# Manual only: a cold release build (thin LTO, one codegen unit, the LTO
# CPython bundle) is far too slow for every push.
on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Publish validated packages as a draft release (owner on omp2 only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: Package and install-smoke omp (macOS arm64)
    runs-on: macos-15
    outputs:
      build_attempt: ${{ steps.provenance.outputs.build_attempt }}
      artifact_name: ${{ steps.provenance.outputs.artifact_name }}
    # Bound manual runner occupancy while leaving time to upload artifacts.
    timeout-minutes: 120
    env:
      # The `secrets` context is not available in a step `if` (the run never
      # even parsed: GitHub recorded a job-less failure on every push). The
      # job env is where secrets may be read; steps test `env` instead.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain

      # Same provisioning as the rust job in ci.yml. The release build links
      # the LTO CPython bundle, which needs ld64.lld.
      - uses: ./.github/actions/macos-native-tools

      - uses: ./.github/actions/macos-build-state
        with:
          min-free-gb: ${{ vars.CI_MIN_FREE_GB || '60' }}

      # `just build-release`, spelled out so the runner needs no `just`.
      # sccache caches pre-LTO crate compilations via BuildBuddy when the org
      # key is available. Fork PRs compile uncached. The LTO link always runs
      # locally (LTO bitcode is architecture-specific).
      # Limit concurrent Cargo units: the LTO CPython link is memory-heavy and
      # unrestricted parallelism can swap until the package timeout.
      - name: Install sccache
        if: ${{ env.BUILDBUDDY_API_KEY != '' }}
        env:
          SCCACHE_VERSION: 0.10.0
          SCCACHE_SHA256: 5aba39252e2efa26bd76144f87ac59787d60fe567ab785e27e2a8c8190892eac
        run: |
          set -euo pipefail
          # Self-hosted runners have no writable /usr/local/bin; a scratch
          # directory on GITHUB_PATH works on hosted images too.
          install_dir="$RUNNER_TEMP/sccache-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz" \
            --output sccache.tar.gz
          printf '%s  %s\n' "$SCCACHE_SHA256" sccache.tar.gz | shasum -a 256 --check --status
          tar -xz --strip-components=1 -C "$install_dir" \
            "sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin/sccache" < sccache.tar.gz
          rm sccache.tar.gz
          "$install_dir/sccache" --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Build release omp
        timeout-minutes: 105
        run: |
          echo '::group::cargo build (release, LTO, embedded Python)'
          if [ -n "${BUILDBUDDY_API_KEY-}" ] && command -v sccache >/dev/null 2>&1; then
            echo "::notice::sccache + BuildBuddy GCS cache active for crate compilations"
            export RUSTC_WRAPPER="sccache"
            sccache --start-server 2>/dev/null || true
          fi
          PYO3_CONFIG_FILE="$GITHUB_WORKSPACE/vendor/python-release/pyo3-config.txt" \
            cargo build -p omp-app --bin omp --release --locked
          if [ -n "${RUSTC_WRAPPER-}" ]; then sccache --show-stats || true; fi
          echo '::endgroup::'

      - name: Package
        timeout-minutes: 5
        run: |
          target=$(cargo metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          scripts/package-macos.sh "$target/release/omp"

      - name: Install smoke
        timeout-minutes: 5
        run: scripts/install-smoke-macos.sh dist

      - name: Record validated package provenance
        id: provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/package_macos_evidence.py record dist \
            --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          printf 'build_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=omp-macos-arm64-%s-attempt-%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload partial artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-macos-arm64-partial-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/
            target/release/omp
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/*.sha256
            dist/package-provenance.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated macOS packages as draft
    needs: package
    if: ${{ inputs.publish_draft && github.event_name == 'workflow_dispatch' && github.repository == 'blyzer/oh-my-pi' && github.ref == 'refs/heads/omp2' && github.actor == 'blyzer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's validated package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: .ci-packages
      - name: Validate and publish exact existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ATTEMPT: ${{ needs.package.outputs.build_attempt }}
        run: |
          python3 scripts/package_macos_evidence.py publish .ci-packages \
            --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$BUILD_ATTEMPT"
