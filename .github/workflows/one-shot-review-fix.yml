name: One-shot review fix

on:
  push:
    branches:
      - fix/switch-openrouter-upstream-routing

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.repository == 'carterlasalle/oh-my-pi'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch release native addons
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
      - name: Apply review fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/test/model-resolver.test.ts")
          text = path.read_text()

          banned = '''\t\tconst registry = { getAll: () => catalog, getAvailable: () => catalog } as unknown as Parameters<
          \t\t\ttypeof resolveCliModel
          \t\t>[0]["modelRegistry"];
          
          '''
          if text.count(banned) != 1:
              raise SystemExit(f"expected banned registry fixture once, found {text.count(banned)}")
          text = text.replace(banned, "", 1)

          first_old = '''\t\t\tcliModel: "openrouter/google/gemini-3.8-flash@google-ai-studio",
          \t\t\tmodelRegistry: registry,
          '''
          first_new = '''\t\t\tcliModel: "openrouter/google/gemini-3.8-flash@google-ai-studio",
          \t\t\tmodelRegistry: { getAll: () => catalog, getAvailable: () => catalog },
          '''
          if text.count(first_old) != 1:
              raise SystemExit(f"expected first call anchor once, found {text.count(first_old)}")
          text = text.replace(first_old, first_new, 1)

          second_old = '''\t\t\tcliModel: "openrouter/google/gemini-3.8-flash@google-ai-studio:high",
          \t\t\tmodelRegistry: registry,
          '''
          second_new = '''\t\t\tcliModel: "openrouter/google/gemini-3.8-flash@google-ai-studio:high",
          \t\t\tmodelRegistry: { getAll: () => catalog, getAvailable: () => catalog },
          '''
          if text.count(second_old) != 1:
              raise SystemExit(f"expected thinking call anchor once, found {text.count(second_old)}")
          text = text.replace(second_old, second_new, 1)

          path.write_text(text)
          PY
      - name: Verify banned pattern is gone
        shell: bash
        run: |
          ! grep -n 'as unknown as Parameters<' packages/coding-agent/test/model-resolver.test.ts
      - name: Run targeted resolver tests
        run: bun test packages/coding-agent/test/model-resolver.test.ts
      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-review-fix.yml
          git config user.name "Carter LaSalle"
          git config user.email "50027436+carterlasalle@users.noreply.github.com"
          git add packages/coding-agent/test/model-resolver.test.ts .github/workflows/one-shot-review-fix.yml
          git commit -m "test(coding-agent): use structural registry fixture"
          git push origin HEAD:fix/switch-openrouter-upstream-routing
