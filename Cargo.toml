[workspace.metadata.omp.dependency-lints.omp-agent]
# D2: the agent reaches the world through omp-env; implementation crates stay
# behind env/v1.
allowed-world-boundary = ["omp-env"]
denied-direct = ["omp-envd", "omp-shell", "omp-walker"]

[workspace.lints.rust]
# ──────────────────────────────────────────────────────────────────────────────
# Rust Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
mismatched_lifetime_syntaxes = "allow"
missing_docs = "warn"                  # Every public symbol documented

[workspace.lints.clippy]
# ──────────────────────────────────────────────────────────────────────────────
# Base Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# ──────────────────────────────────────────────────────────────────────────────
# Synchronization Policy
# ──────────────────────────────────────────────────────────────────────────────
disallowed_methods = "deny"
disallowed_types = "deny"

# ──────────────────────────────────────────────────────────────────────────────
# Meta: Lint Attributes
# ──────────────────────────────────────────────────────────────────────────────
allow_attributes_without_reason = "warn" # Enforce reason for all #[allow]

# ──────────────────────────────────────────────────────────────────────────────
# Safety & Unsafe Code
# ──────────────────────────────────────────────────────────────────────────────
borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"

# ──────────────────────────────────────────────────────────────────────────────
# Numeric Casts & Conversions
# ──────────────────────────────────────────────────────────────────────────────
cast_lossless = "allow"            # u32 as u64 - 'as' is cleaner than From
cast_possible_truncation = "allow" # u64 as u32 - often intentional
cast_possible_wrap = "allow"       # u32 as i32 - can be intentional
cast_precision_loss = "allow"      # f64 as f32 - sometimes acceptable
cast_sign_loss = "allow"           # i32 as u32 - sometimes needed
tuple_array_conversions = "allow"  # Non-Into conversion is more clear

# ──────────────────────────────────────────────────────────────────────────────
# Floating Point
# ──────────────────────────────────────────────────────────────────────────────
float_cmp = "allow" # Tests mostly do this + we know what we're doing

# ──────────────────────────────────────────────────────────────────────────────
# Functions & Closures
# ──────────────────────────────────────────────────────────────────────────────
inline_always = "allow"                      # Needed for performance-critical code
must_use_candidate = "allow"                 # Only lifecycle guards opt into #[must_use]
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow" # .map(ToString::to_string) can be clearer
return_self_not_must_use = "allow"           # Builder chains do not require #[must_use]

# ──────────────────────────────────────────────────────────────────────────────
# Structs & Types
# ──────────────────────────────────────────────────────────────────────────────
inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"         # Not every field needs to be in Debug output
struct_excessive_bools = "allow"          # Usually with builders

# ──────────────────────────────────────────────────────────────────────────────
# Pattern Matching
# ──────────────────────────────────────────────────────────────────────────────
match_same_arms = "allow"                    # Can be intentional for clarity
match_wildcard_for_single_variants = "allow" # _ can be clearer than listing variants
option_if_let_else = "allow"                 # match/if-let-else often clearer

# ──────────────────────────────────────────────────────────────────────────────
# Imports & Module Organization
# ──────────────────────────────────────────────────────────────────────────────
enum_glob_use = "allow"
items_after_statements = "allow" # Sometimes more readable
wildcard_imports = "allow"       # Cleaner for preludes and test modules

# ──────────────────────────────────────────────────────────────────────────────
# Variables & Type Inference
# ──────────────────────────────────────────────────────────────────────────────
let_underscore_untyped = "allow" # Type obvious from context
similar_names = "allow"          # 'req' and 'res' together are fine

# ──────────────────────────────────────────────────────────────────────────────
# Literals & Formatting
# ──────────────────────────────────────────────────────────────────────────────
tabs_in_doc_comments = "allow" # rustfmt (hard_tabs + format_code_in_doc_comments) emits them
unreadable_literal = "allow"   # 10_000_000 vs 0xDEADBEEF is context dependent
verbose_bit_mask = "allow"     # Explicit bit patterns can be clearer than hex

# ──────────────────────────────────────────────────────────────────────────────
# Code Style
# ──────────────────────────────────────────────────────────────────────────────
assert_is_empty = "allow"             # assert!(x.is_empty()) is fine; assert_eq! vs `[] as [T; 0]` is noise
default_trait_access = "allow"        # Default::default() sometimes clearer
significant_drop_tightening = "allow" # We pay attention to this already

# ──────────────────────────────────────────────────────────────────────────────
# Documentation
# ──────────────────────────────────────────────────────────────────────────────
missing_errors_doc = "allow" # Documenting every error return is often redundant
missing_panics_doc = "allow" # Not every panic needs docs, especially assert!

# ──────────────────────────────────────────────────────────────────────────────
# Complexity
# ──────────────────────────────────────────────────────────────────────────────
too_many_arguments = "allow" # Argument count is rarely the real complexity signal
too_many_lines = "allow"     # Arbitrary limits don't account for necessary complexity

# No debuginfo in dev builds. With Mach-O split debug maps, file:line
# backtraces require retaining every .rcgu.o — ~1 GB per linked test binary
# (static CPython), >100 GB target dirs. Panic locations survive via
# #[track_caller] and symbol names via the symbol table; use the
# `release-profiling` profile when line-level debug info is actually needed.
# Mirrored in .cargo/config.toml so user-global [profile.dev] config cannot
# override it.
[profile.dev]
debug = false
split-debuginfo = "off"
# Cold builds do not benefit from incremental bookkeeping. Disabling it also
# makes workspace crates cacheable by sccache; 256 CGUs preserve parallel
# backend codegen rather than falling back to the non-incremental default.
incremental = false
codegen-units = 256

# Extension artifact verification and the b3sum builtin stay hot in debug
# builds; sha2 (Hash32) gets speed from the "*" glob below plus aarch64 asm.
[profile.dev.package.blake3]
opt-level = 3
# Keep dependencies at the compile-first dev level. Runtime-critical hashes are
# overridden above; release profiles retain production optimization.
[profile.dev.package."*"]
opt-level = 0
# Generated/broad APIs where omp consumes only a narrow slice. Rustc defers
# unused function codegen instead of building code the linker later discards.
[profile.dev.package.objc2-app-kit]
hint-mostly-unused = true
[profile.dev.package.objc2-av-foundation]
hint-mostly-unused = true
[profile.dev.package.objc2-foundation]
hint-mostly-unused = true
[profile.dev.package.objc2-web-kit]
hint-mostly-unused = true
[profile.dev.package.pdf-inspector]
hint-mostly-unused = true
[profile.dev.package.mermaid-text]
hint-mostly-unused = true
[profile.dev.package.gix]
hint-mostly-unused = true

[profile.release]
opt-level = 2
debug = false
incremental = true
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
# Fast local release iteration: same codegen as `release` but split across 16
# codegen units so a one-crate edit does not re-optimize the world.
# `cargo build --profile release-dev`.
[profile.release-dev]
inherits = "release"
codegen-units = 16

# `release` with symbols kept for `perf`/`samply`/Instruments. Same opt-level,
# so timings match production; the binary is just larger.
# `cargo build --profile release-profiling`.
[profile.release-profiling]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"
