name = "oh-my-pi-install-redirect"
main = "worker.js"
compatibility_date = "2026-06-19"

# The apex already has externally managed DNS, so use a zone route there. The
# subdomains use custom-domain routes. The apex serves a small private-domain
# homepage; oh-my-pk serves the CLI landing page plus /install.sh, /install.ps1,
# /version, and /bin/<tag>/<binary>.
routes = [
	{ pattern = "pkking.computer/*", zone_name = "pkking.computer" },
	{ pattern = "oh-my-pk.pkking.computer", custom_domain = true },
	{ pattern = "oh-my-pi.pkking.computer", custom_domain = true },
]

[[services]]
binding = "COLLAB"
service = "ompk-collab"

[vars]
# Private Hugging Face repo that stores the release binaries (free storage + egress).
HF_REPO = "pkkidking/oh-my-pi-binaries"
# "models" (default) or "datasets".
HF_REPO_TYPE = "datasets"

# HF_TOKEN is a SECRET — never commit it. Set it once with:
#   wrangler secret put HF_TOKEN
# Use a fine-grained, read-only token scoped to the binaries repo.
