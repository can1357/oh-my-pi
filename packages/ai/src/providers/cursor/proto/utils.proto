    ERROR_CLAUDE_IMAGE_TOO_LARGE = 31;
    ERROR_FILE_NOT_FOUND = 33;
    ERROR_API_KEY_RATE_LIMIT = 34;
    ERROR_DEBOUNCED = 35;
    ERROR_BAD_REQUEST = 36;
    ERROR_REPOSITORY_SERVICE_REPOSITORY_IS_NOT_INITIALIZED = 37;
