[package]
name = "omp-desktop"          # MUST NOT equal the sidecar name ("omp")
version = "18.0.7"
description = "omp Desktop"
authors = ["Stencil Labs, Inc."]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"       # tauri 2.x floor; transitive deps may demand more

# Detaches this crate from the monorepo cargo workspace, whose `members` are
# explicit (see the root Cargo.toml). Without it cargo errors with "current
# package believes it's in a workspace when it's not". Consequences: its own
# Cargo.lock (commit it) and its own src-tauri/target/.
[workspace]

[lib]
# The _lib suffix avoids a lib/bin name collision on Windows (cargo#8519).
name = "omp_desktop_lib"
# staticlib -> iOS, cdylib -> Android, rlib -> the desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Native folder picker for "add a project"; the webview cannot open one itself.
tauri-plugin-dialog = "2"
# Opening a file in the system editor and an OAuth URL in the browser. The JS
# package was installed from the start; the Rust half never was, so every
# `openPath`/`openUrl` rejected and three features silently did nothing.
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0.181", features = ["derive"] }  # >=1.0.181 for rename_all_fields
serde_json = "1"
# Tauri vendors tokio but does not re-export its macros; select!/interval need this.
tokio = { version = "1", features = ["time", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
