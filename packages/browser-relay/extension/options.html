<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="browserRelay.optionsTitle">OMP Browser Relay settings</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-width: 28rem;
				margin: 2rem auto;
				padding: 0 1rem;
				color: #1f2328;
			}
			label {
				display: block;
				margin: 1rem 0 0.25rem;
				font-weight: 600;
			}
			input {
				width: 100%;
				padding: 0.4rem 0.5rem;
				font: inherit;
				box-sizing: border-box;
			}
			button {
				margin-top: 1.25rem;
				padding: 0.45rem 1.1rem;
				font: inherit;
			}
			#status {
				margin-left: 0.75rem;
				color: #1a7f37;
			}
			p.hint {
				color: #57606a;
				font-size: 0.85rem;
			}
		</style>
	</head>
	<body>
		<h1 data-i18n="browserRelay.title">OMP Browser Relay</h1>
		<p class="hint" data-i18n="browserRelay.hint">
			The extension connects to a local <code>omp-browser-relay</code> process. Values here must match the flags the
			relay was started with.
		</p>
		<label for="language" data-i18n="browserRelay.labels.language">Language</label>
		<select id="language">
			<option value="auto" data-i18n="browserRelay.language.auto">Automatic</option>
			<option value="en" data-i18n="browserRelay.language.english">English</option>
			<option value="zh-CN" data-i18n="browserRelay.language.chinese">简体中文</option>
		</select>
		<label for="port" data-i18n="browserRelay.labels.port">Relay port</label>
		<input id="port" type="number" min="1" max="65535" />
		<label for="token"><span data-i18n="browserRelay.labels.token">Token</span> (<span data-i18n="browserRelay.labels.tokenOptional">optional</span>)</label>
		<input id="token" type="text" autocomplete="off" />
		<button id="save" data-i18n="browserRelay.save">Save</button><span id="status"></span>
		<script src="options.js"></script>
	</body>
</html>
