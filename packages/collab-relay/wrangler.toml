name = "ompk-collab"
main = "src/index.ts"
compatibility_date = "2026-07-13"

[[routes]]
pattern = "collab.pkking.computer"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = [ "/healthz", "/r/*", "/s", "/s/*", "/h", "/h/*" ]

[[durable_objects.bindings]]
name = "COLLAB_ROOMS"
class_name = "CollabRoom"

[[durable_objects.bindings]]
name = "SHARE_UPLOADS"
class_name = "ShareUploadRateLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "CollabRoom" ]

[[migrations]]
tag = "v2"
new_sqlite_classes = [ "ShareUploadRateLimit" ]

[[r2_buckets]]
binding = "SHARES"
bucket_name = "ompk-collab-shares"

[[r2_buckets]]
binding = "HUB_BLOBS"

[[kv_namespaces]]
binding = "HUB_TOKENS"

[triggers]
crons = [ "0 * * * *" ]
