name = "ompk-linear-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Atomic job queue: a single Durable Object instance serializes admission,
# leasing, and fenced completion (KV read-modify-write was racy and is gone).
[[durable_objects.bindings]]
name = "JOB_QUEUE"
class_name = "JobQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "JobQueue" ]

# Non-secret dispatch allowlists. Empty values fail closed (nothing dispatches).
#   LINEAR_AGENT_USER_ID  - Linear user id of the agent principal; only issues
#                           assigned to it may dispatch
#   ALLOWED_PROJECT_IDS   - comma-separated Linear project ids allowed to dispatch
#   ALLOWED_MODELS        - comma-separated `model:` combo ids allowed to dispatch
[vars]
LINEAR_AGENT_USER_ID = ""
ALLOWED_PROJECT_IDS = ""
ALLOWED_MODELS = ""
# Account-wide GitHub App installation for kingkillery.
GITHUB_INSTALLATION_ID = ""
GITHUB_ACCOUNT_LOGIN = "kingkillery"
GITHUB_MENTION_HANDLE = "ompk"
GITHUB_MODEL = ""

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   LINEAR_WEBHOOK_SECRET   - signing secret from the Linear OAuth app's webhook config
#   LINEAR_API_TOKEN        - the app's developer (actor=app) token, used to read issues/labels
#                             and post comments back as the ompk agent
#   RELAY_TOKEN             - shared secret the Windows-side relay presents when polling/submitting
#   STATUS_TOKEN            - separate administrative credential required by /status
#   GITHUB_WEBHOOK_SECRET   - GitHub App webhook secret
#   GITHUB_APP_ID           - GitHub App numeric id
#   GITHUB_APP_PRIVATE_KEY  - GitHub App PKCS#8 PEM private key
