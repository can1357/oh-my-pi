# cargo-deny 0.20.2 policy. Empty targets means evaluate every target-specific
# dependency in Cargo.lock; all-features covers optional dependency edges.
[graph]
targets = []
all-features = true

[licenses]
include-dev = true
include-build = true
unused-allowed-license = "deny"
unused-license-exception = "deny"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
# File-level copyleft and public-domain-style licenses are kept package-scoped
# so additions remain visible in review instead of broadening the allowlist.
exceptions = [
    { allow = ["MPL-2.0"], crate = "bitmaps@2.1.0" },
    { allow = ["MPL-2.0"], crate = "im@15.1.0" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "sized-chunks@0.6.5" },
    { allow = ["MPL-2.0"], crate = "uluru@3.1.0" },
]

# tree-sitter-graphql 0.1.0 omits a manifest expression; cargo-deny identifies
# its packaged LICENSE as MIT, while about.toml pins that file's SHA-256.
[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/0x676e67/btls",
]
