SPECIFICATION Spec

CONSTANTS
    N = 1
    H = 3
    MaxResizes = 0
    MaxLive = 1
    RowValues <- ModelRows
    SnapshotValues <- SmallModelSnapshots
    NoFinal = NoFinal
    Placeholder = Placeholder
    Blank = Blank
    OverflowMarker = OverflowMarker

INVARIANTS
    TypeOK
    LifecycleShape
    SnapshotDiscipline
    EmissionDiscipline
    Capacity
    ExactCommittedHistory
    ScreenCapacity

PROPERTIES
    HistoryMonotonicity
    FinalImmutability
    AppendOnlyMonotonicity
    FailedWriteStops
    StoppedQuiescence
    FlushLiveness

CHECK_DEADLOCK FALSE
