# pi's in-process extras for the embedded shell: the command-line utilities
# (`cat`, `grep`, `sed`, `ls`, `jq`, …) and the process builtins (`ps`, `top`,
# `sleep`, `pgrep`, `pkill`, `pidwait`, `lsof`), one module per command. The shell's
# bash builtins live in its engine; hosts run these through `extras::run`.
#
# The utilities used to be ~50 separate vendored crates driven through a
# thread-local I/O shim; they now run against the explicit `host::Host` view of
# the shell (see `src/host.rs`). See LICENSE for the third-party notices that
# come with the ported code.
[package]
name = "omp-builtins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version = "1.99.0"
description = "In-process command-line utilities and process builtins for the embedded shell"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "omp_builtins"
path = "src/lib.rs"
bench = false

[dependencies]
async-trait.workspace = true
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["cargo", "color", "derive", "env", "wrap_help"] }
fancy-regex.workspace = true
futures = "0.3.34"
itertools = "0.15.0"
parking_lot = "0.12.5"
thiserror = "2.0.21"

# ── Utility builtin dependencies ──────────────────────────────────────────────
# `ast-grep scan`: YAML rules on the ast-grep-core version omp-ast uses, and
# their diagnostics in ast-grep's codespan layout.
ast-grep-config = { version = "0.41.1", optional = true }
ast-grep-core = { workspace = true, optional = true }
bigdecimal = "0.4"
bstr = "1.14.0"
flume = "0.12"
foldhash = "0.2.0"
glob = "0.3.4"
globset = "0.4"
grep-cli = "0.1"
grep-matcher = "0.1"
grep-printer = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
hex = "0.4.3"
# `sort` collates and reads numbers per call from the shell's locale; uucore's
# i18n helpers cache one process-wide locale.
icu_collator = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.4", default-features = false, features = ["alloc"] }
icu_provider = { version = "2.4", default-features = false }
ignore = "0.4"
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
jiff = { version = "0.2.46", features = ["tzdb-bundle-platform"] }
memchr = "2.8.3"
nom = "8.0.0"
num-bigint = "0.4"
num-traits = "0.2"
onig = { version = "6.5", default-features = false }
os_display = "0.1.4"
parse_datetime = "0.17"
omp-ast = { workspace = true, optional = true }
omp-diff.workspace = true
omp-xfs.workspace = true
omp-vfs.workspace = true
rand = { version = "0.10.4", features = ["std_rng"] }
rayon = "1.12"
regex = "1.13"
# `awk`: POSIX leftmost-longest matching (hybrid DFA, `MatchKind::All`).
regex-automata = "0.4"
rustc-hash = "2.1.3"
# `perl`: insertion-ordered hashes, PCRE2 matching, sockets, XID identifiers,
# `\N{NAME}` lookup, Unicode::Normalize, `\b{wb}`/`\b{sb}` boundaries.
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"], optional = true }
indexmap = { version = "2", optional = true }
pcre2-sys = { workspace = true, optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
unicode-ident = { version = "1", optional = true }
unicode-segmentation = { version = "1.13", optional = true }
self_cell = "1.3.0"
serde = { workspace = true, optional = true }
serde_json = "1"
# Exact pin keeps `ast-grep test` snapshot bytes identical to ast-grep 0.50.0.
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["serialize"], optional = true }
serde_yaml = { version = "0.9", optional = true }
smallvec.workspace = true
tempfile = "3.27.0"
# `direnv`: `direnv.toml`.
toml = { workspace = true, optional = true }
tokio-util = "0.7"
xutf.workspace = true
libc = "0.2.191"

[dependencies.uucore]
version = "0.8.0"
default-features = false
features = [
  "backup-control",
  "checksum",
  "colors",
  "encoding",
  "entries",
  "extendedbigdecimal",
  "fast-inc",
  "format",
  "fs",
  "fsext",
  "hardware",
  "i18n-charmap",
  "i18n-collator",
  "i18n-datetime",
  "i18n-decimal",
  "libc",
  "lines",
  "mode",
  "parser",
  "pipes",
  "process",
  "quoting-style",
  "ranges",
  "ringbuffer",
  "signals",
  "sum",
  "time",
  "version-cmp",
  "wide",
  "update-control",
]

[target."cfg(any(unix, windows))".dependencies]
# `cp`'s copy-on-write clones (`omp_iso::cow`).
omp-iso.workspace = true
# `rsync`: strong checksums, daemon auth digests, token compression.
base64.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lz4_flex = "0.14"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
xxhash-rust = { workspace = true, features = ["xxh3", "xxh64"] }
zstd.workspace = true
# `tar`: the archive format and its bzip2/xz codecs (pure Rust).
bzip2 = "0.6"
lzma-rust2 = { version = "0.26", default-features = false, features = ["std", "encoder", "xz"] }
tar = { version = "0.4.46", default-features = false }

[target."cfg(any(unix, windows))".dependencies.tokio]
version = "1.54.1"
features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"]

[target.'cfg(target_family = "wasm")'.dependencies.tokio]
version = "1.54.1"
features = ["io-util", "macros", "rt"]

[target."cfg(any(target_os = \"freebsd\", target_os = \"openbsd\"))".dependencies]
dns-lookup = "4.0.2"

[target."cfg(unix)".dependencies]
# `socket`/`net`/`uio`: perl's recv with packed peer addresses.
nix = { version = "0.31.4", features = ["fs", "net", "poll", "process", "resource", "signal", "socket", "term", "uio", "user"] }
rustix = { version = "1.1.6", features = ["fs", "process", "system", "time"] }
uucore = { version = "0.8.0", features = ["fsxattr", "safe-traversal"] }

# `open`: NSWorkspace.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", optional = true }
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "block2", "libc"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"], optional = true }

# `open`: D-Bus activation, the desktop portal and the file manager.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }

[target."cfg(windows)".dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "time"] }
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
anyhow = "1.0.105"
tempfile = "3"

[features]
default = ["utils"]

# ── Utility builtins ──────────────────────────────────────────────────────────
# One feature per ported utility so a single utility can be built (and checked)
# in isolation. `utils` turns on the whole set and is part of `default`.
"util.ast-grep" = [
  "dep:omp-ast",
  "dep:ast-grep-config",
  "dep:ast-grep-core",
  "dep:serde",
  "dep:serde-saphyr",
  "dep:serde_yaml",
]
"util.awk" = []
"util.b2sum" = ["util.cksum"]
"util.base32" = []
"util.base64" = ["util.base32"]
"util.basename" = []
# Shared POSIX BRE translation behind grep/sed/nl.
"util.bre" = []
"util.cat" = []
"util.chmod" = []
"util.cksum" = []
"util.cmp" = []
"util.column" = []
"util.comm" = []
"util.cp" = []
"util.cut" = []
"util.date" = []
"util.dd" = []
"util.df" = []
"util.diff" = []
"util.direnv" = ["dep:toml"]
"util.dirname" = []
"util.du" = []
# Needs change notification and processes: unix and windows targets.
"util.entr" = []
"util.env" = []
"util.fd" = []
# Needs the codecs `-z` decodes with: unix and windows targets.
"util.file" = []
"util.find" = []
"util.flock" = []
"util.fold" = []
# Needs change notification: unix and windows targets.
"util.fswatch" = ["util.bre"]
"util.grep" = ["util.bre"]
"util.head" = []
"util.hostname" = []
"util.id" = []
"util.jq" = []
"util.ln" = []
"util.ls" = []
# Lists open files and sockets per process: linux, macos and windows targets.
"util.lsof" = ["util.procs"]
"util.md5" = ["util.cksum"]
"util.md5sum" = ["util.cksum"]
"util.mkdir" = []
"util.mktemp" = []
"util.combine" = []
"util.errno" = []
"util.ifne" = []
"util.isutf8" = []
"util.sponge" = []
"util.ts" = []
"util.mv" = []
