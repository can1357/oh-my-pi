"util.open" = ["dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:zbus"]
"util.paste" = []
# `perl`: Perl 5 interpreter; PCRE2 is the closest engine to Perl's regexes.
"util.perl" = [
  "dep:icu_normalizer",
  "dep:indexmap",
  "dep:pcre2-sys",
  "dep:socket2",
  "dep:unicode-ident",
  "dep:unicode-segmentation",
