[package]
name = "pi-shell"
description = "pi's embedded bash: the bash 5.3 engine, its OS and pi-vfs hosts, persistent sessions, and the shell API pi-natives exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
# Portions of the minimizer adapt MIT-licensed algorithms from rtk-ai/rtk.
# See NOTICE at this crate root (packaged on publish).

[features]
# Measurement only, never in a product build: obash counts every allocation
# and, with `PI_SHELL_ALLOC_STATS=PATH`, appends the totals to PATH at exit
# (`src/bin/obash/alloc_stats.rs`). Build it into its own target dir so
# timing benches keep the plain allocator.
alloc-stats = []
# Measurement only (the `overhead` bench's second build): drops the per-op
# control-word check, so cancel and pause latency break. Never for tests.
no-safepoint-check = []

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
bstr.workspace = true
bytes.workspace = true
clap.workspace = true
encoding_rs.workspace = true
flume.workspace = true
hashbrown.workspace = true
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }
libm.workspace = true
# obash's allocator (`src/bin/obash`), as in the shell it is benchmarked as.
mimalloc.workspace = true
parking_lot.workspace = true
pi-builtins.workspace = true
pi-vcs.workspace = true
pi-vfs.workspace = true
postcard.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
smallvec.workspace = true
windows-sys.workspace = true
winreg.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

# The engine benches print their own statistics.
[[bench]]
name = "frames"
harness = false
[[bench]]
name = "create"
harness = false
# Safepoint overhead needs a second run with `--features no-safepoint-check`.
[[bench]]
name = "overhead"
harness = false
[[bench]]
name = "memory"
harness = false
[[bench]]
name = "sys_spawn"
harness = false
