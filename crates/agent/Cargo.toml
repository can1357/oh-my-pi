[package]
name = "omp-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Durable, interruptible agent-loop foundations for OMP"
readme = "README.md"

[dependencies]
bytes = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
hifijson = { workspace = true }
jaq-core = { workspace = true }
jaq-json = { workspace = true }
jaq-std = { workspace = true }
omp-core = { workspace = true, features = ["schemars"] }
omp-ast = { workspace = true }
# D2 world boundary: client API only. CI rejects docserver, shell-engine, and walker.
omp-env = { workspace = true }
omp-inference = { workspace = true }
omp-memory = { workspace = true }
omp-slopjson = { workspace = true }
omp-secrets = { workspace = true }
omp-snapcompact = { workspace = true }
omp-proto = { workspace = true, features = ["tonic"] }
omp-scribe = { workspace = true }
# The sole sanctioned direct storage edge is the durable journal subscriber.
omp-observability = { workspace = true }
omp-storage = { workspace = true }
omp-tool = { workspace = true }
parking_lot = { workspace = true }
portable-atomic = { workspace = true }
schemars = { workspace = true }
regex = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true
