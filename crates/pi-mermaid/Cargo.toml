[package]
name = "pi-mermaid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Mermaid to ASCII/Unicode terminal diagram renderer"
# Option/Result::map_or_default; the `pi_mermaid_msrv` CI job holds this.
rust-version = "1.98"

[lints]
workspace = true

[features]
default = ["unicode"]
unicode = ["dep:unicode-segmentation", "dep:unicode-width"]
xutf = ["dep:xutf"]

[dependencies]
html-escape.workspace = true
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
xutf = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
