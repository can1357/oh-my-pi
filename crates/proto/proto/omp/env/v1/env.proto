// Per-invocation authority for every top-level and nested environment request.
// Hello and owner-lifecycle traffic may omit it only under connection policy.
message InvocationScope {
  string invocation_id = 1;
  bytes effect_token = 2;
  uint64 host_generation = 3;
  uint64 session_generation = 4;
  // Authenticated invocation restriction: pseudo-terminal allocation is denied.
  bool pty_denied = 5;
  // Stable durable session principal authenticated by the composing client.
  string session_id = 6;
  // Stable durable agent principal within session_id; never a transport id.
  string agent_id = 7;
  omp.inference.v1.ValueMap props = 15;
}

message WorkspaceUpdateCheck {
  string mode = 1;
  uint64 interval_ms = 2;
  uint64 now_ms = 3;
}

// Structured syntax-repair prompt generated by the edit observer.
message EditRepairPrompt {
  string language = 1;
  string before = 2;
  string after = 3;
  optional string previous_attempt = 4;
}

enum EditRepairFailureCode {
  EDIT_REPAIR_FAILURE_CODE_UNSPECIFIED = 0;
  EDIT_REPAIR_FAILURE_CODE_UNAVAILABLE = 1;
  EDIT_REPAIR_FAILURE_CODE_COMPLETION = 2;
}

message EditRepairFailure {
  EditRepairFailureCode code = 1;
  string message = 2;
}

message EditRepairQuery {
  string invocation_id = 1;
  EditRepairPrompt prompt = 2;
