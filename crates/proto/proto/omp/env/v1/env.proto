syntax = "proto3";

package omp.env.v1;

import "omp/blob/v1/blob.proto";
import "omp/document/v1/document.proto";
import "omp/identity/v1/identity.proto";
import "omp/inference/v1/common.proto";
import "omp/policy/v1/policy.proto";
import "omp/thread/v1/thread.proto";

// Environment-daemon protocol. Each stdio, UDS, or in-process transport carries
// varint-length-delimited ClientFrame and ServerFrame messages. request_id 0 is
// reserved for the hello exchange and unsolicited events; ordinary request ids
// are nonzero and unique among in-flight operations.
//
// Evolution rules:
//   - Receivers skip unknown fields and enum values.
//   - Experimental extensions use a namespaced ValueMap at tag 15.
//   - Field numbers are never reused; removed fields are reserved.
//   - An EventStreamError terminates only the named event stream. No later
//     event on that stream may be treated as contiguous.

// Per-connection override for tool invocation approval. An unspecified mode
// preserves the daemon's configured approval behavior.
enum ApprovalMode {
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_ALWAYS_ASK = 1;
  APPROVAL_MODE_WRITE = 2;
  APPROVAL_MODE_YOLO = 3;
}

message ClientHello {
  string client = 1;
  uint32 schema_rev = 2;
  repeated string capabilities = 3;
  bytes client_id = 4;
  ApprovalMode approval_mode = 5;
  omp.inference.v1.ValueMap props = 15;
}

// Whether a constructed command sandbox confines the commands a server runs,
// as the server's own probe found (`omp_envd::admission::SandboxState`).
enum SandboxState {
  // Not reported.
  SANDBOX_STATE_UNSPECIFIED = 0;
  // A sandbox was constructed and confines spawned commands.
  SANDBOX_STATE_ACTIVE = 1;
  // No filesystem sandbox was requested.
  SANDBOX_STATE_OFF = 2;
  // A sandbox was requested, but this operating system has no native backend.
  SANDBOX_STATE_UNSUPPORTED_HOST = 3;
  // A sandbox was requested, but the native backend is missing or failed its
  // live probe.
  SANDBOX_STATE_BACKEND_UNAVAILABLE = 4;
  // A sandbox was requested, but its policy was refused.
  SANDBOX_STATE_POLICY_REJECTED = 5;
}

// Whether the server permits workspace-provided active configuration.
enum WorkspaceTrust {
  // Older servers do not report workspace trust.
  WORKSPACE_TRUST_UNSPECIFIED = 0;
  WORKSPACE_TRUST_UNTRUSTED = 1;
  WORKSPACE_TRUST_TRUSTED = 2;
}

message ServerHello {
  uint32 schema_rev = 1;
  uint32 min_schema_rev = 2;
  repeated string capabilities = 3;
  string server_version = 4;
  bytes workspace_id = 5;
  string root_uri = 6;
  bytes server_epoch = 7;
  // Local executable-generation fingerprint; empty when the server could not
  // read its executable metadata.
  string server_build = 8;
  // SHA-256 digest (32 bytes) of the sandbox and approval policy the server
  // enforces (`omp_env::project_state::DaemonPolicy`). A client attaches to a
  // project daemon only when it equals the digest of its own policy.
  bytes policy_digest = 9;
  // Tag 10 is planned for the server's sandbox capabilities
  // (docs/py/06-policy.md).
  //
  // The sandbox state the server admits and confines this connection's
  // commands under. Equal policies digest equal settings, not equal probes: a
  // daemon probed its host once, when it started, so a client reports this
  // state, not its own probe, for the calls the server admits.
  SandboxState sandbox_state = 11;
  // Fixed before composition and included in policy_digest.
  WorkspaceTrust workspace_trust = 12;
  omp.inference.v1.ValueMap props = 15;
}

// Asks the daemon to retire its listening socket: stop accepting new
// connections, drain, and release the endpoint. Sent by a newer-build client
// replacing a stale owner.
message Retire {
  omp.inference.v1.ValueMap props = 15;
}

// Acknowledges that retirement has begun.
message RetireStarted {
  omp.inference.v1.ValueMap props = 15;
}

message ShutdownRequest {
  uint64 grace_ms = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ShutdownAcknowledged {
  uint64 accepted_at_ms = 1;
  omp.inference.v1.ValueMap props = 15;
}

// Registers one application process whose lifetime keeps the project scope active.
// The serving daemon owns the durable presence record and also releases it when
// this connection closes.
message RegisterPresence {
  bytes client_id = 1;
  uint32 pid = 2;
  string kind = 3;
  omp.inference.v1.ValueMap props = 15;
}

message PresenceRegistered {
  bytes lease_id = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ReleasePresence {
  bytes lease_id = 1;
  omp.inference.v1.ValueMap props = 15;
}

message PresenceReleased {
  bytes lease_id = 1;
  omp.inference.v1.ValueMap props = 15;
}

enum OutputRequest {
  OUTPUT_REQUEST_UNSPECIFIED = 0;
  OUTPUT_REQUEST_BOUNDED = 1;
  OUTPUT_REQUEST_COMPLETE = 2;
}

// Opens the streaming channel for one tool call. The env may prepare work after
// this request, but must not perform effects until ArgsCommitted arrives.
// COMPLETE bypasses the ordinary inline limit, never the host security ceiling.
message InvokeTool {
  string invocation_id = 1;
  string name = 2;
  string rev = 3;
  uint64 deadline_ms = 4;
  OutputRequest output_request = 5;
  // Roster restrictions the client enforced when it dispatched this call.
  // A tool that hosts nested tool calls (the eval bridge) applies the same
  // restrictions to each nested call. Absent means unrestricted.
  optional ToolRestrictions restrictions = 6;
  omp.inference.v1.ValueMap props = 15;
}

// Per-request tool-roster restrictions (`sv_tools` allowlist, mode Director
// binds, `turn_start` hook filter, plan-file write scope, the read-only
// ceiling of a plan-mode subagent), snapshotted by the
// client when it projected the model request that named the call.
message ToolRestrictions {
  // Effective `sv_tools` allowlist plus the hidden mounts advertised beside
  // it. Absent means no allowlist applies.
  optional ToolNames allowlist = 1;
  // Director id whose bind supplied the allowlist; empty for a user value.
  string allowlist_director = 2;
  // Names a `turn_start` hook left enabled. Absent means no hook filter.
  optional ToolNames hook = 3;
  // The wire roster the model was shown for the request; refusals quote the
  // names of it that remain callable.
  repeated string available = 4;
  // While plan mode is active, the only target `write` may change.
  optional string plan_file = 5;
  // Present when the caller is a subagent spawned under plan mode: the only
  // (read-only) tools it may call, whatever its allowlist says. The
  // environment refuses every write such an invocation attempts.
  optional ToolNames read_only_ceiling = 6;
  // Hidden mount tools (`goal`, `think`) the session never mounted; a call to
  // one is refused.
  repeated string unmounted = 7;
}

// An explicit set of stable tool names.
message ToolNames {
  repeated string names = 1;
}

message InvokeAccepted {
  string invocation_id = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ArgText {
  string invocation_id = 1;
  string fragment = 2;
  omp.inference.v1.ValueMap props = 15;
}

// The sole effect-authorization gate. raw is the exact committed UTF-8
// argument text; effect_token is minted by Core for this invocation and every
// scoped DATA request must echo it. authorized_at_ms timestamps the transition.
message ArgsCommitted {
  string invocation_id = 1;
  bytes raw = 2;
  bytes effect_token = 3;
  uint64 authorized_at_ms = 4;
  // Core-narrowed authority, never wider than ToolDecl.effects.
  optional omp.policy.v1.EffectEnvelope effects = 5;
  omp.inference.v1.ValueMap props = 15;
}

enum InterruptClass {
  INTERRUPT_CLASS_UNSPECIFIED = 0;
  INTERRUPT_CLASS_IMMEDIATE = 1;
  INTERRUPT_CLASS_TURN_BOUNDARY = 2;
  INTERRUPT_CLASS_IDLE = 3;
  INTERRUPT_CLASS_DEADLINE = 4;
}

message Interrupt {
  string invocation_id = 1;
  string reason = 2;
  InterruptClass class = 3;
  omp.inference.v1.ValueMap props = 15;
}

message Update {
  string invocation_id = 1;
  bytes json = 2;
  omp.inference.v1.ValueMap props = 15;
}

// Complete source-line ranges in model-facing parts. Core returns only lines
// retained by its final projection to the registered tool's authority.
message ProjectionSpan {
  uint64 part = 1;
  uint64 start_byte = 2;
  uint64 end_byte = 3;
  string source_key = 4;
  uint64 line = 5;
}

// Terminal omp-tool verdict truth, except Detached sends Outcome::Detached.
// The complete serialized CallOutcome always lives in the environment CAS;
// details_blob.size is its exact byte length. Model-facing parts remain
// canonical thread vocabulary.
message Verdict {
  string invocation_id = 1;
  // Reserved compatibility field; schema revision 18 producers leave it empty.
  bytes json = 2;
  repeated omp.thread.v1.Part parts = 3;
  // Whether the structured verdict is a fault, argument error, or abort.
  bool is_error = 4;
  // Whether model-facing parts may be compacted while structured truth remains.
  bool useless = 5;
  // Whole structured verdict in the environment CAS (SHA-256, application/json).
  optional omp.thread.v1.Blob details_blob = 6;
  // Extension opt-in to suppressing the automatic model follow-up.
  optional bool terminate = 7;
  // Host-authored facts for the one trust-boundary projection.
  optional OutputProjection projection = 8;
  // Empty for producers without document visibility candidates.
  repeated ProjectionSpan visibility = 9;
  omp.inference.v1.ValueMap props = 15;
}

message VisibleSourceLine {
  string source_key = 1;
  uint64 line = 2;
}

// Application-only acknowledgement after central projection. Extension hosts
// cannot mint visibility receipts. The host checks the exact live revision,
// decodes the typed verdict, and rejects lines absent from its projection.
message VisibilityAuthorization {
  string name = 1;
  string rev = 2;
  bytes verdict = 3;
  repeated VisibleSourceLine lines = 4;
}
message VisibilityAuthorized {}

message EnvironmentDelta {
  map<string, string> set = 1;
  repeated string unset = 2;
  omp.inference.v1.ValueMap props = 15;
}

message PtySpec {
  uint32 rows = 1;
  uint32 columns = 2;
  string terminal = 3;
  omp.inference.v1.ValueMap props = 15;
}

message SessionLeaseSpec {
  uint64 ttl_ms = 1;
  omp.inference.v1.ValueMap props = 15;
}

message OpenSessionRequest {
  string cwd_uri = 1;
  EnvironmentDelta env_delta = 2;
  optional PtySpec pty = 3;
  optional SessionLeaseSpec lease = 4;
  ShellProfileInput shell_profile = 5;
  omp.inference.v1.ValueMap props = 15;
}

message OpenSessionResponse {
  bytes session = 1;
  bytes lease = 2;
  string cwd_uri = 3;
  ExecBackendCapabilities capabilities = 4;
  omp.inference.v1.ValueMap props = 15;
}

message CloseSessionRequest {
  bytes session = 1;
  omp.inference.v1.ValueMap props = 15;
}

message CloseSessionResponse {
  bytes session = 1;
  omp.inference.v1.ValueMap props = 15;
}

message Script {
  string text = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ExecRequest {
  bytes session = 1;
  Script source = 2;
  OutputRequest output_request = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ExecStarted {
  bytes session = 1;
  bytes exec = 2;
  omp.inference.v1.ValueMap props = 15;
}

message StdinFrame {
  bytes exec = 1;
  oneof input {
    bytes data = 2;
    bool eof = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

message SignalRequest {
  bytes exec = 1;
  string signal = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ResizeRequest {
  bytes exec = 1;
  uint32 rows = 2;
  uint32 columns = 3;
  omp.inference.v1.ValueMap props = 15;
}

enum OutputChannel {
  OUTPUT_CHANNEL_UNSPECIFIED = 0;
  OUTPUT_CHANNEL_STDOUT = 1;
  OUTPUT_CHANNEL_STDERR = 2;
  OUTPUT_CHANNEL_PTY = 3;
}

message OutputFrame {
  bytes exec = 1;
  OutputChannel channel = 2;
  bytes data = 3;
  uint64 sequence = 4;
  omp.inference.v1.ValueMap props = 15;
}

enum ExecOutcome {
  EXEC_OUTCOME_UNSPECIFIED = 0;
  EXEC_OUTCOME_EXITED = 1;
  EXEC_OUTCOME_FAILED = 2;
  EXEC_OUTCOME_TIMEOUT = 3;
  EXEC_OUTCOME_CANCELLED = 4;
  EXEC_OUTCOME_DENIED = 5;
}

// Facts about one projection at the environment trust boundary. The artifact
// always identifies the complete source when the environment CAS is present.
message OutputProjection {
  OutputRequest request = 1;
  uint64 source_bytes = 2;
  uint64 inline_bytes = 3;
  bool omitted = 4;
  optional omp.thread.v1.Blob artifact = 5;
  // Replacement for the model-facing shell transcript; streamed frames remain unchanged.
  optional string model_text = 6;
}

enum ToolDiagSeverity {
  TOOL_DIAG_SEVERITY_UNSPECIFIED = 0;
  TOOL_DIAG_SEVERITY_INFO = 1;
  TOOL_DIAG_SEVERITY_WARN = 2;
  TOOL_DIAG_SEVERITY_ERROR = 3;
}

enum ToolDiagUnit {
  TOOL_DIAG_UNIT_UNSPECIFIED = 0;
  TOOL_DIAG_UNIT_LINES = 1;
  TOOL_DIAG_UNIT_ROWS = 2;
  TOOL_DIAG_UNIT_ENTRIES = 3;
  TOOL_DIAG_UNIT_FILES = 4;
  TOOL_DIAG_UNIT_BYTES = 5;
  TOOL_DIAG_UNIT_CHARS = 6;
  TOOL_DIAG_UNIT_ITEMS = 7;
}

message ToolDiagOmitted {
  uint64 count = 1;
  ToolDiagUnit unit = 2;
}

message ToolDiag {
  ToolDiagSeverity severity = 1;
  string kind = 2;
  string text = 3;
  optional string continuation = 4;
  optional string artifact = 5;
  optional ToolDiagOmitted omitted = 6;
}

message ExecStatusMsg {
  ExecOutcome outcome = 1;
  optional int32 exit_code = 2;
  string signal = 3;
  uint64 wall_clock_ms = 4;
  optional omp.thread.v1.Blob spilled_output = 5;
  bool aborted = 6;
  optional OutputProjection projection = 7;
  // Structured harness notices; never part of stdout/stderr bytes.
  repeated ToolDiag diags = 8;
  omp.inference.v1.ValueMap props = 15;
}

message ExitEvent {
  bytes exec = 1;
  ExecStatusMsg status = 2;
  string final_cwd_uri = 3;
  uint64 final_cwd_revision = 4;
  omp.inference.v1.ValueMap props = 15;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_NEVER = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_ALWAYS = 3;
}

message RestartSpec {
  RestartPolicy policy = 1;
  uint64 delay_ms = 2;
  optional uint32 max_restarts = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessSpec {
  Script source = 1;
  string cwd_uri = 2;
  EnvironmentDelta env_delta = 3;
  optional PtySpec pty = 4;
  RestartSpec restart = 5;
  bool detached = 6;
  bool persist = 7;
  // Maximum lifetime for this process generation in milliseconds.
  optional uint64 timeout_ms = 8;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyProbe {
  oneof probe {
    ReadyLog log = 1;
    ReadyTcp tcp = 2;
    ReadyPing ping = 4;
  }
  uint64 timeout_ms = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyLog {
  string pattern = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyTcp {
  string host = 1;
  uint32 port = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ReadyPing {
  uint64 nonce = 1;
  omp.inference.v1.ValueMap props = 15;
}

message StartProcess {
  string name = 1;
  ProcessSpec spec = 2;
  repeated ReadyProbe ready = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessStarted {
  string name = 1;
  uint64 generation = 2;
  ProcessIdentity identity = 3;
  uint64 log_offset = 4;
  optional string endpoint = 5;
  omp.inference.v1.ValueMap props = 15;
}

message ListProcesses {
  omp.inference.v1.ValueMap props = 15;
}
message GetProcess {
  string name = 1;
  uint64 generation = 2;
  uint32 wire_revision = 3;
  omp.inference.v1.ValueMap props = 15;
}

message RestartProcess {
  string name = 1;
  uint64 generation = 2;
  uint32 wire_revision = 3;
  omp.inference.v1.ValueMap props = 15;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STARTING = 1;
  PROCESS_STATE_READY = 2;
  PROCESS_STATE_RUNNING = 3;
  PROCESS_STATE_EXITED = 4;
  PROCESS_STATE_STOPPED = 5;
  PROCESS_STATE_FAILED = 6;
}

message ProcessInfo {
  string name = 1;
  uint64 generation = 2;
  ProcessState state = 3;
  ExecStatusMsg status = 4;
  ProcessIdentity identity = 5;
  uint64 log_start_offset = 6;
  uint64 log_end_offset = 7;
  string ready_match = 8;
  repeated string ready_pending = 9;
  uint32 restart_count = 10;
  uint32 consecutive_failures = 11;
  optional string endpoint = 12;
  // Immutable launch specification retained for describe, restart, and recovery.
  ProcessSpec spec = 13;
  // Readiness conditions retained alongside the launch specification.
  repeated ReadyProbe ready = 14;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessList {
  repeated ProcessInfo processes = 1;
  omp.inference.v1.ValueMap props = 15;
}

message AttachOutput {
  string name = 1;
  uint64 after_sequence = 2;
  uint64 generation = 3;
  uint64 max_bytes = 4;
  bool terminal_text = 5;
  uint32 terminal_columns = 6;
  uint32 terminal_rows = 7;
  omp.inference.v1.ValueMap props = 15;
}

message OutputAttached {
  string name = 1;
  uint64 generation = 2;
  uint64 log_start_offset = 3;
  uint64 log_end_offset = 4;
  bool rotated = 5;
  bool terminal_text = 6;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessOutput {
  string name = 1;
  uint64 generation = 2;
  OutputChannel channel = 3;
  bytes data = 4;
  uint64 sequence = 5;
  uint64 log_offset = 6;
  bool terminal_text = 7;
  bool truncated = 8;
  omp.inference.v1.ValueMap props = 15;
}

message SendInput {
  string name = 1;
  oneof input {
    bytes data = 2;
    bool eof = 3;
  }
  uint64 generation = 4;
  omp.inference.v1.ValueMap props = 15;
}

message SignalProcess {
  string name = 1;
  string signal = 2;
  uint64 generation = 3;
  omp.inference.v1.ValueMap props = 15;
}

message StopProcess {
  string name = 1;
  uint64 grace_ms = 2;
  uint64 generation = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessStateEvent {
  ProcessInfo process = 1;
  omp.inference.v1.ValueMap props = 15;
}

message ProcessCommandAccepted {
  string name = 1;
  bool shutdown_acknowledged = 2;
  uint64 generation = 3;
  omp.inference.v1.ValueMap props = 15;
}

// Marks the end of one frame-multiplexed Put stream. Preceding frames carrying
// the same request_id contain omp.blob.v1.Chunk values in order.
message CommitBlobPut {
  omp.inference.v1.ValueMap props = 15;
}

// Terminates one complete or ranged blob download. A disconnected request has
// no terminal marker; clients retain the number of chunks durably written and
// resume with a new omp.blob.v1.GetRequest at that offset.
message BlobGetComplete {
  // Digest of the complete stored blob, matching the first chunk.
  bytes hash = 1;
  // Bytes sent for this request's selected range, not the complete blob size.
  uint64 bytes_sent = 2;
  omp.inference.v1.ValueMap props = 15;
}

message CancelRequest {
  oneof target {
    uint64 target_request_id = 1;
    string invocation_id = 2;
    bytes exec = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

enum EventStreamKind {
  EVENT_STREAM_KIND_UNSPECIFIED = 0;
  EVENT_STREAM_KIND_INVOCATION = 1;
  EVENT_STREAM_KIND_EXEC = 2;
  EVENT_STREAM_KIND_PROCESS_OUTPUT = 3;
  EVENT_STREAM_KIND_PROCESS_STATE = 4;
  reserved 5;
  EVENT_STREAM_KIND_DOCUMENT = 6;
  EVENT_STREAM_KIND_LSP_REGISTRY = 7;
  EVENT_STREAM_KIND_WALK = 8;
  EVENT_STREAM_KIND_SEARCH = 9;
  EVENT_STREAM_KIND_DAP = 10;
  EVENT_STREAM_KIND_RESOURCE_COMPLETION = 11;
  EVENT_STREAM_KIND_MCP_NOTIFICATION = 12;
}

enum EventStreamFailure {
  EVENT_STREAM_FAILURE_UNSPECIFIED = 0;
  EVENT_STREAM_FAILURE_LAGGED = 1;
  EVENT_STREAM_FAILURE_CLOSED = 2;
  EVENT_STREAM_FAILURE_SYNCHRONIZATION = 3;
}

message EventStreamError {
  EventStreamKind stream = 1;
  EventStreamFailure failure = 2;
  string invocation_id = 3;
  bytes exec = 4;
  string process_name = 5;
  uint64 skipped_events = 6;
  string message = 7;
  omp.inference.v1.ValueMap props = 15;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_INVALID_ARGUMENT = 1;
  PROTOCOL_ERROR_CODE_NOT_FOUND = 2;
  PROTOCOL_ERROR_CODE_PERMISSION_DENIED = 3;
  PROTOCOL_ERROR_CODE_UNSUPPORTED = 4;
  PROTOCOL_ERROR_CODE_INTERNAL = 5;
  PROTOCOL_ERROR_CODE_ALREADY_EXISTS = 6;
  PROTOCOL_ERROR_CODE_PRECONDITION_FAILED = 7;
  PROTOCOL_ERROR_CODE_CANCELLED = 8;
  PROTOCOL_ERROR_CODE_DEADLINE_EXCEEDED = 9;
  PROTOCOL_ERROR_CODE_UNCOMMITTED = 10;
  // 11 and 12 were proposed for a deferred sandbox protocol and remain
  // unavailable so a future implementation cannot silently reuse them.
  reserved 11, 12;
  PROTOCOL_ERROR_CODE_RESOURCE_EXHAUSTED = 13;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  omp.inference.v1.ValueMap props = 15;
}

// Admission is the only direct post-v1 addition because ordering it between
// InvokeTool and ArgsCommitted is part of the invocation state machine.
message AdmitInvocation {
  string invocation_id = 1;
  optional omp.policy.v1.BashIr bash = 2;
  uint64 deadline_ms = 3;
  // The effects the call was judged by: its argument-scoped envelope, else the
  // live revision's declared maximum.
  optional omp.policy.v1.EffectEnvelope effects = 4;
  // Every distinct host the call's fetches reach that the environment
  // resolvers performing them can name. Empty when the envelope does not
  // fetch. Each is approved on its own, whatever else the call fetches.
  repeated omp.policy.v1.FetchTarget fetch = 5;
  // Whether some fetch of the call reaches a host the environment cannot
  // name: a locator no resolver names, or a fetching tool that names no
  // locators. That remainder is approved as the tool's own fetch, beside
  // every host in `fetch`.
  bool fetch_unnamed = 6;
  omp.inference.v1.ValueMap props = 15;
}

message Admission {
  string invocation_id = 1;
  bool allow = 2;
  optional omp.policy.v1.PolicyDenied denied = 3;
  // RFC 7386 merge patch over the effective argument object.
  bytes args_patch = 4;
  omp.inference.v1.ValueMap props = 15;
}

// Reuses the canonical document, filesystem, and LSP request vocabulary.
message DocumentOp {
  oneof op {
    omp.document.v1.OpenDocumentRequest open = 1;
    omp.document.v1.CloseDocumentRequest close = 2;
    omp.document.v1.ReadDocumentRequest read = 3;
    omp.document.v1.SummarizeDocumentRequest summarize = 4;
    omp.document.v1.CommitTransactionRequest commit_transaction = 5;
    omp.document.v1.CanonicalizePathRequest canonicalize = 6;
    omp.document.v1.StatPathRequest stat = 7;
    omp.document.v1.ListDirectoryRequest list_directory = 8;
    omp.document.v1.CreateDirectoryRequest create_directory = 9;
    omp.document.v1.RemovePathRequest remove = 10;
    omp.document.v1.RenamePathRequest rename = 11;
    omp.document.v1.CopyPathRequest copy = 12;
    omp.document.v1.ReadLinkRequest read_link = 13;
    omp.document.v1.CreateSymlinkRequest create_symlink = 14;
    omp.document.v1.CreateHardLinkRequest create_hard_link = 16;
    omp.document.v1.SetPermissionsRequest set_permissions = 17;
    omp.document.v1.GetLspBindingsRequest get_lsp_bindings = 18;
    omp.document.v1.LspRequest lsp_request = 19;
    omp.document.v1.LspNotificationRequest lsp_notification = 20;
    omp.document.v1.LspStatusRequest lsp_status = 21;
  }
  omp.inference.v1.ValueMap props = 15;
}

message DocumentResult {
  oneof result {
    omp.document.v1.OpenDocumentResponse opened = 1;
    omp.document.v1.CloseDocumentResponse closed = 2;
