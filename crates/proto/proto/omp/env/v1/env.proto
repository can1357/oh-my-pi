  string path = 1;
  string rule = 2;
}
message CaptureInputsReply {
  // SHA-256 of the manifest blob in the environment blob store, retrievable by
  // digest through the blob service. Empty when refused is not.
  bytes manifest_hash = 1;
  uint64 manifest_size = 2;
  uint64 files = 3;
  uint64 bytes = 4;
  repeated InputExclusion excluded_rules = 5;
  uint64 excluded_symlinks = 6;
  repeated InputRefusal refused = 7;
  uint32 wire_revision = 8;
  omp.inference.v1.ValueMap props = 15;
}
