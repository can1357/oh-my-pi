// Captures the git-defined working tree as a content-addressed input manifest.
// Unlike SnapshotWorkspace it publishes no generation or snapshot record and
// takes no workspace transition lock.
message CaptureInputsRequest {
  // Operator globs added to the built-in upload deny list.
  repeated string deny_globs = 1;
  // Workspace-relative paths exempt from the deny list and the content scan.
  repeated string allow_paths = 2;
