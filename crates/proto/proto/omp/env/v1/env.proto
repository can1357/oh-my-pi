// Requests disposal of every daemon-owned evaluation session.
message EvalResetRequest {}

// Acknowledges that every daemon-owned evaluation session was reset.
message EvalResetResponse {}

// Registers which ACP facilities this connection can serve. Sending false
// unbinds that facility from the connection. Every bind of `documents` starts
// a fresh editor epoch: the daemon forgets which editor contents it had
// anchored for this connection (ADR 0037 §3). The removed `exec` facility
// (ACP terminal execution) is reserved; shell commands always run in the
// daemon's in-process shell.
message AcpBind {
  reserved 2;
  reserved "exec";
  bool documents = 1;
  // Deadline, in milliseconds, of each editor request (the editor's
  // `sv_acp_fs_timeout`): the daemon waits this long for an AcpReadQuery
  // answer, and an AcpWriteQuery write-back makes up to three such requests.
  // Zero while `documents` is false.
  uint64 fs_timeout_ms = 3;
  // The editor answers AcpReadQuery (`fs.readTextFile`); without it the
  // daemon never asks for a buffer and disk is every document's base.
  bool read_text = 4;
  // The editor answers AcpWriteQuery (`fs.writeTextFile`); without it no
  // commit is written back.
  bool write_text = 5;
}

message AcpReadQuery {
  uint64 query_id = 1;
  string invocation_id = 2;
  string path = 3;
}

// One write-back of committed bytes to the editor (ADR 0037 §4.3). The
// connection queues it per path behind earlier write-backs of that path; a
// newer write-back of the same path supersedes one not yet sent.
message AcpWriteQuery {
  uint64 query_id = 1;
  string invocation_id = 2;
  string path = 3;
  // The committed bytes R, in the file's encoding on disk.
  string content = 4;
  // The editor buffer B the commit used as its base, normalized to LF
  // without a BOM. Before writing, the editor's buffer is read again and the
  // user's changes since B are merged onto `content`. Absent when the commit
  // used no editor buffer (a create, or a buffer that could not be read):
  // `content` is then written as is.
  optional string base = 5;
}

message AcpDocumentAnswer {
  uint64 query_id = 1;
  string invocation_id = 2;
  oneof body {
    string content = 3;
    ProtocolError error = 4;
    // The outcome of an AcpWriteQuery.
    AcpWriteBack write_back = 5;
  }
}

// What one editor write-back did.
message AcpWriteBack {
  oneof outcome {
    AcpWritten written = 1;
    AcpWriteConflict conflict = 2;
    AcpWriteSuperseded superseded = 3;
  }
}

// The editor holds the committed bytes, merged with what the user typed
// since the base.
message AcpWritten {
  // The bytes the editor was sent, present only when they differ from the
  // query's `content` (the user's later changes merged in).
  optional string merged = 1;
  // The buffer read back after the write, present only when it differs from
  // what was sent: the client reformatted it.
  optional string read_back = 2;
}

// Skipped: the user's changes since the base overlap the commit. Ranges are
// in the base's normalized byte coordinates.
message AcpWriteConflict {
  repeated omp.document.v1.ByteRange ranges = 1;
}

// Skipped: a newer committed revision of the same path replaced this one
// before it was sent.
message AcpWriteSuperseded {}

// One requirement of a relayed approval prompt, field for field the session's
// approval requirement (`omp_agent::ApprovalSpec`).
message ApprovalSpec {
  // Short user-visible description.
  string title = 1;
  // TML-safe explanatory text.
  string body = 2;
  // Exact command, path, or device subject.
  string subject = 3;
  // Presentation and configuration vocabulary, such as `sandbox_amendment`.
  string kind = 4;
  // Offered grant scopes in strictness order, as approval scope spellings.
  repeated string scopes = 5;
  // Answer applied when the prompt times out (`ApprovalSpec::default`);
  // absent means no default. Not named `default`: prost's accessor for that
  // name would shadow `Default::default` on the generated struct.
  optional bool timeout_default = 6;
  // Requested approver route.
  string route = 7;
  // Optional named external approver.
  optional string approver = 8;
  // Maximum wait in milliseconds; zero means no timeout.
  uint64 timeout_ms = 9;
  // Unreachable-route behavior, such as `fail_closed`.
  string unreachable = 10;
  // Forbids non-human decisions.
  bool require_human = 11;
  // Scope-bearing approval pattern.
  optional string pattern = 12;
  // Rule and derived-fact evidence.
  repeated string evidence = 13;
}

// The daemon asks the connection that issued a command to decide one approval
// prompt the command needs, such as a sandbox amendment. It travels only on
// the request_id of the InvokeTool or Exec that issued the command, and only
// to a connection whose ClientHello advertised the `approval-relay`
// capability; it is never broadcast to other connections. The client answers
// with exactly one ApprovalAnswer on the same request_id unless the daemon
// first sends ApprovalWithdrawn for the query.
message ApprovalQuery {
  // Unique among this connection's queries.
  uint64 query_id = 1;
  // Invocation the requester attributes the prompt to; absent for prompts
  // that block no invocation, such as sandbox amendments.
  optional string invocation_id = 2;
  // Every requirement of the prompt in filing order.
  repeated ApprovalSpec reasons = 3;
  // Daemon-clock epoch milliseconds when the requirement was filed.
  uint64 created_at_ms = 4;
}

// The daemon stopped waiting for a query's answer: the command finished or
// was cancelled, the daemon's backstop deadline passed, or the session
// closed. Sent on the query's request_id. The client withdraws the prompt and
// does not answer it.
message ApprovalWithdrawn {
  uint64 query_id = 1;
}

// The outcome of a relayed prompt, field for field the session's approval
// decision (`omp_agent::ApprovalDecision`).
message ApprovalDecision {
  // Whether every requirement of the prompt is approved.
  bool approved = 1;
  // Granted lifetime as its approval scope spelling (`once`, `call`, `turn`,
  // `session`, `persist`, or a host-defined scope).
  string scope = 2;
  // Who supplied the answer as its snake_case approval source spelling
  // (`user`, `external`, `forwarded`, `config`, `extension`, `timeout`,
  // `unavailable`). The daemon treats an unknown spelling as a denial.
  string source = 3;
  // Optional authenticated decider.
  optional string decided_by = 4;
  // Optional user-visible rationale.
  optional string reason = 5;
  // Whether a fail-open result was durably audited.
  bool audited = 6;
}

// Answers one ApprovalQuery. It is a continuation frame on the query's
// request_id and carries no scope; it opens no response stream. The daemon
// ignores an answer to an unknown, withdrawn, already answered, or foreign
// query silently: it never replies with a ProtocolError, which would end the
// issuing request's stream. An answer without a decision is a denial.
message ApprovalAnswer {
  uint64 query_id = 1;
  ApprovalDecision decision = 2;
}

// The session's conversation was rewound or switched to another session, so
// the journal it now serves may not hold the session-scoped approvals this
// connection gave: the daemon drops every network endpoint this connection
// approved for the session. Its commands are asked again, and the session
// answers from the grants that journal holds. An unsolicited control frame on request_id 0 that opens no response
// stream; a connection that relays no approvals has nothing to revoke, and
// the frame is ignored.
message RevokeApprovalGrants {}

// The daemon asks the connection that issued a memory `reflect` call to
// synthesize its answer on that session's inference: the daemon recalls the
// evidence, the session owns the model. It travels only on the request_id of
// the InvokeTool or Exec that issued the call, and only to a connection whose
// ClientHello advertised the `reflection-relay` capability; it is never
// broadcast to other connections. The client answers with exactly one
// ReflectionAnswer on the same request_id unless the daemon first sends
// ReflectionWithdrawn for the query.
message ReflectionQuery {
  // Unique among this connection's reflection queries.
  uint64 query_id = 1;
  // The question to answer.
  string question = 2;
  // Optional current context that focuses the synthesis.
  optional string context = 3;
  // The recalled memory contents in relevance order; never empty.
  repeated string evidence = 4;
}

// The daemon stopped waiting for a reflection: the call was interrupted or
// cancelled, or the request ended. Sent on the query's request_id. The client
// stops the synthesis and does not answer it.
message ReflectionWithdrawn {
  uint64 query_id = 1;
}

// Why the issuing session produced no synthesis.
enum ReflectionFailure {
  REFLECTION_FAILURE_UNSPECIFIED = 0;
  // The session binds no inference for reflection; the daemon answers with
  // the recalled evidence.
  REFLECTION_FAILURE_UNAVAILABLE = 1;
  // The session's inference ended without a usable synthesis.
  REFLECTION_FAILURE_INFERENCE = 2;
}

// Answers one ReflectionQuery. It is a continuation frame on the query's
// request_id and carries no scope; it opens no response stream. The daemon
// ignores an answer to an unknown, withdrawn, already answered, or foreign
// query silently: it never replies with a ProtocolError, which would end the
// issuing request's stream. An answer without a body, or with an unspecified
// failure, is an inference failure.
message ReflectionAnswer {
  uint64 query_id = 1;
  oneof body {
    // The synthesized answer.
    string answer = 2;
    ReflectionFailure failure = 3;
  }
}

enum ExtensionUpdateRefusal {
  EXTENSION_UPDATE_REFUSAL_UNSPECIFIED = 0;
  EXTENSION_UPDATE_REFUSAL_FEATURE_REMOVED = 1;
  EXTENSION_UPDATE_REFUSAL_CAPABILITY_CHANGED = 2;
