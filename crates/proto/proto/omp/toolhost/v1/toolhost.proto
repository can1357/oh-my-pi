  omp.inference.v1.ValueMap props = 15;
}

enum SessionTransitionRefusalCode {
  SESSION_TRANSITION_REFUSAL_CODE_UNSPECIFIED = 0;
  SESSION_TRANSITION_REFUSAL_CODE_INVALID_SETUP = 1;
  SESSION_TRANSITION_REFUSAL_CODE_INACCESSIBLE_PARENT = 2;
  SESSION_TRANSITION_REFUSAL_CODE_INVALID_ORIGIN = 3;
  SESSION_TRANSITION_REFUSAL_CODE_UI_BUSY = 4;
  SESSION_TRANSITION_REFUSAL_CODE_EFFECTS_NOT_AUTHORIZED = 5;
  SESSION_TRANSITION_REFUSAL_CODE_QUOTA_EXCEEDED = 6;
  SESSION_TRANSITION_REFUSAL_CODE_STALE_GENERATION = 7;
}

