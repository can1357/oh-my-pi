  optional bytes verdict_json = 2;
  optional bytes raw_args = 3;
  omp.inference.v1.ValueMap props = 15;
}
message ContextResetNotice {
  uint64 event = 1;
  uint64 epoch = 2;
  omp.inference.v1.ValueMap props = 15;
}
message ContextHostEnvelope {
  oneof body {
    ThreadProjectionRequest thread_projection = 1;
    CompactionRequest compaction_request = 2;
    PromptPull prompt_pull = 3;
    ContextResetNotice context_reset = 4;
    FetchedItem fetched_item = 5;
  }
  omp.inference.v1.ValueMap props = 15;
}
message ContextWorkerEnvelope {
  oneof body {
    ContextPatch context_patch = 1;
    CompactionVerdict compaction_verdict = 2;
    PromptContribution prompt_contribution = 3;
    RegisterSlots register_slots = 4;
    FetchItem fetch_item = 5;
  }
  omp.inference.v1.ValueMap props = 15;
}

// Journal, session, usage, and artifact CONTROL traffic.
