syntax = "proto3";

package omp.toolhost.v1;

import "omp/control/v1/control.proto";
import "omp/env/v1/env.proto";
import "omp/inference/v1/common.proto";
import "omp/inference/v1/inference.proto";
import "omp/inference/v1/models.proto";
import "omp/policy/v1/policy.proto";
import "omp/telemetry/v1/telemetry.proto";
import "omp/thread/v1/thread.proto";
import "omp/ui/v1/ui.proto";

// Python extension-host CONTROL protocol. Frames are varint-length-delimited;
// request_id 0 is registration, unsolicited-event, and health traffic.
//
// Evolution rules:
//   - Receivers skip unknown fields and enum values.
//   - Experimental extensions use a namespaced ValueMap at tag 15.
//   - Field numbers are never reused; removed fields are reserved.
//   - A terminal ToolResultComplete, ToolArgs, or ToolAborted fuses an invocation.
//   - New domains use nested envelopes; the original direct arms remain fixed.
message WorkerHello {
  uint32 schema_rev = 1;
  string python_rev = 2;
  bytes worker_id = 3;
  uint32 api_level = 4;
  string layer = 5;
  string tier = 6;
  string pool = 7;
  string host_version = 8;
  uint64 host_generation = 9;
  uint64 session_generation = 10;
  omp.inference.v1.ValueMap props = 15;
}

enum GrammarSyntax {
  GRAMMAR_SYNTAX_UNSPECIFIED = 0;
  GRAMMAR_SYNTAX_LARK = 1;
  GRAMMAR_SYNTAX_REGEX = 2;
  GRAMMAR_SYNTAX_EBNF = 3;
  GRAMMAR_SYNTAX_GBNF = 4;
}

message SchemaConstraint {
  // Constraint-budget priority; LARGER values are preferred (ratified 2026-08-19).
  uint32 priority = 1;
  omp.inference.v1.Fallback on_unsupported = 2;
}
message GrammarConstraint {
  GrammarSyntax syntax = 1;
  string definition = 2;
  // Constraint-budget priority; LARGER values are preferred (ratified 2026-08-19).
  uint32 priority = 3;
  omp.inference.v1.Fallback on_unsupported = 4;
}
message TextualConstraint {
  GrammarSyntax syntax = 1;
  string expression = 2;
  // Constraint-budget priority; LARGER values are preferred (ratified 2026-08-19).
  uint32 priority = 3;
  omp.inference.v1.Fallback on_unsupported = 4;
}
message JsonConstraint {
  bytes schema_json = 1;
  // Constraint-budget priority; LARGER values are preferred (ratified 2026-08-19).
  uint32 priority = 2;
  omp.inference.v1.Fallback on_unsupported = 3;
}
message ToolConstraint {
  oneof kind {
    SchemaConstraint schema = 1;
    GrammarConstraint grammar = 2;
    TextualConstraint textual = 3;
    JsonConstraint json = 4;
  }
}

message ToolExample {
  bytes args_json = 1;
  optional string description = 2;
}
enum PreludeParamKind {
  PRELUDE_PARAM_KIND_UNSPECIFIED = 0;
  PRELUDE_PARAM_KIND_POSITIONAL_OR_KEYWORD = 1;
  PRELUDE_PARAM_KIND_KEYWORD_ONLY = 2;
}
enum ToolExecutionMode {
  TOOL_EXECUTION_MODE_UNSPECIFIED = 0;
  TOOL_EXECUTION_MODE_PARALLEL = 1;
  TOOL_EXECUTION_MODE_SEQUENTIAL = 2;
}

// Python parameter shape for an eval-prelude helper (declarations with
// revision family "prelude").
message PreludeParam {
  string name = 1;
  PreludeParamKind kind = 2;
  // JSON-encoded default value; absent = required parameter.
  optional bytes default_json = 3;
  // Display-only annotation text for generated stubs.
  optional string annotation = 4;
  omp.inference.v1.ValueMap props = 15;
}
message ToolDecl {
  omp.inference.v1.ToolDef definition = 1;
  string rev = 2;
  ToolConstraint constraint = 3;
  string extension_id = 4;
  uint32 precedence = 5;
  repeated string replaces = 6;
  string summary = 7;
  string docs = 8;
  repeated ToolExample examples = 9;
  bool streams_args = 10;
  // Maximum device envelope; Core may only narrow it at authorization.
  optional omp.policy.v1.EffectEnvelope effects = 11;
  repeated PreludeParam prelude_params = 12;
  // Declaration intent ("soft" or "hard"); Core resolves the mounted surface.
  string kind = 13;
  // Per-tool batch scheduling constraint.
  ToolExecutionMode execution_mode = 14;
  omp.inference.v1.ValueMap props = 15;
  // Frozen Python placement spelling: host, env, or worker:<name>.
  string place = 16;
}

message ExtensionDecl {
  string extension_id = 1;
  string version = 2;
  uint32 api_level = 3;
  repeated string capabilities = 4;
  omp.inference.v1.ValueMap props = 15;
}
message SlotDecl {
  uint32 slot = 1;
  string class = 2;
  sint32 priority = 3;
  omp.inference.v1.ValueMap props = 15;
}
message RegisterTools {
  reserved 5;
  reserved "commands";

  repeated ToolDecl tools = 1;
  uint64 generation = 2;
  repeated ExtensionDecl extensions = 3;
  repeated SlotDecl slots = 4;
  omp.inference.v1.ValueMap props = 15;
}

message InvokeTool {
  string call_id = 1;
  string name = 2;
  bytes args_json = 3;
  uint64 deadline_ms = 4;
  string rev = 5;
  omp.inference.v1.ValueMap props = 15;
}
message CancelTool {
  string call_id = 1;
  string reason = 2;
  omp.inference.v1.ValueMap props = 15;
}
message ToolUpdate {
  string call_id = 1;
  bytes json = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ArgIssue {
  repeated string path = 1;
  string expected = 2;
  string kind = 3;
  optional string example = 4;
  optional string found = 5;
  omp.inference.v1.ValueMap props = 15;
}
enum OutcomeKind {
  OUTCOME_KIND_UNSPECIFIED = 0;
  OUTCOME_KIND_OK = 1;
  OUTCOME_KIND_FAULTED = 2;
  OUTCOME_KIND_ARGS_REJECTED = 3;
  OUTCOME_KIND_ABORTED = 4;
}

// One result stream is Start, one or more non-empty Chunk frames, then
// Complete. The host stages chunks directly into its CAS before accepting the
// completion; the worker never mints artifact identities.
message ToolResultStart {
  string call_id = 1;
  repeated omp.thread.v1.Part parts = 2;
  bool useless = 3;
  optional ArgIssue args_issue = 4;
  // Suppress the automatic model follow-up only when every result in the batch opts in.
  optional bool terminate = 5;
  omp.inference.v1.ValueMap props = 15;
  OutcomeKind kind = 16;
}

// data is bounded to RESULT_CHUNK_MAX_BYTES by the host preflight.
message ToolResultChunk {
  string call_id = 1;
  bytes data = 2;
  omp.inference.v1.ValueMap props = 15;
}
message ToolResultComplete {
  string call_id = 1;
  omp.inference.v1.ValueMap props = 15;
}
message ResultWorkerEnvelope {
  oneof body {
    ToolResultStart start = 1;
    ToolResultChunk chunk = 2;
    ToolResultComplete complete = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}
message ToolArgs {
  string call_id = 1;
  ArgIssue issue = 2;
  omp.inference.v1.ValueMap props = 15;
}
message ToolAborted {
  string call_id = 1;
  string reason = 2;
  bool effects_unknown = 3;
  omp.inference.v1.ValueMap props = 15;
}
message Ping {
  uint64 nonce = 1;
  omp.inference.v1.ValueMap props = 15;
}
message Pong {
  uint64 nonce = 1;
  omp.inference.v1.ValueMap props = 15;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_INVALID_ARGUMENT = 1;
  PROTOCOL_ERROR_CODE_NOT_FOUND = 2;
  PROTOCOL_ERROR_CODE_UNSUPPORTED = 3;
  PROTOCOL_ERROR_CODE_INTERNAL = 4;
  PROTOCOL_ERROR_CODE_BUSY = 5;
  PROTOCOL_ERROR_CODE_PERMISSION_DENIED = 6;
}
message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  omp.inference.v1.ValueMap props = 15;
}

// Extension lifecycle and activation traffic.
message AdmittedExtension {
  string extension_id = 1;
  string module = 2;
  string rev = 3;
}
message AdmitExtensions {
  repeated AdmittedExtension extensions = 1;
  uint64 generation = 2;
  omp.inference.v1.ValueMap props = 15;
}
message AvailabilityDelta {
  string name = 1;
  string rev = 2;
  bool available = 3;
  optional string reason = 4;
}
message SetAvailability {
  repeated AvailabilityDelta deltas = 1;
  omp.inference.v1.ValueMap props = 15;
}

// Sent after Core exact-validates the import-time RegisterTools declaration
// against the manifest. It seals the registry; there is no separate VERIFY
// callback.
message FreezeDeclarations {
  string extension_id = 1;
  uint64 generation = 2;
  omp.inference.v1.ValueMap props = 15;
}

enum ActivateReason {
  ACTIVATE_REASON_UNSPECIFIED = 0;
  ACTIVATE_REASON_FIRST_REACH = 1;
  ACTIVATE_REASON_RESTART = 2;
  ACTIVATE_REASON_HOT_RELOAD = 3;
}

// Fine-grained supervisor cause. ActivateReason remains the coarse class an
// extension branches on; a restarted child cannot derive this cause itself.
enum RestartReason {
  RESTART_REASON_UNSPECIFIED = 0;
  RESTART_REASON_CRASH = 1;
  RESTART_REASON_CANCEL_ESCALATION = 2;
  RESTART_REASON_PROTOCOL_ERROR = 3;
  RESTART_REASON_OOM = 4;
  RESTART_REASON_HEALTH_TIMEOUT = 5;
  RESTART_REASON_HOT_RELOAD = 6;
}

message PrincipalRef {
  string id = 1;
  string display = 2;
  omp.inference.v1.ValueMap props = 15;
}
message ActivationCliValue {
  string sink = 1;
  oneof value {
    bool boolean = 2;
    string string = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

message ActivateExtension {
  string extension_id = 1;
  ActivateReason reason = 2;
  uint64 session_started_at_ms = 3;
  uint64 generation = 4;
  PrincipalRef principal = 5;
  optional RestartReason restart_reason = 6;
  repeated ActivationCliValue cli_values = 7;
  omp.inference.v1.ValueMap props = 15;
}

message ExtensionActivated {
  string extension_id = 1;
  uint64 generation = 2;
  bool degraded = 3;
  optional string error = 4;
  omp.inference.v1.ValueMap props = 15;
}

// Each CONTROL hop uses the outer frame request_id. caller_request_id bridges
// the Core→provider hop back to the original caller hop; it never replaces
// outer correlation.
message ServiceCall {
  string extension_id = 1;
  string service = 2;
  uint32 rev = 3;
  string method = 4;
  bytes payload = 5;
  uint64 deadline_ms = 6;
  uint64 host_generation = 7;
  uint64 session_generation = 8;
  omp.inference.v1.ValueMap props = 15;
}

message ServiceReply {
  bytes payload = 1;
  optional ProtocolError error = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ServiceDispatch {
  string provider_extension_id = 1;
  string service = 2;
  uint32 rev = 3;
  string method = 4;
  bytes payload = 5;
  uint64 deadline_ms = 6;
  uint64 caller_request_id = 7;
  uint64 caller_host_generation = 8;
  uint64 session_generation = 9;
  uint64 provider_generation = 10;
  omp.inference.v1.ValueMap props = 15;
}

message ServiceResult {
  uint64 caller_request_id = 1;
  uint64 provider_generation = 2;
  bytes payload = 3;
  optional ProtocolError error = 4;
  omp.inference.v1.ValueMap props = 15;
}

message QuotaStatus {
  string name = 1;
  uint64 limit = 2;
  uint64 used = 3;
  optional uint64 window_ms = 4;
  omp.inference.v1.ValueMap props = 15;
}

message QuotaDrop {
  string name = 1;
  uint64 count = 2;
  omp.inference.v1.ValueMap props = 15;
}

message ResourceUpdate {
  string extension_id = 1;
  repeated QuotaStatus quotas = 2;
  repeated QuotaDrop dropped = 3;
  omp.inference.v1.ValueMap props = 15;
}

message ResourceQuery {
  string extension_id = 1;
  omp.inference.v1.ValueMap props = 15;
}
message LifecycleHostEnvelope {
  oneof body {
    AdmitExtensions admit_extensions = 1;
    FreezeDeclarations freeze_declarations = 2;
    ActivateExtension activate_extension = 3;
    ServiceReply service_reply = 4;
    ResourceUpdate resource_update = 5;
    ServiceDispatch service_dispatch = 6;
  }
  omp.inference.v1.ValueMap props = 15;
}
message LifecycleWorkerEnvelope {
  oneof body {
    SetAvailability set_availability = 1;
    ExtensionActivated extension_activated = 2;
    ServiceCall service_call = 3;
    ResourceQuery resource_query = 4;
    ServiceResult service_result = 5;
    DeclareSecretRules declare_secret_rules = 6;
  }
  omp.inference.v1.ValueMap props = 15;
}

// Bounded extension-owned secret declarations. Core validates lengths/counts and
// seals the set during activation. Environment names and values are deliberately
// absent: env secret discovery is a Core-only authority.
message SecretRuleDeclaration {
  string kind = 1;
  string mode = 2;
  string content = 3;
  optional string replacement = 4;
  optional string flags = 5;
  optional string friendly_name = 6;
  omp.inference.v1.ValueMap props = 15;
}

message DeclareSecretRules {
  string extension_id = 1;
  uint64 activation_generation = 2;
  repeated SecretRuleDeclaration rules = 3;
  omp.inference.v1.ValueMap props = 15;
}

// Streaming-argument forwarding and pull cursor.
message PullRequest {
  string call_id = 1;
  repeated string path = 2;
  optional string key = 3;
  repeated string aliases = 4;
  optional bytes expected = 5;
  uint32 chunk_bytes = 6;
  omp.inference.v1.ValueMap props = 15;
}
message PullReply {
  string call_id = 1;
  bytes chunk = 2;
  bool complete = 3;
  optional ArgIssue issue = 4;
  omp.inference.v1.ValueMap props = 15;
}
message ArgumentHostEnvelope {
  oneof body {
    omp.env.v1.ArgText arg_text = 1;
    omp.env.v1.ArgsCommitted args_committed = 2;
    omp.env.v1.Interrupt interrupt = 3;
    PullReply pull_reply = 4;
  }
  omp.inference.v1.ValueMap props = 15;
}
message ArgumentWorkerEnvelope {
  oneof body {
    PullRequest pull_request = 1;
    ToolArgs tool_args = 2;
  }
  omp.inference.v1.ValueMap props = 15;
}

// Hook catalog and dispatch.
enum HookPhase {
  HOOK_PHASE_UNSPECIFIED = 0;
  HOOK_PHASE_PRECHECK = 1;
  HOOK_PHASE_TRANSFORM = 2;
  HOOK_PHASE_REVIEW = 3;
  HOOK_PHASE_APPROVAL = 4;
  HOOK_PHASE_OBSERVE = 5;
}
enum Composition {
  COMPOSITION_UNSPECIFIED = 0;
  COMPOSITION_REPLACE = 1;
  COMPOSITION_APPEND = 2;
  COMPOSITION_INTERSECT = 3;
}
enum OnFailure {
  ON_FAILURE_UNSPECIFIED = 0;
  ON_FAILURE_DEFER = 1;
  ON_FAILURE_DENY = 2;
}
enum HookEventId {
  HOOK_EVENT_UNSPECIFIED = 0;
  HOOK_EVENT_SESSION_START = 1;
  HOOK_EVENT_SESSION_SHUTDOWN = 2;
  HOOK_EVENT_SESSION_SWITCH = 3;
  HOOK_EVENT_SESSION_SWITCHED = 4;
  HOOK_EVENT_SESSION_BRANCH = 5;
  HOOK_EVENT_SESSION_BRANCHED = 6;
  HOOK_EVENT_SESSION_REWIND = 7;
  HOOK_EVENT_SESSION_REWOUND = 8;
  HOOK_EVENT_SESSION_RESET = 9;
  HOOK_EVENT_BEFORE_AGENT_START = 10;
  HOOK_EVENT_AGENT_START = 11;
  HOOK_EVENT_TURN_START = 12;
  HOOK_EVENT_TURN_END = 13;
  HOOK_EVENT_AGENT_SETTLED = 14;
  HOOK_EVENT_AGENT_END = 15;
  HOOK_EVENT_INTERRUPT = 16;
  HOOK_EVENT_DEADLINE = 17;
  HOOK_EVENT_MESSAGE_START = 18;
  HOOK_EVENT_MESSAGE_UPDATE = 19;
  HOOK_EVENT_MESSAGE_END = 20;
  HOOK_EVENT_ITEM_COMMITTED = 21;
  HOOK_EVENT_CALL_OPEN = 22;
  HOOK_EVENT_TOOL_CALL = 23;
  HOOK_EVENT_TOOL_EXECUTION_START = 24;
  HOOK_EVENT_TOOL_UPDATE = 25;
  HOOK_EVENT_TOOL_EXECUTION_END = 26;
  HOOK_EVENT_TOOL_RESULT = 27;
  HOOK_EVENT_TOOL_APPROVAL_REQUESTED = 28;
  HOOK_EVENT_TOOL_APPROVAL_RESOLVED = 29;
  HOOK_EVENT_DEVICE_LIST = 30;
  HOOK_EVENT_USER_INPUT = 31;
  HOOK_EVENT_USER_BASH = 32;
  HOOK_EVENT_USER_EVAL = 33;
  HOOK_EVENT_COMMAND_INVOKE = 34;
  HOOK_EVENT_RESOURCES_DISCOVER = 35;
  HOOK_EVENT_RESOURCES_CHANGED = 36;
  HOOK_EVENT_PROVIDER_LOGIN = 37;
  HOOK_EVENT_PROVIDER_REFRESH = 38;
  HOOK_EVENT_PROVIDER_SIGN = 39;
  HOOK_EVENT_BEFORE_REQUEST = 40;
  HOOK_EVENT_MODELS_DISCOVER = 41;
  HOOK_EVENT_PROVIDER_ERROR = 42;
  HOOK_EVENT_PROVIDER_USAGE = 43;
  HOOK_EVENT_CAPABILITY_BUDGET = 44;
  HOOK_EVENT_MODEL_CHANGED = 45;
  HOOK_EVENT_CREDENTIAL_DISABLED = 46;
  HOOK_EVENT_COMPACTION = 47;
  HOOK_EVENT_COMPACTION_DONE = 48;
  HOOK_EVENT_THREAD_PROJECTION = 49;
  HOOK_EVENT_SUBAGENT_SPAWN = 50;
  HOOK_EVENT_WORKER_STATE = 51;
  HOOK_EVENT_JOB_REGISTERED = 52;
  HOOK_EVENT_JOB_SETTLED = 53;
  HOOK_EVENT_EXTENSION_ACTIVATE = 54;
  HOOK_EVENT_EXTENSION_LOAD = 55;
  HOOK_EVENT_EXTENSION_UNLOAD = 56;
  HOOK_EVENT_HOST_RECONNECT = 57;
  HOOK_EVENT_TTSR_TRIGGERED = 58;
  reserved 59; // Permanent tombstone: provisional todo_reminder was never public.
  HOOK_EVENT_RETRY_START = 60;
  HOOK_EVENT_RETRY_END = 61;
  HOOK_EVENT_FALLBACK_APPLIED = 62;
  HOOK_EVENT_FALLBACK_SUCCEEDED = 63;
  HOOK_EVENT_MCP_NOTIFICATION = 64;
  HOOK_EVENT_PROVIDER_RESPONSE = 65;
  HOOK_EVENT_SESSION_RENAMED = 66;
}

// Revision 1 payloads for authoritative observational lifecycle events.
// Producers truncate strings before dispatch: ids <= 128 bytes, rule/model/reason
// fields <= 512 bytes, and matched fields <= 4096 bytes.
message LifecycleEventContext {
  string session_id = 1;
  string turn_id = 2;
  uint64 sequence = 3;
}

message TtsrTriggeredEventV1 {
  LifecycleEventContext context = 1;
  string rule = 2;
  string matched = 3;
  bool interrupted = 4;
}

message RetryLifecycleEventV1 {
  LifecycleEventContext context = 1;
  uint32 attempt = 2;
  uint32 maximum = 3;
  uint64 delay_ms = 4;
  string reason = 5;
  optional string outcome = 6;
}

message FallbackLifecycleEventV1 {
  LifecycleEventContext context = 1;
  string source_model = 2;
  string target_model = 3;
  string reason = 4;
}
message McpNotificationEventV1 {
  string server = 1;
  string method = 2;
  bytes params_json = 3;
  uint64 sequence = 4;
}
message ProviderResponseEventV1 {
  string provider = 1;
  string model = 2;
  string api = 3;
  uint32 status = 4;
  map<string, string> headers = 5;
  optional string request_id = 6;
}
message SessionRenamedEventV1 {
  string session = 1;
  optional string name = 2;
}
message SessionOriginV1 {
  string session_id = 1;
  optional uint64 at_event = 2;
}
message SessionStartEventV1 {
  string session_id = 1;
  string root = 2;
  string cwd = 3;
  repeated string dirs = 4;
  bool resumed = 5;
  optional SessionOriginV1 forked_from = 6;
  optional string agent = 7;
  string trust = 8;
  uint64 head_event = 9;
  string prompt_rev = 10;
  optional string previous_session = 11;
}
message SessionShutdownEventV1 {
  string session_id = 1;
  string reason = 2;
  uint64 budget_ms = 3;
  optional string target_session = 4;
}
message HookModelRefV1 {
  string provider = 1;
  string api = 2;
  string model = 3;
}
message ModelChangedEventV1 {
  optional HookModelRefV1 from_model = 1;
  HookModelRefV1 to_model = 2;
  string role = 3;
  string reason = 4;
  optional string previous_thinking = 5;
  optional string thinking = 6;
}
message When {
  repeated string names = 1;
  repeated string providers = 2;
  repeated string targets = 3;
  repeated string roles = 4;
  repeated string servers = 5;
  repeated string method_globs = 6;
  omp.inference.v1.ValueMap props = 15;
}
message SubscriptionSpec {
  uint32 subscription_id = 1;
  HookEventId event_id = 2;
  HookPhase phase = 3;
  sint32 order = 4;
  optional When when = 5;
  uint64 timeout_ms = 6;
  OnFailure on_failure = 7;
  string name = 8;
  uint64 coalesce_ms = 9;
  omp.inference.v1.ValueMap props = 15;
}
message Subscribe {
  repeated uint64 mask = 1;
  repeated SubscriptionSpec specs = 2;
  omp.inference.v1.ValueMap props = 15;
}
message Dispatch {
  HookEventId event_id = 1;
  uint32 event_rev = 2;
  uint64 dispatch_id = 3;
  HookPhase phase = 4;
  bytes payload = 5;
  uint64 deadline_ms = 6;
  repeated uint32 subscription_ids = 7;
  omp.inference.v1.ValueMap props = 15;
}
message CancelDispatch {
  uint64 dispatch_id = 1;
  string reason = 2;
  omp.inference.v1.ValueMap props = 15;
}
message Reply {
  bytes payload = 1;
  optional ProtocolError error = 2;
  omp.inference.v1.ValueMap props = 15;
}
message Notify {
  HookEventId event_id = 1;
  bytes payload = 2;
  uint32 event_rev = 3;
  omp.inference.v1.ValueMap props = 15;
}
message HookDecision {
  uint64 dispatch_id = 1;
  string decision = 2;
  optional bytes patch = 3;
  optional bytes domain = 4;
  optional string reason = 5;
  omp.inference.v1.ValueMap props = 15;
}
message HookFailed {
  uint64 dispatch_id = 1;
  string error = 2;
  OnFailure applied = 3;
  omp.inference.v1.ValueMap props = 15;
}
message WorkerRequest {
  string op = 1;
  bytes payload = 2;
  omp.inference.v1.ValueMap props = 15;
}
message BudgetPause {
  uint64 dispatch_id = 1;
  uint64 requested_ms = 2;
  omp.inference.v1.ValueMap props = 15;
}
message EffectFrame {
  uint32 kind = 1;
  bytes payload = 2;
  omp.inference.v1.ValueMap props = 15;
}
message HookHostEnvelope {
  oneof body {
    Dispatch dispatch = 1;
    CancelDispatch cancel_dispatch = 2;
    Reply reply = 3;
    Notify notify = 4;
  }
  omp.inference.v1.ValueMap props = 15;
}
message HookWorkerEnvelope {
  oneof body {
    Subscribe subscribe = 1;
    HookDecision decision = 2;
    HookFailed failed = 3;
    WorkerRequest request = 4;
    BudgetPause budget_pause = 5;
    EffectFrame effect = 6;
  }
  omp.inference.v1.ValueMap props = 15;
}

// Regime declaration, lifecycle, and middleware draft traffic. Point numbers
// preserve the fixed event placement table; all enum tables are append-only.
enum RegimePoint {
  REGIME_POINT_UNSPECIFIED = 0;
  REGIME_POINT_CONTEXT = 1;
  REGIME_POINT_TOOL_CHOICE = 2;
  REGIME_POINT_PRE_MODEL = 3;
  REGIME_POINT_STREAM = 4;
  REGIME_POINT_ADMISSION = 5;
  REGIME_POINT_BATCH = 6;
  REGIME_POINT_TURN_END = 7;
  REGIME_POINT_SETTLE = 8;
  REGIME_POINT_IDLE = 9;
}

// The one control selected by a consuming Next value.
enum RegimeControlKind {
  REGIME_CONTROL_KIND_UNSPECIFIED = 0;
  REGIME_CONTROL_KIND_RETRY = 1;
  REGIME_CONTROL_KIND_WAIT = 2;
  REGIME_CONTROL_KIND_REJECT = 3;
  REGIME_CONTROL_KIND_CANCEL = 4;
  REGIME_CONTROL_KIND_COMPLETE = 5;
  REGIME_CONTROL_KIND_FAIL = 6;
}

// An effect staged through a RegimeContext writer.
enum RegimeEffectKind {
  REGIME_EFFECT_KIND_UNSPECIFIED = 0;
  REGIME_EFFECT_KIND_APPEND_CONTEXT = 1;
  REGIME_EFFECT_KIND_REWRITE_CONTEXT = 2;
  REGIME_EFFECT_KIND_REQUIRE_TOOL = 3;
  REGIME_EFFECT_KIND_SET_SCOPED = 4;
  REGIME_EFFECT_KIND_REPLACE_STATE = 5;
}

// How long an activation may survive after it starts.
enum RegimeLifetime {
  REGIME_LIFETIME_UNSPECIFIED = 0;
  REGIME_LIFETIME_TURN = 1;
  REGIME_LIFETIME_RUN = 2;
  REGIME_LIFETIME_SESSION = 3;
}

// One sealed regime declaration. Structured declaration values in when and
// sets use the canonical JSON encoding negotiated by the extension API level.
message RegimeManifest {
  string id = 1;
  uint32 revision = 2;
  repeated RegimePoint points = 3;
  int32 precedence = 4;
  RegimeLifetime lifetime = 5;
  optional uint32 max_steps = 6;
  bool has_on_limit = 7;
  optional string state_family = 8;
  optional uint32 state_revision = 9;
  bytes when = 10;
  repeated string owns = 11;
  bytes sets = 12;
  omp.inference.v1.ValueMap props = 15;
  optional uint64 minimum_duration_ms = 16;
  OnFailure on_failure = 17;
  optional uint64 committed_step_interval_ms = 18;
}

// Worker import-time declaration table. Core exact-validates every enum table
// and manifest at FREEZE before admitting the extension domain.
message RegimeDeclare {
  string extension_id = 1;
  uint64 generation = 2;
  uint32 api_level = 3;
  uint32 table_revision = 4;
  repeated RegimeManifest manifests = 5;
  repeated RegimePoint point_table = 6;
  repeated RegimeControlKind control_table = 7;
  repeated RegimeEffectKind effect_table = 8;
  omp.inference.v1.ValueMap props = 15;
}

// Starts or restores an activation after Core has resolved resource ownership.
message RegimeStart {
  string regime_id = 1;
  string activation_id = 2;
  uint32 regime_revision = 3;
  bytes state = 4;
  optional uint32 state_revision = 5;
  uint64 deadline_ms = 6;
  omp.inference.v1.ValueMap props = 15;
}

// Evaluates one fixed event against an isolated activation draft.
message RegimeApply {
  string regime_id = 1;
  string activation_id = 2;
  uint32 regime_revision = 3;
  RegimePoint point = 4;
  uint32 event_revision = 5;
  bytes event_payload = 6;
  bytes state = 7;
  optional uint32 state_revision = 8;
  uint64 committed_steps = 9;
  uint64 deadline_ms = 10;
  bool limit_handler = 11;
  omp.inference.v1.ValueMap props = 15;
}

// At most one control selected through Next. Only fields meaningful to kind may
// be populated; FREEZE and the event resolver enforce that closed shape.
message RegimeControl {
  RegimeControlKind kind = 1;
  optional string reason = 2;
  optional string wait_ticket = 3;
  optional uint64 wait_deadline_ms = 4;
  bytes error = 5;
  omp.inference.v1.ValueMap props = 15;
}

// One ordered effect staged through RegimeContext. payload carries canonical
// bytes for the selected kind; name identifies a tool or scoped setting.
message RegimeEffect {
  RegimeEffectKind kind = 1;
  bytes payload = 2;
  optional string name = 3;
  optional uint32 state_revision = 4;
  omp.inference.v1.ValueMap props = 15;
}

// A successful callback contributes one optional control and its effects in
// insertion order. Callback failure discards this message's entire draft.
message RegimeDraft {
  string activation_id = 1;
  uint32 regime_revision = 2;
  uint32 event_revision = 3;
  optional RegimeControl control = 4;
  repeated RegimeEffect effects = 5;
  omp.inference.v1.ValueMap props = 15;
}

// Stops one activation after Core atomically handles owned resources, scoped
// settings.
message RegimeStop {
  string regime_id = 1;
  string activation_id = 2;
  uint32 regime_revision = 3;
  optional string reason = 4;
  uint64 deadline_ms = 5;
  omp.inference.v1.ValueMap props = 15;
}

// Core-to-worker regime lifecycle and event traffic.
message RegimeHostEnvelope {
  oneof body {
    RegimeStart start = 1;
    RegimeApply apply = 2;
    RegimeStop stop = 3;
  }
  omp.inference.v1.ValueMap props = 15;
}

// Worker-to-Core declarations and isolated callback drafts.
message RegimeWorkerEnvelope {
  oneof body {
    RegimeDeclare declare = 1;
    RegimeDraft draft = 2;
  }
  omp.inference.v1.ValueMap props = 15;
}

// Projection, lift, render, and availability operations.
message ProjectionKey {
  string name = 1;
  string rev = 2;
  bytes caps_hash = 3;
  bytes projection_hash = 4;
}
message ProjectionRequest {
