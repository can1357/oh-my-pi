  uint64 epoch = 4;
  uint64 tokens_before = 5;
  uint64 target_tokens = 6;
  string suggested_first_kept = 7;
  repeated MessageRef to_summarize = 8;
  repeated MessageRef to_retain = 9;
  bool split_turn = 10;
  optional string previous_summary = 11;
  optional bytes previous_preserve_json = 12;
  optional string custom_instructions = 13;
  uint64 deadline_ms = 14;
  omp.inference.v1.ValueMap props = 15;
}
message CompactionVerdict {
