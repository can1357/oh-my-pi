syntax = "proto3";

package omp.inference.v1;

import "omp/inference/v1/common.proto";

// Web search facet. One shape covers all three engine paradigms:
// raw-results (brave/kagi/searxng/scrapers), LLM-synthesized
// (perplexity/gemini/anthropic/codex/xai), and hybrid (exa/tavily) —
// `answer` is optional, `sources` always carries retrieved hits.
//
// Engine selection and the credentialed fallback chain (walk candidates on
// auth/rate-limit/5xx failures; never on cancellation) are registry policy
// server-side; `engine` pins one explicitly.

message SearchRequest {
  string query = 1;
  // Max results returned to the caller; 0 = engine default.
  uint32 limit = 2;
  Recency recency = 3;
  // ISO dates "YYYY-MM-DD"; empty = unbounded.
  string after = 4;
  string before = 5;
  repeated string allowed_domains = 6;
  repeated string excluded_domains = 7;
  // ISO 3166-1 alpha-2.
  string country = 8;
  // ISO-639-1.
  string language = 9;
  // Geo bias for engines that take it (native openai/xai/anthropic search).
  Location location = 10;
  SafeSearch safesearch = 11;
  // Pin one engine; empty = registry fallback chain.
  string engine = 12;
  // 0 = server default.
  uint32 timeout_ms = 13;

  enum Recency {
    RECENCY_UNSPECIFIED = 0;
    RECENCY_DAY = 1;
    RECENCY_WEEK = 2;
    RECENCY_MONTH = 3;
    RECENCY_YEAR = 4;
  }
  enum SafeSearch {
    SAFE_SEARCH_UNSPECIFIED = 0;
    SAFE_SEARCH_OFF = 1;
    SAFE_SEARCH_MODERATE = 2;
    SAFE_SEARCH_STRICT = 3;
  }
  message Location {
    string city = 1;
    string region = 2;
    string country = 3;
    string timezone = 4;
  }

  // Engine-specific knobs under namespaced keys ("exa/type",
  // "perplexity/search_context_size", "parallel/mode"). Integers remain exact
  // for budgets and vendor ids.
  ValueMap props = 15;
  // Maximum synthesis output tokens; 0 = provider default.
  uint32 max_tokens = 16;
  // Synthesis sampling temperature; absent = provider default.
  optional double temperature = 17;
  // Provider retrieval count when distinct from returned `limit`; 0 = provider default.
  uint32 num_search_results = 18;
}

message SearchResponse {
  // Engine that actually served the query (after fallback).
  string engine = 1;
  // Synthesized narrative; empty for raw-results engines.
  string answer = 2;
  repeated Source sources = 3;
  // Inline citations anchoring `answer` spans to sources.
  repeated Citation citations = 4;
  // Sub-queries the engine generated, when reported.
  repeated string search_queries = 5;
  repeated string related = 6;
  // Diagnostics, e.g. a query directive relaxed to avoid zero results.
  repeated string warnings = 7;
  Usage usage = 8;
  Cost cost = 9;
  repeated Unsupported unsupported = 10;
  // Opaque account identity used by the serving attempt.
  string account = 11;
  // UI-safe credential mode label; never credential material.
  string auth_mode = 12;
  // Failed attempts preceding success, or every attempt in an aggregate failure.
  repeated Failure failures = 13;

  message Source {
    string url = 1;
    string title = 2;
    string snippet = 3;
    // ISO date or datetime when known.
    string published_at = 4;
    string author = 5;
    // Engine-relative relevance, 0..1 where reported.
    optional double score = 6;
    // Whole seconds since publication at projection time, when known.
    uint64 age_seconds = 7;
  }
  message Citation {
    string url = 1;
    string title = 2;
    string cited_text = 3;
    // Byte offsets into `answer`, when the engine anchors citations.
    optional uint32 start = 4;
    optional uint32 end = 5;
  }

  message Failure {
    string provider = 1;
    Kind kind = 2;
    optional uint32 status = 3;
    string code = 4;

    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_AUTHENTICATION = 1;
      KIND_QUOTA = 2;
      KIND_MODEL_NOT_FOUND = 3;
      KIND_TRANSPORT = 4;
      KIND_TIMEOUT = 5;
      KIND_PROVIDER = 6;
    }
  }

  ValueMap props = 15;
}
