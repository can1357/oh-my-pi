# Shell builtins for the embedded brush shell.
#
# Two layers live here:
#  * the POSIX/bash builtins (`cd`, `echo`, `test`, `printf`, `read`, …), a
#    locally-patched fork of the upstream `brush-builtins` crate, and
#  * the in-process command-line utilities the shell ships (`cat`, `grep`,
#    `sed`, `ls`, `jq`, `ps`, `top`, `kill`, …), one module per command.
#
# The utilities used to be ~50 separate vendored crates driven through a
# thread-local I/O shim; they now run as ordinary builtins against the explicit
# `host::Host` view of the shell (see `src/host.rs`). See LICENSE for the
# third-party notices that come with the ported code.
[package]
name = "pi-builtins"
version.workspace = true
edition.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
rust-version = "1.88.0"
description = "Builtins and in-process command-line utilities for the embedded brush shell"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "pi_builtins"
path = "src/lib.rs"
bench = false

[dependencies]
brush-core = "^0.5.0"
brush-parser = "^0.4.0"
cfg-if = "1.0.4"
