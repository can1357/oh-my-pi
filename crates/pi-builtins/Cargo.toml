# Deliberately NOT `lints.workspace = true`: most of this crate is ported
# third-party code (uutils, jaq), and holding 70k lines of
# it to the workspace's pedantic/nursery bar would bury real warnings. rustc
# warnings still apply and are kept at zero.
[lints.clippy]
all = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }

[lints.rust]
unfulfilled_lint_expectations = { level = "allow", priority = -1 }
