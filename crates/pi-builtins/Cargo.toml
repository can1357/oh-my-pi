# pi's in-process extras for the embedded shell: the command-line utilities
# (`cat`, `grep`, `sed`, `ls`, `jq`, …) and the process builtins (`ps`, `top`,
# `sleep`, `pgrep`, `pkill`, `pidwait`, `lsof`), one module per command. The shell's
# bash builtins live in its engine; hosts run these through `extras::run`.
#
# The utilities used to be ~50 separate vendored crates driven through a
# thread-local I/O shim; they now run against the explicit `host::Host` view of
# the shell (see `src/host.rs`). See LICENSE for the third-party notices that
# come with the ported code.
[package]
name = "pi-builtins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version = "1.99.0"
description = "In-process command-line utilities and process builtins for the embedded shell"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "pi_builtins"
path = "src/lib.rs"
bench = false

[dependencies]
async-trait.workspace = true
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["cargo", "color", "derive", "env", "wrap_help"] }
fancy-regex.workspace = true
futures = "0.3.32"
itertools = "0.14.0"
parking_lot = "0.12.5"
thiserror = "2.0.18"

# ── Utility builtin dependencies ──────────────────────────────────────────────
# 0.1.1 moved to unicode-width 0.2, the version the rest of the graph uses.
ansi-width = "0.1.1"
argmax = "0.4.0"
bigdecimal = "0.4"
bstr = "1.12.0"
flume = "0.12"
foldhash = "0.2.0"
glob = "0.3.1"
globset = "0.4"
grep-cli = "0.1"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-printer = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
hex = "0.4.3"
# `sort` collates and reads numbers per call from the shell's locale; uucore's
# i18n helpers cache one process-wide locale.
icu_collator = { version = "2.0", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.0", default-features = false, features = ["alloc"] }
icu_provider = { version = "2.0", default-features = false }
ignore = "0.4"
indicatif = "0.18.0"
jaq-core = "3.1.1"
jaq-json = "2.0.3"
jaq-std = "3.0.3"
jiff = { version = "0.2.18", features = ["tzdb-bundle-platform"] }
lscolors = { version = "0.21.0", default-features = false, features = ["gnu_legacy"] }
memchr = "2.7.4"
nom = "8.0.0"
num-bigint = "0.4"
num-traits = "0.2"
onig = { version = "6.4", default-features = false }
os_display = "0.1.4"
parse_datetime = "0.16"
pi-ast = { workspace = true, optional = true }
pi-diff.workspace = true
pi-walker.workspace = true
pi-vfs.workspace = true
rand = { version = "0.10.0", features = ["std_rng"] }
rayon = "1.10"
regex = "1.11"
# `awk`: POSIX leftmost-longest matching (hybrid DFA, `MatchKind::All`).
regex-automata = "0.4"
rustc-hash = "2.1.1"
self_cell = "1.0.4"
serde_json = "1"
smallvec.workspace = true
# `jq` evaluates on a grown stack and bounds its recursion by the stack left.
stacker = "0.1.25"
tempfile = "3.15.0"
tokio-util = "0.7"
xutf.workspace = true
libc = "0.2.172"
uutils_term_grid = "0.8"

[dependencies.uucore]
version = "0.8.0"
default-features = false
features = [
  "backup-control",
  "checksum",
  "colors",
  "encoding",
  "entries",
  "extendedbigdecimal",
  "fast-inc",
  "format",
  "fs",
  "fsext",
  "hardware",
  "i18n-charmap",
  "i18n-collator",
  "i18n-datetime",
  "i18n-decimal",
  "libc",
  "lines",
  "mode",
  "parser",
  "pipes",
  "process",
  "quoting-style",
  "ranges",
  "ringbuffer",
  "signals",
  "sum",
  "time",
  "version-cmp",
  "wide",
  "update-control",
]

[target."cfg(any(unix, windows))".dependencies]
# `cp`'s copy-on-write clones (`pi_iso::cow`).
pi-iso.workspace = true
# `rsync`: strong checksums, daemon auth digests, token compression.
base64.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lz4_flex = "0.14"
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
xxhash-rust = { workspace = true, features = ["xxh3", "xxh64"] }
zstd.workspace = true
# `tar`: the archive format and its bzip2/xz codecs (pure Rust).
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz"] }
tar = { version = "0.4.46", default-features = false }

[target."cfg(any(unix, windows))".dependencies.tokio]
version = "1.50.0"
features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync"]

[target.'cfg(target_family = "wasm")'.dependencies.tokio]
version = "1.52.1"
features = ["io-util", "macros", "rt"]

[target."cfg(any(target_os = \"freebsd\", target_os = \"openbsd\"))".dependencies]
dns-lookup = "3.0.1"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["fs", "poll", "process", "resource", "signal", "term", "user"] }
notify = { version = "=8.2.0", features = ["macos_kqueue"] }
rustix = { version = "1.1.4", features = ["fs", "process", "system", "time"] }
uucore = { version = "0.8.0", features = ["fsxattr", "safe-traversal"] }

[target."cfg(windows)".dependencies]
notify = "=8.2.0"
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
anyhow = "1.0.102"
tempfile = "3"

[features]
default = ["utils"]

# ── Utility builtins ──────────────────────────────────────────────────────────
# One feature per ported utility so a single utility can be built (and checked)
# in isolation. `utils` turns on the whole set and is part of `default`.
"util.ast-grep" = ["dep:pi-ast"]
"util.awk" = []
"util.b2sum" = ["util.cksum"]
"util.base32" = []
"util.base64" = ["util.base32"]
"util.basename" = []
# Shared POSIX BRE translation behind grep/sed/nl.
"util.bre" = []
"util.cat" = []
"util.chmod" = []
"util.cksum" = []
"util.cmp" = []
"util.comm" = []
"util.cp" = []
"util.cut" = []
"util.date" = []
"util.dd" = []
"util.df" = []
"util.diff" = []
"util.dirname" = []
"util.du" = []
"util.env" = []
"util.fd" = []
"util.find" = []
"util.fold" = []
"util.grep" = ["util.bre"]
"util.head" = []
"util.hostname" = []
"util.id" = []
"util.jq" = []
"util.ln" = []
"util.ls" = []
# Lists open files and sockets per process: linux, macos and windows targets.
"util.lsof" = ["util.procs"]
"util.md5" = ["util.cksum"]
"util.md5sum" = ["util.cksum"]
"util.mkdir" = []
"util.mktemp" = []
"util.combine" = []
"util.errno" = []
"util.ifne" = []
"util.isutf8" = []
"util.sponge" = []
"util.ts" = []
"util.mv" = []
"util.nl" = ["util.bre"]
"util.nproc" = []
"util.od" = []
"util.paste" = []
"util.pgrep" = ["util.proc-match"]
"util.pidwait" = ["util.proc-match"]
"util.pkill" = ["util.proc-match"]
# Shared process-matching engine behind pgrep/pkill/pidwait.
"util.proc-match" = ["util.procs"]
# Shared process-table snapshot behind ps/top/pgrep/pkill/pidwait.
"util.procs" = []
"util.ps" = ["util.procs"]
"util.sleep" = []
"util.top" = ["util.procs"]
"util.printenv" = []
"util.readlink" = []
"util.realpath" = []
# Shares the record layout and line-length bound with `grep`.
"util.rg" = ["util.grep"]
"util.rm" = []
"util.rmdir" = []
# Needs processes and sockets: unix and windows targets.
"util.rsync" = []
"util.sd" = []
"util.sed" = ["util.bre"]
"util.seq" = []
"util.sha1sum" = ["util.cksum"]
"util.sha224sum" = ["util.cksum"]
"util.sha256sum" = ["util.cksum"]
"util.sha384sum" = ["util.cksum"]
"util.sha512sum" = ["util.cksum"]
"util.shasum" = ["util.cksum"]
"util.sort" = []
"util.stat" = []
"util.strings" = []
"util.tac" = []
"util.tail" = ["util.tac"]
# Needs the gzip/zstd codecs: unix and windows targets.
"util.tar" = []
"util.tee" = []
"util.touch" = []
"util.tr" = []
"util.truncate" = []
"util.uname" = []
"util.uniq" = []
"util.uptime" = []
"util.wc" = []
"util.which" = []
"util.whoami" = []
"util.xargs" = []
"util.yes" = []

utils = [
