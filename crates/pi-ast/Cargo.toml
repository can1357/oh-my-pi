[package]
name = "pi-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
ast-grep-core.workspace = true
globset.workspace = true
ignore.workspace = true
phf.workspace = true
serde.workspace = true
# `wasm`: grammars outside the linked set load as WebAssembly (src/language/grammar.rs).
tree-sitter = { workspace = true, features = ["wasm"] }
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-diff.workspace = true
tree-sitter-go.workspace = true
tree-sitter-html.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-regex.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-yaml.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# Natively compiled stand-ins for wasm grammars the tests parse (see
# `language::grammar::WasmGrammar::register`).
tree-sitter-elisp.workspace = true
tree-sitter-fortran.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-swift.workspace = true
