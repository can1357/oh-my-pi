[package]
name = "omp-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Typed, capability-complete inference request and response contracts for OMP"
readme = "README.md"

[[example]]
name = "applefm_smoke"
required-features = ["local-applefm"]

[features]
default = []
local = []
test-support = []
local-applefm = ["local"]
local-embedding = ["local", "dep:fastembed"]
local-stt = [
	"local",
	"dep:candle-core",
	"dep:candle-nn",
	"dep:candle-transformers",
	"dep:tokenizers",
]
local-tts = [
	"local",
	"dep:candle-core",
	"dep:candle-nn",
	"dep:voice-g2p",
]
device-attestation = ["dep:block2", "dep:objc2", "dep:objc2-foundation"]
realtime = [
	"dep:audiopus_sys",
	"dep:opus",
	"dep:webrtc",
	"device-attestation",
]

[dependencies]
omp-audio.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
async-stream.workspace = true
brotli.workspace = true
bytes.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
crc32fast.workspace = true
fastembed = { workspace = true, optional = true }
flate2.workspace = true
flume.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
im.workspace = true
libc.workspace = true
omp-core.workspace = true
omp-catalog.workspace = true
omp-con.workspace = true
omp-oauth.workspace = true
omp-proto.workspace = true
omp-secrets.workspace = true
parking_lot.workspace = true
pin-project-lite.workspace = true
postcard.workspace = true
prost.workspace = true
prost-types.workspace = true
regex.workspace = true
ring.workspace = true
sha2.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, optional = true }
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
voice-g2p = { workspace = true, optional = true }
xutf.workspace = true
zeroize.workspace = true
zstd.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
audiopus_sys = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
security-framework.workspace = true
[dev-dependencies]
protox.workspace = true
tokio.workspace = true

[build-dependencies]
prost.workspace = true
prost-build.workspace = true
protox.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
