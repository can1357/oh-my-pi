[package]
name = "omp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production command-line application and daemon for OMP inference"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "omp"
path = "src/main.rs"

[[bin]]
name = "claude-trace"
path = "src/claude_trace.rs"
required-features = ["claude-trace"]

[features]
default = ["desktop"]
desktop = [
	"gui",
	"local-applefm",
	"local-embedding",
	"local-text",
	"local-stt",
	"local-tts",
	"native-audio",
	"realtime-transport",
]
android = []
claude-trace = []
gui = ["dep:omp-gui"]
native-audio = ["omp-voice/native-audio"]
realtime-transport = ["omp-voice/realtime-transport"]
local = ["omp-driver/local", "omp-inference/local"]
local-all = [
	"local-applefm",
	"local-embedding",
	"local-text",
	"local-stt",
	"local-tts",
]
local-applefm = ["local", "omp-driver/local-applefm", "omp-inference/local-applefm"]
local-embedding = [
	"local",
	"omp-driver/local-embedding",
	"omp-inference/local-embedding",
	"omp-memory/local-embedding",
]
local-text = ["local", "omp-driver/local-text", "omp-inference/local-text"]
local-stt = ["local", "omp-driver/local-stt", "omp-inference/local-stt"]
local-tts = ["local", "omp-driver/local-tts", "omp-inference/local-tts"]

[dependencies]
arc-swap = { workspace = true }
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
ring = { workspace = true }
flume.workspace = true
futures.workspace = true
smallvec.workspace = true
flate2.workspace = true
libc.workspace = true
image.workspace = true
md-5.workspace = true
indicatif.workspace = true
inventory.workspace = true
miette = { workspace = true }
omp-agent.workspace = true
omp-ar = { workspace = true }
omp-chat-ui.workspace = true
omp-collab.workspace = true
omp-core.workspace = true
omp-driver = { workspace = true, default-features = false }
omp-env = { workspace = true }
omp-envd = { workspace = true }
omp-ext.workspace = true
omp-gui = { workspace = true, optional = true }
omp-grep.workspace = true
omp-hashline.workspace = true
omp-http.workspace = true
omp-catalog.workspace = true
omp-inference.workspace = true
omp-memory.workspace = true
omp-serve.workspace = true
omp-proto = { workspace = true, features = ["tonic"] }
omp-py.workspace = true
omp-rpc.workspace = true
omp-sandbox.workspace = true
omp-sdk.workspace = true
omp-scribe.workspace = true
omp-settings.workspace = true
omp-storage.workspace = true
omp-observability.workspace = true
omp-tool.workspace = true
omp-tui.workspace = true
omp-vcs.workspace = true
omp-voice = { workspace = true }
omp-slopjson.workspace = true
omp-shell.workspace = true
omp-tools.workspace = true
omp-walker.workspace = true
jiff.workspace = true
nix.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
regex.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
rand.workspace = true
tracing.workspace = true
url.workspace = true
xutf.workspace = true
zeroize.workspace = true
strum = { workspace = true }
toml = { workspace = true }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
async-stream.workspace = true
ctor.workspace = true
flume = { workspace = true }
insta = { workspace = true }
omp-docserver.workspace = true
omp-inference = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tonic-health.workspace = true
tower.workspace = true
