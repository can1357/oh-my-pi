[package]
name = "omp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production command-line application and daemon for OMP inference"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "omp"
path = "src/main.rs"

[[bin]]
name = "claude-trace"
path = "src/claude_trace.rs"
required-features = ["claude-trace"]

[features]
default = ["local"]
claude-trace = []
local = ["omp-driver/local", "omp-ai/local"]
gui = ["dep:omp-gui"]
local-all = [
	"local-applefm",
	"local-embedding",
	"local-stt",
	"local-tts",
]
local-applefm = ["local", "omp-driver/local-applefm", "omp-ai/local-applefm"]
local-embedding = [
	"local",
	"omp-driver/local-embedding",
	"omp-ai/local-embedding",
	"omp-memory/local-embedding",
]
local-stt = ["local", "omp-driver/local-stt", "omp-ai/local-stt"]
local-tts = ["local", "omp-driver/local-tts", "omp-ai/local-tts"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
ring.workspace = true
flume.workspace = true
futures.workspace = true
smallvec.workspace = true
flate2.workspace = true
libc.workspace = true
md-5.workspace = true
indicatif.workspace = true
miette.workspace = true
omp-agent.workspace = true
omp-ar.workspace = true
omp-chat.workspace = true
omp-collab.workspace = true
omp-con.workspace = true
omp-core.workspace = true
omp-driver.workspace = true
omp-env.workspace = true
omp-envd.workspace = true
omp-ext.workspace = true
omp-gui = { workspace = true, optional = true }
omp-edit.workspace = true
omp-http.workspace = true
omp-catalog.workspace = true
omp-audio.workspace = true
omp-ai = { workspace = true, features = ["realtime"] }
omp-journal.workspace = true
omp-memory.workspace = true
omp-session.workspace = true
omp-dom.workspace = true
omp-serve.workspace = true
omp-proto.workspace = true
omp-py.workspace = true
omp-rpc.workspace = true
omp-sandbox.workspace = true
omp-sdk.workspace = true
omp-scribe.workspace = true
omp-cache.workspace = true
omp-observability.workspace = true
omp-tool.workspace = true
omp-tui.workspace = true
omp-vcs.workspace = true
omp-shell-builtins.workspace = true
omp-shell.workspace = true
omp-tools.workspace = true
omp-walker.workspace = true
jiff.workspace = true
nix.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
regex.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
rand.workspace = true
tracing.workspace = true
url.workspace = true
xutf.workspace = true
zeroize.workspace = true
strum.workspace = true
toml.workspace = true
serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
