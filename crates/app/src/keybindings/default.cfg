// OMP default keybindings.
// ADR 0014: every customizable key is a bind command. When one chord serves
// contextual actions, the script offers modal panels first, then
// custom-editor app actions, then base-editor fallbacks; the host stops at
// the first action that consumes the edge.

// tui.editor.*
bind up                       ed_up
bind down                     ed_down
bind left                     ed_left
bind ctrl+b                   ed_left
bind right                    ed_right
bind ctrl+f                   ed_right
bind alt+left                 "panel_fold_up; ed_word_left"
bind ctrl+left                "panel_fold_up; ed_word_left"
bind alt+b                    ed_word_left
bind alt+right                "panel_unfold_down; ed_word_right"
bind ctrl+right               "panel_unfold_down; ed_word_right"
bind alt+f                    ed_word_right
bind home                     ed_home
bind ctrl+a                   ed_home
bind end                      ed_end
bind ctrl+e                   ed_end
bind "ctrl+]"                 ed_jump_forward
bind "ctrl+alt+]"             ed_jump_backward
bind pageup                   ed_page_up
bind pagedown                 ed_page_down
bind backspace                ed_backspace
bind delete                   ed_delete
bind ctrl+d                   "panel_delete; cl_exit; ed_delete"
bind ctrl+w                   ed_delete_word_backward
bind alt+backspace            ed_delete_word_backward
bind ctrl+backspace           "panel_delete_fast; ed_delete_word_backward"
bind super+alt+backspace      ed_delete_word_backward
bind alt+delete               ed_delete_word_forward
bind alt+d                    ed_delete_word_forward
bind super+alt+delete         ed_delete_word_forward
bind super+alt+d              ed_delete_word_forward
bind ctrl+u                   ed_delete_to_start
bind ctrl+k                   ed_delete_to_end
bind ctrl+y                   ed_yank
bind alt+y                    ed_yank_pop
bind ctrl+-                   ed_undo
bind ctrl+_                   ed_undo
bind ctrl+.                   ed_spelling

// tui.input.* and tui.select.*
bind shift+enter              ed_newline
bind ctrl+j                   ed_newline
bind enter                    ed_enter
bind tab                      ed_tab
bind ctrl+c                   "cl_clear; cl_interrupt; ed_copy"

// app.interrupt / app.clear / app.suspend / app.display.reset
bind escape                   cl_interrupt
bind ctrl+z                   cl_suspend
bind alt+l                    cl_display_reset

// app.thinking.*
bind shift+tab                cl_thinking_cycle
bind ctrl+t                   "toggle cl_showthinking"

// app.model.* plus session-picker contextual keys
bind ctrl+p                   "panel_toggle_path; cl_model_cycle"
bind ctrl+shift+p             "cl_model_cycle back"
bind alt+m                    cl_model_select
bind alt+p                    "cl_model_select session"
bind ctrl+s                   "panel_toggle_sort; hub"
bind ctrl+r                   "panel_rename; cl_history_search"

// app.tools.*
bind ctrl+o                   "panel_expand; cl_tools_expand"
bind ctrl+shift+o             "toggle cl_showtools"

// Global debug surface.
bind ctrl+shift+d             debug

// app.editor.external
bind ctrl+g                   cl_editor_external

// app.message.followUp — Ctrl+Q is the Windows fallback; Ctrl+Enter remains
// the built-in enhanced-terminal shortcut. Alt+Enter is not a default binding.
bind ctrl+q                   cl_followup
bind ctrl+enter               cl_followup

// app.retry
bind f5                       cl_retry
bind alt+r                    cl_retry

// app.message.dequeue
bind alt+up                   cl_dequeue
bind shift+up                 cl_dequeue

// app.clipboard.* (platform-specific image chords append from default-*.cfg)
bind ctrl+v                   cl_paste_image
bind ctrl+shift+v             cl_paste_raw
bind alt+shift+v              cl_paste_raw
bind alt+shift+l              cl_copy_line
bind alt+shift+c              cl_copy_prompt

// app.agents.hub / app.session.observe
bind alt+a                    agents

// app.plan.toggle
bind alt+shift+p              cl_plan_toggle

// app.live.toggle (app.stt.toggle has no default chord)
bind ctrl+l                   live
