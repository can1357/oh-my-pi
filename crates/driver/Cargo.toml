[package]
name = "omp-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Headless coding-agent harness: session composition, execution modes, orchestration, discovery, and settings for OMP"
readme = "README.md"

[features]
default = []
# Forwards the environment host's browser capability. Off, inference has no
# `BrowserFetchAdapter` and envd does not link `omp-webview`.
cap-browser = ["omp-envd/cap-browser"]
local = ["omp-ai/local"]
local-all = [
	"local-applefm",
	"local-embedding",
	"local-stt",
	"local-tts",
]
local-applefm = ["local", "omp-ai/local-applefm"]
local-embedding = ["local", "omp-ai/local-embedding", "omp-memory/local-embedding"]
local-stt = ["local", "omp-ai/local-stt"]
local-tts = ["local", "omp-envd/local-tts", "omp-ai/local-tts"]

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
bytes.workspace = true
flate2.workspace = true
flume.workspace = true
futures.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
im.workspace = true
jiff.workspace = true
memchr.workspace = true
omp-adw.workspace = true
omp-agent.workspace = true
omp-contract.workspace = true
omp-ar.workspace = true
omp-collab.workspace = true
omp-core = { workspace = true, features = ["schemars"] }
omp-scribe.workspace = true
omp-env.workspace = true
omp-envd.workspace = true
omp-exec.workspace = true
omp-exec-local.workspace = true
omp-exec-reapi = { workspace = true, default-features = false }
omp-ext.workspace = true
omp-catalog.workspace = true
omp-con.workspace = true
omp-dom.workspace = true
omp-ai.workspace = true
omp-journal.workspace = true
omp-session.workspace = true
omp-ssh.workspace = true
omp-http.workspace = true
omp-serve.workspace = true
omp-memory.workspace = true
omp-proto = { workspace = true, features = ["tonic"] }
omp-rpc.workspace = true
omp-secrets.workspace = true
omp-cache.workspace = true
omp-observability.workspace = true
omp-tool.workspace = true
omp-tools.workspace = true
omp-vcs.workspace = true
omp-walker.workspace = true
parking_lot.workspace = true
