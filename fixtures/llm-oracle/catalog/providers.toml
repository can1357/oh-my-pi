[providers."xai"]
# pi PR #7454: first-party xAI routes through /v1/responses like SuperGrok.
# api.x.ai rejects presence/frequency penalties and stop sequences on its
# Grok reasoning routes (pi 3fb57803f3, 86866b8bbf).
transport = "open-ai-responses"
base_url = "https://api.x.ai/v1"
auth = { type = "bearer", env = ["OMP_XAI_API_KEY"] }
discovery = { kind = "open-ai-models", label = "xAI API", authoritative = false }
facets = ["chat", "image_generation"]
compat = { "tool_strict_mode" = "none", "penalties" = false, "stop_sequences" = false }

