# Pi provider registry reconciliation. Model identities, pricing, and limits live in generated JSON.
# Every table below corresponds to one entry in packages/ai/src/registry/registry.ts.

[providers."azure"]
transport = "open-ai-chat"
base_url = "https://{region}.openai.azure.com/openai/deployments/{deployment}"
api_version = "2024-10-21"
auth = { type = "header", name = "api-key", env = ["OMP_AZURE_OPENAI_API_KEY"] }
facets = ["chat", "audio_speech", "audio_transcription"]
pending_facets = ["image_generation"]
pending_transport = "open-ai-images"
compat = { "reasoning_wire_format" = "open_ai", "audio_api_version" = "2025-04-01-preview" }

[providers."openai-codex"]
transport = "open-ai-codex"
codex_transport = "websocket-preferred"
base_url = "https://chatgpt.com/backend-api"
auth = { type = "bearer", env = ["OMP_OPENAI_CODEX_OAUTH_TOKEN"] }
oauth_flow = "openai-codex"
discovery = { kind = "specialized", label = "ChatGPT Plus/Pro (Codex Subscription)", authoritative = false }
facets = ["chat", "image_generation"]
compat = { "max_tokens_field" = "max_output_tokens", "reasoning_wire_format" = "open_ai_responses", "stream_protocol" = "sse_events" }
usage = true

[providers."anthropic"]
transport = "anthropic-messages"
base_url = "https://api.anthropic.com"
auth = { type = "header", name = "x-api-key", env = ["OMP_ANTHROPIC_FOUNDRY_API_KEY", "OMP_ANTHROPIC_API_KEY"] }
oauth_flow = "anthropic"
oauth_auth = { type = "bearer", env = ["OMP_ANTHROPIC_OAUTH_TOKEN"] }
discovery = { kind = "account-models", label = "Claude subscription", path = "/api/claude_cli/bootstrap?model=claude-sonnet-5", authoritative = false }
facets = ["chat"]
headers = { "anthropic-version" = "2023-06-01" }
compat = { "multiple_system_messages" = false, "max_tokens_field" = "max_tokens", "tool_strict_mode" = "none", "reasoning_wire_format" = "anthropic", "cache_control_format" = "anthropic", "image_encoding_format" = "anthropic_source", "tool_schema_flavor" = "anthropic", "stream_protocol" = "sse_events" }
usage = true

[providers."zai"]
transport = "anthropic-messages"
base_url = "https://api.z.ai/api/anthropic"
auth = { type = "bearer", env = ["OMP_ZAI_API_KEY"] }
oauth_flow = "zai"
discovery = { kind = "open-ai-models", label = "zAI", authoritative = false }
facets = ["chat"]
compat = { "max_tokens_field" = "max_tokens", "reasoning_wire_format" = "zai", "leaked_thinking_healer" = "thinking" }
usage = true
[providers."zai-search"]
transport = "embedded"
codec = "search-zai"
route_transport = "http"
base_url = "https://api.z.ai/api/paas/v4"
auth = { type = "bearer", env = ["OMP_ZAI_API_KEY"] }
mapping = { kind = "replacement", component = "tool-runtime", reason = "Z.AI hosted search is a standalone search route" }
facets = ["web_search"]

[providers."zai-coding-plan"]
transport = "anthropic-messages"
base_url = "https://api.z.ai/api/anthropic"
auth = { type = "bearer", env = ["OMP_ZAI_API_KEY"] }
mapping = { kind = "alias", target = "zai", reason = "Pi keeps a sign-in-only id whose minted key is stored under zai" }
facets = ["chat"]

[providers."kimi-code"]
